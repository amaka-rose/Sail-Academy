    }
    const k = Math.min(1, dt*3);
    this.cam.x += (tx - this.cam.x)*k; this.cam.y += (ty - this.cam.y)*k; this.cam.s += (ts - this.cam.s)*k;
  }

  draw(race, opts){
    const ctx = this.ctx, cv = this.cv, dpr = cv._dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const W = cv._w, H = cv._h, s = this.cam.s, now = performance.now()/1000;
    // ---- acqua: colore profondo, texture che segue il campo e si muove col vento ----
    const g = ctx.createLinearGradient(0, 0, W*0.3, H);
    g.addColorStop(0,'#2b8fc7'); g.addColorStop(0.55,'#1b6fa6'); g.addColorStop(1,'#0f4f7c');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    const md = race.wind.meanTwd(race.t) * D2R;
    const layer = (pat, tileM, drift, alpha) => {
      const k = s * tileM / 512, o = this.w2s(0, 0);
      const dv = dirVec(race.wind.meanTwd(race.t) + 180), dd = drift * race.t;
      const m = new DOMMatrix().translateSelf(o.x + dv.x*dd*s, o.y + dv.y*dd*s).rotateSelf(md / D2R).scaleSelf(k, k);
      try { pat.setTransform(m); } catch(e){}
      ctx.globalAlpha = alpha; ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    };
    layer(this.texA, 90, 0.8, 0.8);
    layer(this.texA, 260, 0.3, 0.5);
    // riflessi di sole che scintillano
    {
      const cell = s > 5 ? 9 : 22, x0 = Math.floor((this.cam.x - W/2/s)/cell)*cell, y0 = Math.floor((this.cam.y - H/2/s)/cell)*cell, slot = Math.floor(now*3);
      ctx.fillStyle = '#fff';
      for (let x = x0; x < this.cam.x + W/2/s + cell; x += cell) for (let y = y0; y < this.cam.y + H/2/s + cell; y += cell){
        const h = ((x*2654435761) ^ (y*40503) ^ (slot*97)) >>> 0;
        if (h % 23) continue;
        const c = this.w2s(x + (h % cell), y + ((h >> 5) % cell)), a = 0.35 + ((h >> 9) % 60)/100, z = 1 + ((h >> 3) % 3)*0.6;
        ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(c.x - 3*z, c.y); ctx.lineTo(c.x, c.y - 0.8*z); ctx.lineTo(c.x + 3*z, c.y); ctx.lineTo(c.x, c.y + 0.8*z); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // raffiche (acqua scura e increspata) e buchi di vento (acqua chiara e liscia)
    for (const p of race.wind.puffs){
      const q = race.wind.puffPos(p, race.t);
      const c = this.w2s(q.x, q.y), r = p.rad*s;
      if (c.x < -r || c.x > W+r || c.y < -r || c.y > H+r) continue;
      const rg = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
      const rot = md + Math.PI/2;
      if (p.lull){
        rg.addColorStop(0,'rgba(200,238,255,0.40)'); rg.addColorStop(0.6,'rgba(175,225,248,0.18)'); rg.addColorStop(1,'rgba(175,225,248,0)');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r*0.75, rot, 0, 6.283); ctx.fill();
      } else {
        rg.addColorStop(0,'rgba(2,20,46,0.55)'); rg.addColorStop(0.55,'rgba(4,26,56,0.35)'); rg.addColorStop(1,'rgba(4,26,56,0)');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r*0.75, rot, 0, 6.283); ctx.fill();
        // "zampe di gatto": increspature fitte e scure dentro la raffica
        const k = s * 40 / 512, m = new DOMMatrix().translateSelf(c.x, c.y).rotateSelf(md / D2R).scaleSelf(k, k);
        try { this.texB.setTransform(m); } catch(e){}
        for (const [fr, al] of [[0.92, 0.22], [0.72, 0.25], [0.5, 0.28], [0.3, 0.3]]){   // bordi sfumati
          ctx.save(); ctx.beginPath(); ctx.ellipse(c.x, c.y, r*fr, r*fr*0.73, rot, 0, 6.283); ctx.clip();
          ctx.globalAlpha = al; ctx.fillStyle = this.texB; ctx.fillRect(c.x - r, c.y - r, 2*r, 2*r); ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
    }
    // increspature: perpendicolari al vento locale, più fitte e bianche dove c'è più vento
    const step = s > 6 ? 11 : (s > 2.5 ? 24 : 48);
    const x0 = Math.floor((this.cam.x - W/2/s)/step)*step, y0 = Math.floor((this.cam.y - H/2/s)/step)*step;
    ctx.lineCap = 'round';
    for (let x = x0; x < this.cam.x + W/2/s + step; x += step)
      for (let y = y0; y < this.cam.y + H/2/s + step; y += step){
        const hsh = ((x*73856093) ^ (y*19349663)) >>> 0;
        const jx = (hsh % 7) - 3, jy = ((hsh >> 3) % 7) - 3;
        const wx = x + jx, wy = y + jy;
        const w = race.wind.at(wx, wy, race.t);
        const k = clamp((w.tws - 6.5) / 7, 0, 1);
        if (k < 0.12 && (hsh % 3)) continue;              // acqua liscia nei buchi
        const c = this.w2s(wx, wy + ((now*0.8 + (hsh%10)) % 3));
        const len = (3 + 6*k) * Math.min(1.4, Math.max(0.6, s/7));
        const a = (w.twd) * D2R;                         // cresta perpendicolare al vento
        const ux = Math.cos(a), uy = Math.sin(a);
        ctx.strokeStyle = `rgba(255,255,255,${0.04 + 0.18*k})`; ctx.lineWidth = 1 + k*0.6;
        ctx.beginPath(); ctx.moveTo(c.x - ux*len, c.y - uy*len); ctx.quadraticCurveTo(c.x - Math.sin(a)*2.5, c.y + Math.cos(a)*-2.5, c.x + ux*len, c.y + uy*len); ctx.stroke();
        // creste bianche ("pecorelle") con vento forte
        if (w.tws > 12.6 && (hsh % 5) === 0){
          const f = 0.5 + 0.5*Math.sin(now*3 + hsh);
          ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.45*f})`; ctx.beginPath(); ctx.ellipse(c.x, c.y, 2.6*f + 1, 1.2, a, 0, 6.283); ctx.fill();
        }
      }

    // onda formata: creste che avanzano col vento (più chiare e con schiuma se alte)
    const Wd = race.wind;
    if (Wd.H){
      const md = Wd.meanTwd(race.t), u = dirVec(md + 180), cr = dirVec(md + 90);
      const cx = this.cam.x, cy = this.cam.y, half = Math.hypot(W, H)/2/s + Wd.lambda;
      const p0 = cx*u.x + cy*u.y, off = Wd.wc*race.t;
      const n0 = Math.floor((p0 - half - off)/Wd.lambda), n1 = Math.ceil((p0 + half - off)/Wd.lambda);
      for (let n = n0; n <= n1; n++){
        const pp = n*Wd.lambda + off, d = pp - p0;
        const mx = cx + u.x*d, my = cy + u.y*d;
        // cavo d'onda: banda morbida e scura subito sottovento alla cresta
        const tm = this.w2s(mx + u.x*Wd.lambda*0.3, my + u.y*Wd.lambda*0.3);
        const a0 = this.w2s(mx, my);
        ctx.save(); ctx.translate(tm.x, tm.y); ctx.rotate(Math.atan2(cr.y, cr.x));
        const bw = Wd.lambda*0.45*s, gr = ctx.createLinearGradient(0, -bw/2, 0, bw/2);
        gr.addColorStop(0, 'rgba(3,30,60,0)'); gr.addColorStop(0.5, `rgba(3,30,60,${0.05 + 0.10*Wd.H})`); gr.addColorStop(1, 'rgba(3,30,60,0)');
        ctx.fillStyle = gr; ctx.fillRect(-half*s, -bw/2, 2*half*s, bw); ctx.restore();
        // cresta ondulata
        ctx.strokeStyle = `rgba(255,255,255,${0.12 + 0.28*Wd.H})`; ctx.lineWidth = 1.2 + Wd.H*1.5;
        ctx.beginPath();
        for (let q = -half; q <= half; q += 3){
          const wob = Math.sin(q*0.35 + n*1.7) * Wd.lambda*0.05;
          const pt = this.w2s(mx + cr.x*q + u.x*wob, my + cr.y*q + u.y*wob);
          q === -half ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }
    }
    // corrente: particelle d'acqua che scorrono
    if (Wd.cur.kn){
      const cell = 12, k = Wd.cur.kn;
      const gx0 = Math.floor((this.cam.x - W/2/s)/cell)*cell, gy0 = Math.floor((this.cam.y - H/2/s)/cell)*cell;
      ctx.fillStyle = 'rgba(210,240,255,0.55)';
      for (let x = gx0; x < this.cam.x + W/2/s + cell; x += cell) for (let y = gy0; y < this.cam.y + H/2/s + cell; y += cell){
        const h = ((x*92821) ^ (y*68917)) >>> 0;
        const ox = ((Wd.cur.x*race.t*TIME_SCALE + (h % cell)) % cell + cell) % cell, oy = ((Wd.cur.y*race.t*TIME_SCALE + ((h>>4) % cell)) % cell + cell) % cell;
        const c = this.w2s(x + ox, y + oy);
        const dx = Wd.cur.x/(k*KN), dy = Wd.cur.y/(k*KN), L = 3 + 3*k;
        ctx.globalAlpha = 0.25 + 0.25*k; ctx.strokeStyle = 'rgba(220,245,255,0.9)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(c.x - dx*L, c.y - dy*L); ctx.lineTo(c.x, c.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(c.x, c.y, 1.4, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const me = race.boat(opts.viewId) || race.me();
    this._twd = race.wind.at(this.cam.x, this.cam.y, race.t).twd; this._cur = race.wind.cur;

    // laylines (aiuto per ragazzi)
    if (opts.laylines && me && me.started && me.nextMark < race.marks.length){
      const M = race.marks[me.nextMark];
      const w = race.wind.at(M.x, M.y, race.t);
      ctx.setLineDash([6,8]); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.4;
      const up = M.y < me.y;
      for (const sd of [-1,1]){
        const h = norm360(w.twd + 180 + sd*(up ? me.C.ch : 30));
        const d = dirVec(h); const a = this.w2s(M.x, M.y), b = this.w2s(M.x + d.x*400, M.y + d.y*400);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // linea di partenza / arrivo
    if (race.committee){
      const a = this.w2s(race.pin.x, race.pin.y), b = this.w2s(race.committee.x, race.committee.y);
      ctx.save(); ctx.shadowColor = 'rgba(255,255,255,0.6)'; ctx.shadowBlur = 6;
      ctx.setLineDash([10,7]); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      this.drawMark(a, '#ff8c1a', s, tx('Boa partenza','Pin end'), false, now);
      this.drawCommittee(b, s, race.flags());
    }
    // boe e zona (3 lunghezze)
    race.marks.forEach((m, i) => {
      const c = this.w2s(m.x, m.y);
      const isNext = me && me.nextMark === i && me.started;
      if (opts.zone && me){
        ctx.strokeStyle = isNext ? 'rgba(255,224,102,0.75)' : 'rgba(255,255,255,0.2)'; ctx.setLineDash([5,6]); ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(c.x, c.y, 3*me.C.len*s, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
        if (isNext && s > 4){ ctx.fillStyle = 'rgba(255,224,102,0.8)'; ctx.font = '600 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText(tp('zona','zone'), c.x, c.y + 3*me.C.len*s + 12); }
      }
      this.drawMark(c, isNext ? '#ffcc33' : '#ff8c1a', s, markName(i), isNext, now);
    });

    // scie: una traccia morbida che sfuma
    for (const b of race.boats.values()){
      if (b.trail.length < 3) continue;
      const tr = b.trail.slice(-28), n = tr.length, last = this.w2s(b.x, b.y);
      for (let seg = 0; seg < 4; seg++){
        const i0 = Math.floor(n*seg/4), i1 = Math.floor(n*(seg+1)/4);
        ctx.strokeStyle = `rgba(255,255,255,${0.03 + 0.04*seg})`; ctx.lineWidth = clamp(s*(0.25 + 0.12*seg), 1, 7); ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = i0; i <= Math.min(i1, n-1); i++){ const c = this.w2s(tr[i].x, tr[i].y); i === i0 ? ctx.moveTo(c.x, c.y) : ctx.lineTo(c.x, c.y); }
        if (seg === 3) ctx.lineTo(last.x, last.y);
        ctx.stroke();
      }
    }
    // settore dell'angolo morto (bambini)
    if (opts.nogo && me && !me.finished){
      const c = this.w2s(me.x, me.y), R = Math.max(46, me.C.len*s*3.4);
      const a1 = (me.twd - me.C.nogo - 90)*D2R, a2 = (me.twd + me.C.nogo - 90)*D2R;
      const rg = ctx.createRadialGradient(c.x,c.y,R*0.2,c.x,c.y,R);
      rg.addColorStop(0,'rgba(239,83,80,0.28)'); rg.addColorStop(1,'rgba(239,83,80,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.arc(c.x,c.y,R,a1,a2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '700 11px system-ui'; ctx.textAlign='center';
      const am = (me.twd - 90)*D2R; ctx.fillText(tp('angolo morto','no-go zone'), c.x + Math.cos(am)*R*0.82, c.y + Math.sin(am)*R*0.82);
    }
    // barche
    for (const b of race.boats.values()) this.drawBoat(b, s, b.id === (me && me.id), opts, now);
  }

  drawMark(c, col, s, label, hi, now){
    const ctx = this.ctx, r = Math.max(6.5, 0.95*s);
    if (this._cur && this._cur.kn){   // scia della corrente dietro la boa
      const dx = this._cur.x/(this._cur.kn*KN), dy = this._cur.y/(this._cur.kn*KN), L = r*(2 + 3*this._cur.kn);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
      for (const sd of [-1, 1]){ ctx.beginPath(); ctx.moveTo(c.x + dy*sd*r*0.6, c.y - dx*sd*r*0.6); ctx.quadraticCurveTo(c.x + dx*L*0.5 + dy*sd*r, c.y + dy*L*0.5 - dx*sd*r, c.x + dx*L + dy*sd*r*1.5, c.y + dy*L - dx*sd*r*1.5); ctx.stroke(); }
    }
    if (hi){ ctx.strokeStyle = 'rgba(255,224,102,0.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(c.x, c.y, r + 7 + 3*Math.sin(now*4), 0, 6.283); ctx.stroke(); }
    // anelli d'acqua attorno alla boa
    for (let i = 0; i < 2; i++){ const ph = ((now*0.6 + i*0.5) % 1); ctx.strokeStyle = `rgba(255,255,255,${0.35*(1-ph)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(c.x, c.y, r*(1.1 + ph*1.2), r*(1.0 + ph*1.0), 0, 0, 6.283); ctx.stroke(); }
    // ombra, corpo gonfiabile con luce e riflesso
    ctx.fillStyle = 'rgba(0,20,40,0.35)'; ctx.beginPath(); ctx.ellipse(c.x + r*0.35, c.y + r*0.45, r*1.02, r*0.9, 0, 0, 6.283); ctx.fill();
    const g = ctx.createRadialGradient(c.x - r*0.4, c.y - r*0.45, r*0.1, c.x, c.y, r*1.05);
    g.addColorStop(0, '#fff7d6'); g.addColorStop(0.25, col); g.addColorStop(0.8, shade(col.startsWith('#') ? col : '#ff8c1a', -35)); g.addColorStop(1, '#7a2e00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1, r*0.12); ctx.beginPath(); ctx.arc(c.x, c.y, r*0.62, Math.PI*1.05, Math.PI*1.55); ctx.stroke();
    if (this._twd != null) windFlag(ctx, c.x, c.y, this._twd, Math.max(9, r*1.1), now);
    if (label) this.label(c.x, c.y - r - 12, label, hi ? '#ffcc33' : 'rgba(10,30,55,0.78)', hi ? '#3a2700' : '#fff');
  }
  label(x, y, txt, bg, fg, dot){
    const ctx = this.ctx; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
    const w = ctx.measureText(txt).width + (dot ? 18 : 12), h = 17;
    ctx.fillStyle = bg; roundRect(ctx, x - w/2, y - h/2, w, h, 8); ctx.fill();
    if (dot){ ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x - w/2 + 9, y, 4, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = fg; ctx.fillText(txt, x + (dot ? 4 : 0), y + 4);
  }
  drawCommittee(c, s, flags){
    // motoscafo del Comitato in scala reale: 8 m x 3 m, prua verso destra, all'estremo della linea
    const ctx = this.ctx, L = Math.max(34, 8*s), B = Math.max(13, 3*s);
    ctx.save(); ctx.translate(c.x + L*0.5, c.y);
    ctx.fillStyle = 'rgba(0,20,40,0.32)'; ctx.beginPath(); ctx.ellipse(L*0.06, B*0.35, L*0.52, B*0.55, 0, 0, 6.283); ctx.fill();
    // scia leggera all'ancora
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(0, 0, L*0.58, B*0.75, 0, 0, 6.283); ctx.stroke();
    const hull = () => { ctx.beginPath(); ctx.moveTo(-L/2, -B/2); ctx.lineTo(L*0.18, -B/2); ctx.bezierCurveTo(L*0.42, -B/2, L*0.52, -B*0.15, L/2, 0); ctx.bezierCurveTo(L*0.52, B*0.15, L*0.42, B/2, L*0.18, B/2); ctx.lineTo(-L/2, B/2); ctx.closePath(); };
    const hg = ctx.createLinearGradient(0, -B/2, 0, B/2); hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.5, '#eef2f5'); hg.addColorStop(1, '#c9d3da');
    ctx.fillStyle = hg; ctx.strokeStyle = '#1f3b57'; ctx.lineWidth = Math.max(1.5, B*0.12); hull(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d9cfc0'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-L*0.46, -B*0.36, L*0.5, B*0.72, B*0.2) : ctx.rect(-L*0.46, -B*0.36, L*0.5, B*0.72); ctx.fill();   // pozzetto in teak
    const cg = ctx.createLinearGradient(0, -B*0.3, 0, B*0.3); cg.addColorStop(0, '#fdfdfd'); cg.addColorStop(1, '#cfd8dc');
    ctx.fillStyle = cg; roundRect(ctx, -L*0.12, -B*0.32, L*0.36, B*0.64, B*0.18); ctx.fill(); ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1; ctx.stroke();   // cabina
    ctx.fillStyle = '#263f57'; roundRect(ctx, L*0.12, -B*0.22, L*0.09, B*0.44, B*0.12); ctx.fill();   // parabrezza
    ctx.fillStyle = '#37474f'; for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.arc(-L*0.06 + i*L*0.07, -B*0.27, Math.max(1, B*0.05), 0, 6.283); ctx.fill(); }
    // asta delle bandiere
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-L*0.36, 0); ctx.lineTo(-L*0.36, -B/2 - 30); ctx.stroke();
    flags.forEach((f, i) => drawFlag(ctx, -L*0.36 + 2, -B/2 - 30 + i*13, 18, 12, f));
    ctx.restore();
    this.label(c.x + L*0.5, c.y + B/2 + 15, tx('Comitato','Committee'), 'rgba(10,30,55,0.78)', '#fff');
  }
  drawBoat(b, s, isMe, opts, now){
    const ctx = this.ctx, C = b.C, c = this.w2s(b.x, b.y);
    const vis = Math.max(1, 16/(C.len*s));   // in panoramica le barche restano visibili
    const L = C.len*s*vis, Bm = C.beam*s*vis;
    const sp = clamp(Math.abs(b.speed) / C.vmax, 0, 1.3);
    const side = -(b.tackSide || 1);                       // lato sottovento (+1 = destra della barca)
    const ghost = b.ghost;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(b.hdg*D2R);
    if (ghost) ctx.globalAlpha = 0.45;
    if (b.capsized) ctx.globalAlpha = 0.75;
    // ---- scia a V (onda di Kelvin) e schiuma di poppa ----
    if (b.speed > 0.5 && !b.capsized){
      const len = L*(0.8 + sp*2.2);
      for (const sx of [-1, 1]){
        const gr = ctx.createLinearGradient(0, L*0.45, 0, L*0.45 + len);
        gr.addColorStop(0, `rgba(255,255,255,${0.55*Math.min(1, sp+0.2)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = gr; ctx.lineWidth = Math.max(1, L*0.05);
        ctx.beginPath(); ctx.moveTo(sx*Bm*0.35, L*0.35); ctx.quadraticCurveTo(sx*Bm*0.8, L*0.45 + len*0.4, sx*(Bm*0.5 + len*0.36), L*0.45 + len); ctx.stroke();
      }
      const fg = ctx.createLinearGradient(0, L*0.45, 0, L*0.45 + L*1.2*(0.4+sp));
      fg.addColorStop(0, 'rgba(255,255,255,0.6)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-Bm*0.32, L*0.45); ctx.lineTo(Bm*0.32, L*0.45); ctx.lineTo(Bm*0.12, L*0.45 + L*1.2*(0.4+sp)); ctx.lineTo(-Bm*0.12, L*0.45 + L*1.2*(0.4+sp)); ctx.closePath(); ctx.fill();
      // onde di prua e spruzzi
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1, L*0.03);
      for (const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(0, -L*0.5); ctx.quadraticCurveTo(sx*Bm*0.75, -L*0.2, sx*Bm*(0.75 + sp*0.6), L*0.15); ctx.stroke(); }
      if (sp > 0.65){ ctx.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 6; i++){ const t = (now*3 + i*0.37) % 1, sx = i % 2 ? 1 : -1; ctx.beginPath(); ctx.arc(sx*(Bm*0.5 + t*Bm*0.9), -L*0.35 + t*L*0.3, Math.max(0.8, L*0.02*(1-t)), 0, 6.283); ctx.fill(); } }
    }
    // ---- ombra sull'acqua ----
    ctx.save(); ctx.translate(L*0.07 + side*L*0.03*Math.min(1, b.overload||0), L*0.09);
    ctx.fillStyle = 'rgba(0,18,40,0.32)'; this.hullPath(ctx, b, L*1.02, Bm*1.05); ctx.fill(); ctx.restore();
    // ---- scafo: fianchi colorati, coperta chiara, bordo ----
    const hg = ctx.createLinearGradient(-Bm/2, 0, Bm/2, 0);
    hg.addColorStop(0, shade(b.color, -30)); hg.addColorStop(0.45, shade(b.color, 12)); hg.addColorStop(1, shade(b.color, -30));
    ctx.fillStyle = hg; ctx.strokeStyle = isMe ? '#ffffff' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = isMe ? 2 : 1;
    this.hullPath(ctx, b, L, Bm); ctx.fill(); ctx.stroke();
    if (C.type === 'cat'){
      // trampolino con rete e traverse
      const tw = Bm*0.82, ty = -L*0.08, th = L*0.4;
      ctx.fillStyle = 'rgba(25,30,38,0.82)'; ctx.fillRect(-tw/2, ty, tw, th);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      for (let i = 1; i < 8; i++){ const x = -tw/2 + tw*i/8; ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x, ty + th); ctx.stroke(); }
      for (let i = 1; i < 6; i++){ const y = ty + th*i/6; ctx.beginPath(); ctx.moveTo(-tw/2, y); ctx.lineTo(tw/2, y); ctx.stroke(); }
      ctx.fillStyle = '#b0bec5'; ctx.fillRect(-Bm/2, ty - L*0.02, Bm, L*0.035); ctx.fillRect(-Bm/2, ty + th, Bm, L*0.035);
    } else if (C.type === 'board'){
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = Math.max(1, Bm*0.06); ctx.beginPath(); ctx.moveTo(0, -L*0.42); ctx.lineTo(0, L*0.42); ctx.stroke();
      ctx.fillStyle = 'rgba(30,30,30,0.35)'; ctx.fillRect(-Bm*0.25, L*0.15, Bm*0.5, L*0.22);   // pad antiscivolo
    } else {
      ctx.save(); ctx.scale(0.8, 0.88); const dg = ctx.createLinearGradient(-Bm/2, 0, Bm/2, 0); dg.addColorStop(0, '#e9eef2'); dg.addColorStop(0.5, '#ffffff'); dg.addColorStop(1, '#e3e9ee');
      ctx.fillStyle = dg; this.hullPath(ctx, b, L, Bm); ctx.fill(); ctx.restore();                         // coperta
      ctx.fillStyle = 'rgba(120,135,150,0.35)'; roundRect(ctx, -Bm*0.24, -L*0.05, Bm*0.48, L*0.42, Bm*0.12); ctx.fill();   // pozzetto
      ctx.fillStyle = '#455a64'; ctx.fillRect(-Bm*0.04, -L*0.02, Bm*0.08, L*0.12);                            // scassa della deriva
    }
    // ---- vela: profilo con volume, stecche e boma ----
    const mastY = C.type === 'cat' ? -L*0.08 : (C.type === 'board' ? -L*0.05 : -L*0.24);
    const boom = L * (C.type === 'cat' ? 0.58 : (C.type==='board' ? 0.48 : 0.64));
    const ang = side * (b.sailAngle != null ? b.sailAngle : b.sheet*85) * D2R;
    const ex = Math.sin(ang)*boom, ey = mastY + Math.cos(ang)*boom;
    const luff = (b.trimErr || 0) > 8 || b.irons || b.capsized;
    const nx = Math.cos(ang)*side, ny = -Math.sin(ang)*side;            // normale verso sottovento
    if (luff){
      ctx.fillStyle = 'rgba(245,248,252,0.9)'; ctx.strokeStyle = 'rgba(90,110,130,0.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, mastY);
      for (let i = 1; i <= 8; i++){ const t = i/8, wob = Math.sin(now*17 + i*2.2)*L*0.07*(1 - Math.abs(t - 0.5)*1.3); ctx.lineTo(ex*t + nx*wob, mastY + (ey - mastY)*t + ny*wob); }
      for (let i = 7; i >= 0; i--){ const t = i/8, wob = Math.sin(now*17 + i*2.2 + 1)*L*0.04*(1 - Math.abs(t - 0.5)*1.3); ctx.lineTo(ex*t + nx*wob, mastY + (ey - mastY)*t + ny*wob); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      const draft = L * 0.16 * (C.type === 'board' ? 0.7 : 1) * (0.6 + 0.4*Math.min(1, b.eff||1));
      const mx = ex/2, my = mastY + (ey - mastY)/2;
      const sg = ctx.createLinearGradient(0, mastY, ex + nx*draft, ey + ny*draft);
      sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.6, '#eef3f8'); sg.addColorStop(1, '#c9d6e2');
      ctx.fillStyle = sg; ctx.strokeStyle = 'rgba(70,90,110,0.75)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, mastY);
      ctx.quadraticCurveTo(mx + nx*draft*1.6, my + ny*draft*1.6, ex, ey);        // balumina gonfia
      ctx.quadraticCurveTo(mx + nx*draft*0.5, my + ny*draft*0.5, 0, mastY);       // bordo d'attacco sul boma
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(70,90,110,0.45)'; ctx.lineWidth = 1;
      for (const t of [0.3, 0.55, 0.8]){ const px = ex*t, py = mastY + (ey - mastY)*t, k = Math.sin(Math.PI*t); ctx.beginPath(); ctx.moveTo(px + nx*draft*0.45*k, py + ny*draft*0.45*k); ctx.lineTo(px + nx*draft*1.05*k, py + ny*draft*1.05*k); ctx.stroke(); }
      ctx.strokeStyle = '#2f3b45'; ctx.lineWidth = Math.max(1.6, L*0.028); ctx.beginPath(); ctx.moveTo(0, mastY); ctx.lineTo(ex, ey); ctx.stroke();   // boma
    }
    ctx.fillStyle = '#1f2a33'; ctx.beginPath(); ctx.arc(0, mastY, Math.max(2, L*0.035), 0, 6.283); ctx.fill();
    // ---- fiocco (420, Hobie 16): dalla prua, più piccolo, con la sua regolazione ----
    if (C.jib){
      const tackY = C.type === 'cat' ? -L*0.46 : -L*0.47, jl = L*(C.type === 'cat' ? 0.4 : 0.37);
      const ja = side * ((b.jibSheet != null ? b.jibSheet : b.sheet) * 50) * D2R;
      const jx = Math.sin(ja)*jl, jy = tackY + Math.cos(ja)*jl;
      const jn = { x: Math.cos(ja)*side, y: -Math.sin(ja)*side };
      const jluff = (b.jibErr || 0) > 8 || b.irons || b.capsized;
      ctx.strokeStyle = 'rgba(40,50,60,0.6)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, tackY); ctx.lineTo(0, mastY); ctx.stroke();   // strallo
      ctx.fillStyle = 'rgba(250,252,255,0.93)'; ctx.strokeStyle = 'rgba(70,90,110,0.75)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, tackY);
      if (jluff){ for (let i = 1; i <= 6; i++){ const tt = i/6, wob = Math.sin(now*19 + i*2.4)*L*0.05*(1 - Math.abs(tt - 0.5)*1.3); ctx.lineTo(jx*tt + jn.x*wob, tackY + (jy - tackY)*tt + jn.y*wob); } }
      else { const jd = L*0.12*(0.6 + 0.4*Math.min(1, b.eff||1)); ctx.quadraticCurveTo(jx/2 + jn.x*jd*1.5, tackY + (jy - tackY)/2 + jn.y*jd*1.5, jx, jy); ctx.quadraticCurveTo(jx/2 + jn.x*jd*0.4, tackY + (jy - tackY)/2 + jn.y*jd*0.4, 0, tackY); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // ---- spinnaker: pallone colorato davanti alla prua, sottovento ----
    if (b.spiUp > 0.05){
      const k = b.spiUp, coll = b.spiIssue === 'collapse', ta = Math.abs(b.twa || 180);
      const off = side * L * (0.12 + clamp((180 - ta)/80, 0, 1)*0.35);                // al lasco va di lato, in poppa davanti
      const cy = -L*0.5 - L*0.32*k, cx = off*k, rx = L*0.36*k*(coll ? 0.6 : 1), ry = L*0.22*k*(coll ? 0.5 : 1);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(off/L*0.6);
      const sg2 = ctx.createRadialGradient(-rx*0.3, -ry*0.3, 1, 0, 0, Math.max(rx, ry));
      sg2.addColorStop(0, '#ffffff'); sg2.addColorStop(0.35, shade(b.color || '#e53935', 20)); sg2.addColorStop(1, shade(b.color || '#e53935', -25));
      ctx.fillStyle = sg2; ctx.strokeStyle = 'rgba(40,40,40,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 20; i++){ const a = i/20*6.283, w = coll ? 1 + Math.sin(now*20 + i)*0.15 : 1; const px = Math.cos(a)*rx*w, py = Math.sin(a)*ry*w*(Math.sin(a) > 0 ? 0.55 : 1); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(30,30,30,0.5)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(0, -L*0.48); ctx.lineTo(cx - rx*0.7, cy + ry*0.3); ctx.moveTo(0, mastY); ctx.lineTo(cx + rx*0.7, cy + ry*0.3); ctx.stroke();   // scotte
    }
    // ---- equipaggio: seduto sopravvento, fuori dalla barca quando c'è tanto vento ----
    const crew = b.crewPos && b.crewPos.length ? b.crewPos : null;
    const hike = clamp(((b.overload||0) - 0.55) / 0.5, 0, 1);
    const people = [];
    const wSide = b.tackSide || 1;                                         // lato sopravvento (+1 = destra della barca)
    if (C.type === 'board'){ people.push({ x: wSide*Bm*0.9, y: -L*0.02, h: 0.4 + hike*0.6, col:'#263238' }); }
    else if (crew){ crew.forEach((p, i) => people.push({ x: (p.side || 0)*Bm*(0.42 + 0.55*(p.hike||0)) + (p.side ? 0 : (i % 2 ? 1 : -1)*Bm*0.08), y: (p.fore < 0 ? L*0.27 : p.fore > 0 ? -L*0.06 : L*0.1) + (i > 1 ? L*0.05 : 0), col: p.col || '#ff7043' })); }
    else {
      people.push({ x: wSide*Bm*(0.38 + 0.5*hike), y: L*0.26, col: '#ff7043' });
      if (C.type === 'cat' || b.cls === 'c420') people.push({ x: wSide*Bm*(0.42 + 0.6*hike), y: L*0.06, col: '#ffca28' });
    }
    for (const p of people){
      const r = Math.max(2.2, L*0.075);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(p.x + r*0.4, p.y + r*0.5, r*1.25, r, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(p.x, p.y + r*0.2, r*1.2, r*0.95, 0, 0, 6.283); ctx.fill();   // salvagente
      ctx.fillStyle = '#ffe0bd'; ctx.beginPath(); ctx.arc(p.x, p.y - r*0.15, r*0.6, 0, 6.283); ctx.fill();                // testa
      ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.arc(p.x, p.y - r*0.25, r*0.6, Math.PI, 2*Math.PI); ctx.fill();      // cappellino
    }
    ctx.restore();

    // etichetta con nome
    const ly = c.y - Math.max(22, L*0.78);
    let tag = b.name;
    if (opts.showTeams && (b.team === 0 || b.team === 1)) tag = (b.team ? '◆ ' : '● ') + tag;
    if (ghost) ctx.globalAlpha = 0.6;
    this.label(c.x, ly, tag, isMe ? 'rgba(255,255,255,0.95)' : 'rgba(10,30,55,0.72)', isMe ? '#0b3a5b' : '#fff', b.color);
    ctx.globalAlpha = 1;
    const badges = [];
    if (b.penalty > 0) badges.push([tx('GIRI ','TURNS ') + b.penalty, '#e53935']);
    if (b.ocs) badges.push(['OCS', '#8e24aa']);
    if (b.capsized) badges.push([tx('SCUFFIA','CAPSIZED'), '#fb8c00']);
    if (b.finished) badges.push([tx('ARRIVATA','FINISHED'), '#2e7d32']);
    if (b.flying > 0.2 && !b.capsized) badges.push([b.C.type === 'cat' ? tx('SCAFO IN ARIA','FLYING HULL') : tx('SBANDA','HEELING'), '#f9a825']);
    badges.forEach((bd, i) => this.label(c.x, ly + 19 + i*19, bd[0], bd[1], '#fff'));
    // fumetti: "Protesto!" e chiamate di bordo
    const bubble = (t, col, k) => {
      const bx = c.x + Math.max(26, L*0.6), by = c.y - Math.max(34, L) - k*28;
      ctx.font = '800 13px system-ui'; const w = ctx.measureText(t).width + 16;
      ctx.fillStyle = col; roundRect(ctx, bx, by - 13, w, 24, 10); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx + 6, by + 10); ctx.lineTo(bx - 4, by + 20); ctx.lineTo(bx + 16, by + 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(t, bx + 8, by + 4);
    };
    let k = 0;
    if (b.hailUntil && performance.now() < b.hailUntil) bubble(tx('Protesto!','Protest!'), '#c62828', k++);
    if (b.callText && performance.now() < (b.callUntil||0)) bubble(b.callText, '#1565c0', k++);
  }
  hullPath(ctx, b, L, Bm){
    const C = b.C; ctx.beginPath();
    if (C.type === 'cat'){
      const hw = Bm*0.16;
      for (const sx of [-1,1]){
        const x = sx*Bm*0.42;
        ctx.moveTo(x, -L/2); ctx.bezierCurveTo(x + hw, -L*0.3, x + hw, L*0.3, x + hw*0.5, L/2); ctx.lineTo(x - hw*0.5, L/2); ctx.bezierCurveTo(x - hw, L*0.3, x - hw, -L*0.3, x, -L/2); ctx.closePath();
      }
    } else if (C.type === 'board'){
      ctx.moveTo(0,-L/2); ctx.bezierCurveTo(Bm*0.55, -L*0.32, Bm*0.55, L*0.2, Bm*0.38, L/2); ctx.lineTo(-Bm*0.38, L/2); ctx.bezierCurveTo(-Bm*0.55, L*0.2, -Bm*0.55, -L*0.32, 0, -L/2); ctx.closePath();
    } else if (b.cls === 'optimist'){
      ctx.moveTo(-Bm*0.3,-L/2); ctx.lineTo(Bm*0.3,-L/2); ctx.bezierCurveTo(Bm*0.52,-L*0.3, Bm*0.52, L*0.2, Bm*0.45, L/2); ctx.lineTo(-Bm*0.45, L/2); ctx.bezierCurveTo(-Bm*0.52, L*0.2, -Bm*0.52, -L*0.3, -Bm*0.3, -L/2); ctx.closePath();
    } else {
      ctx.moveTo(0,-L/2); ctx.bezierCurveTo(Bm*0.42, -L*0.38, Bm*0.56, -L*0.02, Bm*0.44, L/2); ctx.lineTo(-Bm*0.44, L/2); ctx.bezierCurveTo(-Bm*0.56, -L*0.02, -Bm*0.42, -L*0.38, 0, -L/2); ctx.closePath();
    }
  }

  // freccia verso la prossima boa quando è fuori schermo
  drawEdgeArrow(race, b){
    if (!b || !b.started || b.finished) return;
    const ctx = this.ctx, W = this.cv._w, H = this.cv._h;
    const target = b.nextMark < race.marks.length ? { ...race.marks[b.nextMark], n: markName(b.nextMark) } : { x:0, y:0, n: tx('Arrivo','Finish') };
    const c = this.w2s(target.x, target.y);
    if (c.x > 30 && c.x < W-30 && c.y > 30 && c.y < H-30) return;
    const a = Math.atan2(c.y - H/2, c.x - W/2);
    const rx = W/2 - 40, ry = H/2 - 60;
    const k = Math.min(rx/Math.abs(Math.cos(a) || 1e-6), ry/Math.abs(Math.sin(a) || 1e-6));
    const x = W/2 + Math.cos(a)*k*0.92, y = H/2 + Math.sin(a)*k*0.92;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-10,-11); ctx.lineTo(-5,0); ctx.lineTo(-10,11); ctx.closePath(); ctx.fill();
    ctx.restore();
    const d = Math.hypot(target.x - b.x, target.y - b.y);
    this.label(x, y + 24, `${target.n} · ${Math.round(d)} m`, 'rgba(10,30,55,0.8)', '#ffcc33');
  }

  // ------------------------------------------------------------------
  // Rosa del vento (scheda informazioni)
  // ------------------------------------------------------------------
  drawDial(b, twdFallback){
    const ctx = this.dctx, cv = this.dial, dpr = cv._dpr, W = cv._w, H = cv._h;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const r = Math.min(W,H)/2 - 2, cx = W/2, cy = H/2;
    const g = ctx.createRadialGradient(cx, cy - r*0.3, r*0.1, cx, cy, r);
    g.addColorStop(0, '#2c6e99'); g.addColorStop(1, '#0d3554');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    for (let i=0;i<12;i++){ const a = i*Math.PI/6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a)*r*0.82, cy + Math.sin(a)*r*0.82); ctx.lineTo(cx + Math.cos(a)*r*0.95, cy + Math.sin(a)*r*0.95); ctx.stroke(); }
    const twd = b ? b.twd : twdFallback;
    // barca al centro (orientata come in mappa)
    if (b){
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(b.hdg*D2R);
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.moveTo(0, -r*0.32); ctx.quadraticCurveTo(r*0.13, 0, r*0.1, r*0.3); ctx.lineTo(-r*0.1, r*0.3); ctx.quadraticCurveTo(-r*0.13, 0, 0, -r*0.32); ctx.fill();
      ctx.restore();
    }
    // corrente (freccia arancione verso cui scorre l'acqua)
    if (this._cur && this._cur.kn){
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(this._cur.dir*D2R);
      ctx.strokeStyle = '#ffb74d'; ctx.fillStyle = '#ffb74d'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, r*0.5); ctx.lineTo(0, -r*0.62); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -r*0.85); ctx.lineTo(-r*0.12, -r*0.6); ctx.lineTo(r*0.12, -r*0.6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // freccia del vento che arriva da twd
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(twd*D2R);
    ctx.fillStyle = '#7fd3ff'; ctx.strokeStyle = '#7fd3ff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -r*0.92); ctx.lineTo(0, -r*0.45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r*0.36); ctx.lineTo(-r*0.13, -r*0.55); ctx.lineTo(r*0.13, -r*0.55); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Strumenti: triangolo del vento apparente + filetti segnavento
  // ------------------------------------------------------------------
  drawInstruments(b, simple){
    const ctx = this.ictx, cv = this.inst, dpr = cv._dpr, W = cv._w, H = cv._h;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if (!b) return;
    const half = W/2;
    const small = W < 260;
    // --- sinistra: vettori del vento (barca vista con la prua in alto) ---
    const cx = half/2, cy = H/2 + 7, k = (Math.min(half, H)/2 - 12) / Math.max(b.aws||0, b.speed||0, 8);
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.moveTo(0,-15); ctx.quadraticCurveTo(7,0,5,15); ctx.lineTo(-5,15); ctx.quadraticCurveTo(-7,0,0,-15); ctx.fill();
    const arrow = (vx, vy, col, label, fx0=0, fy0=0) => {
      const fromX = fx0*k, fromY = fy0*k, ex = fromX + vx*k, ey = fromY + vy*k;
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';

      const a = Math.atan2(ey-fromY, ex-fromX);
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 9*Math.cos(a-0.45), ey - 9*Math.sin(a-0.45)); ctx.lineTo(ex - 9*Math.cos(a+0.45), ey - 9*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
      ctx.font = '800 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, (fromX+ex)/2 - Math.sin(a)*10, (fromY+ey)/2 + Math.cos(a)*10 + 4);
    };
    const tw = dirVec(b.twa + 180); const twx = tw.x*b.tws, twy = tw.y*b.tws;
    const vvx = 0, vvy = b.speed;
    const awx = twx + vvx, awy = twy + vvy;
    if (!simple){
      arrow(awx, awy, '#81c784', LANG.cur === 'en' ? 'AW' : 'VA', -awx, -awy);
      arrow(twx, twy, '#64b5f6', LANG.cur === 'en' ? 'TW' : 'VR', -awx, -awy);
      arrow(vvx, vvy, '#ffb74d', LANG.cur === 'en' ? 'BW' : 'VV', -vvx, -vvy);
    } else arrow(awx, awy, '#81c784', '', -awx, -awy);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(simple ? tx('Il vento che senti','The wind you feel') : (LANG.cur === 'en' ? 'TW + BW = AW' : 'VR + VV = VA'), cx, 11);

    // --- destra: filetti segnavento (tre coppie: alto, centro, basso) ---
    const fx = half + 6, fw = half - 12;
    const jibBoat = !!(b.C && b.C.jib), crewView = typeof App !== 'undefined' && App.myRole === 'crew';
    const showJib = jibBoat && (crewView || (b.leadAllowed && b.leadAllowed() && !(b.crew && b.crew.length) && typeof App !== 'undefined' && App.myRole === 'helm'));
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(showJib ? tx('Filetti fiocco','Jib telltales') : jibBoat ? tx('Filetti randa','Main telltales') : tx('Filetti','Telltales'), half + half/2, 11);
    const top = 18, bot = H - 8, sx0 = fx + 6;
    const sg = ctx.createLinearGradient(fx, 0, fx + fw, 0); sg.addColorStop(0, 'rgba(255,255,255,0.95)'); sg.addColorStop(1, 'rgba(210,225,238,0.9)');
    ctx.fillStyle = sg; ctx.beginPath();
    if (showJib){ ctx.moveTo(sx0 + fw*0.45, top); ctx.quadraticCurveTo(sx0 + fw*0.7, H*0.5, fx + fw - 2, bot); ctx.lineTo(sx0, bot); ctx.closePath(); }     // fiocco: triangolo con lo strallo inclinato
    else { ctx.moveTo(sx0, top); ctx.quadraticCurveTo(fx + fw*0.55, H*0.35, fx + fw - 2, bot); ctx.lineTo(sx0, bot); ctx.closePath(); }
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,60,80,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
    if (showJib){ ctx.moveTo(sx0 + fw*0.45, top); ctx.lineTo(sx0, bot); } else { ctx.moveTo(sx0, top); ctx.lineTo(sx0, bot); } ctx.stroke();
    const e = showJib ? (b.jibErr || 0) : (b.trimErr || 0), t = performance.now()/90;
    const absAwa = Math.abs(b.awa);
    const dead = b.irons || b.speed < 0.3 || b.capsized;   // barca ferma: i filetti sbattono a caso
    const len = small ? 4 : 5.2;
    const tell = (x, y, col, mode, ph) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y);
      for (let i=1;i<=5;i++){
        let dy = 0; const xx = x + i*len;
        if (mode === 'up') dy = -i*2.6 + Math.sin(t + i + ph)*3.5; else if (mode === 'down') dy = i*2.6 + Math.sin(t*1.3 + i + ph)*2.5; else dy = Math.sin(t*0.6 + i + ph)*0.7;
        ctx.lineTo(xx, y + dy);
      }
      ctx.stroke();
    };
    // la parte alta della vela è più svergolata: fileggia per prima; la parte bassa stalla per prima
    const ld = showJib ? (b.leadD || 0) : 0;   // carrello: indietro -> rompe prima l'alto, avanti -> prima il basso
    [[0.25, 3 + 4*ld], [0.52, 0], [0.78, -3 - 4*ld]].forEach(([k, off], i) => {
      const y = top + (bot - top)*k, x = showJib ? sx0 + fw*0.45*(1 - (y - top)/(bot - top)) + 4 : sx0 + 6, eh = e + off;
      tell(x, y - 4, '#e53935', dead || eh > 6 ? 'up' : 'ok', i);
      tell(x, y + 4, '#2e7d32', dead ? 'down' : (eh < -8 && absAwa < 150 ? 'down' : 'ok'), i + 2);
    });
    if (!showJib){
      // filetto di balumina: vola dietro la vela se è regolata bene, si nasconde (si arriccia) se è troppo cazzata
      const lx = fx + fw*0.8, ly = H*0.62;
      ctx.strokeStyle = '#fb8c00'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(lx, ly);
      const hidden = !dead && e < -10 && absAwa < 150;
      for (let i = 1; i <= 4; i++){ const xx = hidden ? lx - i*3 : lx + i*4, yy = ly + (hidden ? -i*3 + Math.sin(t*1.5 + i)*2 : Math.sin(t*0.8 + i)*1); ctx.lineTo(xx, yy); }
      ctx.stroke();
    }
  }
}

// bandierina che sventola sottovento: indica da dove arriva il vento
function windFlag(ctx, x, y, twd, sz, now){
  const a = (twd + 90) * D2R; // direzione verso cui va il vento, in coordinate schermo
  const dx = Math.cos(a), dy = Math.sin(a);
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#263238'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -sz*1.6); ctx.stroke();
  ctx.translate(0, -sz*1.6);
  const wob = Math.sin(now*9 + x)*sz*0.12;
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(dx*sz*0.6 - dy*wob, dy*sz*0.6 + dx*wob - sz*0.15, dx*sz*1.3, dy*sz*1.3 - sz*0.2);
  ctx.lineTo(0, sz*0.45); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16); let r = n>>16, g = (n>>8)&255, b = n&255;
  const f = v => clamp(Math.round(v + (p > 0 ? (255 - v) : v) * p/100), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

// Bandiere del Codice Internazionale usate in partenza
function drawFlag(ctx, x, y, w, h, f){
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
  if (f === 'P'){ ctx.fillStyle = '#1e40af'; ctx.fillRect(0,0,w,h); ctx.fillStyle = '#fff'; ctx.fillRect(w*0.3,h*0.3,w*0.4,h*0.4); }
  else if (f === 'I'){ ctx.fillStyle = '#facc15'; ctx.fillRect(0,0,w,h); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(w/2,h/2,h*0.3,0,6.283); ctx.fill(); }
  else if (f === 'X'){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.fillStyle = '#1e40af'; ctx.fillRect(w*0.4,0,w*0.2,h); ctx.fillRect(0,h*0.38,w,h*0.24); }
  else if (f === 'CLASSE'){ ctx.fillStyle = '#16a34a'; ctx.fillRect(0,0,w,h); ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(h*0.7)}px system-ui`; ctx.textAlign='center'; ctx.fillText('C', w/2, h*0.78); }
  ctx.strokeRect(0,0,w,h);
  ctx.restore();
}

'use strict';
// =====================================================================
//  VISTA IN PRIMA PERSONA (finestrella PIP): timoniere o prodiere
//  Prospettiva semplice: orizzonte, mare con onde e raffiche, boe,
//  altre barche, la propria barca con vela e filetti. La barca sbanda
//  con il vento forte e beccheggia con l'onda.
// =====================================================================
class PipView {
  constructor(canvas){ this.cv = canvas; this.ctx = canvas.getContext('2d'); this.mode = 'off'; }
  resize(){
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width*dpr)); this.cv.height = Math.max(1, Math.round(r.height*dpr));
    this.dpr = dpr; this.W = r.width; this.H = r.height;
  }
  draw(race, b){
    if (this.mode === 'off' || !b || !this.W) return;
    const ctx = this.ctx, W = this.W, H = this.H, now = performance.now()/1000;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    const crew = this.mode === 'crew';
    const C = b.C, fwd = dirVec(b.hdg), right = dirVec(b.hdg + 90);
    // posizione dell'occhio: timoniere a poppa, prodiere avanti verso prua
    const along = crew ? C.len*0.25 : -C.len*0.42;
    const eye = { x: b.x + fwd.x*along, y: b.y + fwd.y*along, h: crew ? 0.9 : 1.15 };
    const F = W * 0.55;                                   // campo visivo ~85°
    // sbandamento (verso sottovento) e beccheggio sull'onda
    const heelDeg = (b.capsized ? 60 : clamp(6 + 14*Math.max(0, (b.overload||0) - 0.6), 0, 26)) * (b.speed > 0.2 || b.capsized ? 1 : 0.3);
    const heel = -(b.tackSide || 1) * heelDeg * D2R;
    // superficie del mare: onda lunga dal vento + mare corto sempre presente (più agitato con più vento)
    const Wd = race.wind, t = race.t, tws = b.tws || Wd.base0;
    const md = Wd.meanTwd(t);
    const A1 = Wd.H/2, chop = 0.035 + 0.011*tws;
    const comps = [];
    if (A1) comps.push({ a:A1, k:Wd.wk, u:dirVec(md + 180), c:Wd.wc });
    for (const [da, f, lm] of [[18, 1, 1], [-32, 0.65, 0.62], [70, 0.35, 0.4]]){
      const lam = (2.6 + 0.24*tws)*lm, k = 2*Math.PI/lam;
      comps.push({ a: chop*f, k, u: dirVec(md + 180 + da), c: 1.25*Math.sqrt(lam) });
    }
    const eta = (x, y) => { let z = 0; for (const q of comps) z += q.a * Math.cos(q.k*(x*q.u.x + y*q.u.y - q.c*t)); return z; };
    // la barca segue l'onda: sale, beccheggia e rolla
    const hl = C.len*0.45, hb = Math.max(0.5, C.beam*0.45);
    const zBow = eta(b.x + fwd.x*hl, b.y + fwd.y*hl), zSt = eta(b.x - fwd.x*hl, b.y - fwd.y*hl);
    const zR = eta(b.x + right.x*hb, b.y + right.y*hb), zL = eta(b.x - right.x*hb, b.y - right.y*hb);
    const heave = (zBow + zSt + zR + zL)/4;
    const pitch = Math.atan2(zBow - zSt, 2*hl) * 0.8, roll = Math.atan2(zL - zR, 2*hb) * 0.35;
    eye.h += heave*0.8;
    const horizon = H*0.42 + Math.tan(pitch)*F;
    ctx.save();
    ctx.translate(W/2, horizon); ctx.rotate(heel + roll); ctx.translate(-W/2, -horizon);
    // cielo con sole e nuvole (fissi rispetto al mondo: girando la barca si muovono)
    const sky = ctx.createLinearGradient(0, horizon - H, 0, horizon);
    sky.addColorStop(0, '#3f8fd6'); sky.addColorStop(0.7, '#9fd0f0'); sky.addColorStop(1, '#e6f4fb');
    ctx.fillStyle = sky; ctx.fillRect(-W, horizon - 2*H, 3*W, 2*H);
    const bx = brg => { const rel = norm180(brg - b.hdg) * D2R; return Math.abs(rel) < 1.2 ? W/2 + Math.tan(rel)*F : null; };
    const sunX = bx(200);
    if (sunX != null){ const sg = ctx.createRadialGradient(sunX, horizon - H*0.32, 2, sunX, horizon - H*0.32, H*0.35); sg.addColorStop(0, 'rgba(255,255,230,1)'); sg.addColorStop(0.12, 'rgba(255,250,210,0.9)'); sg.addColorStop(1, 'rgba(255,250,210,0)'); ctx.fillStyle = sg; ctx.fillRect(sunX - H*0.4, horizon - H*0.75, H*0.8, H*0.8); }
    for (let i = 0; i < 9; i++){
      const brg = (i*41 + 13 + race.t*0.4) % 360, x = bx(brg); if (x == null) continue;
      const y = horizon - H*(0.12 + 0.05*(i % 4)), w = W*(0.12 + 0.04*(i % 3));
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let j = 0; j < 4; j++){ ctx.beginPath(); ctx.ellipse(x + (j - 1.5)*w*0.28, y - (j % 2)*w*0.08, w*0.22, w*0.12, 0, 0, 6.283); ctx.fill(); }
    }
    // costa all'orizzonte (verso sud-est): colline lontane
    ctx.fillStyle = 'rgba(70,105,120,0.75)'; ctx.beginPath(); let on = false;
    for (let brg = 95; brg <= 235; brg += 3){
      const x = bx(brg); if (x == null){ if (on){ ctx.lineTo(ctx._lx, horizon); ctx.closePath(); ctx.fill(); ctx.beginPath(); on = false; } continue; }
      const hgt = H*(0.03 + 0.035*(Math.sin(brg*0.11) + 1) + 0.015*Math.sin(brg*0.53));
      if (!on){ ctx.moveTo(x, horizon); on = true; } ctx.lineTo(x, horizon - hgt); ctx._lx = x;
    }
    if (on){ ctx.lineTo(ctx._lx, horizon); ctx.closePath(); ctx.fill(); }
    const P = (x, y, z) => {

      const f = dx*fwd.x + dy*fwd.y, r = dx*right.x + dy*right.y;

    const ROWS = 46, COLS = 30, X0 = -W*0.35, X1 = W*1.35, bottom = H*1.15;
    const amp = A1 + chop*1.6;
    let prev = null;
    // dall'orizzonte verso la barca, così i cavi vicini coprono quelli lontani
    for (let r = 0; r <= ROWS; r++){
      const v = r/ROWS, ys = horizon + 1 + (bottom - horizon) * Math.pow(v, 1.9);
      const d = Math.min(900, eye.h * F / Math.max(0.5, ys - horizon));
      const row = [];
      for (let c = 0; c <= COLS; c++){
        const xs = X0 + (X1 - X0)*c/COLS, lat = (xs - W/2)/F*d;
        const wx = eye.x + fwd.x*d + right.x*lat, wy = eye.y + fwd.y*d + right.y*lat;
        const z = eta(wx, wy);
        let gust = 0; if (d < 260 && (c % 2 === 0 || r > ROWS*0.5)){ const w = Wd.at(wx, wy, t); gust = w.gust; if (w.tws < Wd.baseAt(t) - 0.8) gust = -0.6; }
        row.push({ x: xs, y: ys - z*F/d, z, d, g: gust });
      }
      if (prev){
        for (let c = 0; c < COLS; c++){
          const p0 = prev[c], p1 = prev[c+1], q0 = row[c], q1 = row[c+1];
          const zz = (q0.z + q1.z)/2, face = ((p0.z + p1.z)/2 - zz);           // >0: faccia rivolta verso chi guarda
          const dist = q0.d, haze = clamp(1 - dist/500, 0, 1);
          let L = 0.42 + 0.30*(zz/amp) + 0.9*face/amp*0.35;
          const g = (q0.g + q1.g)/2; L -= 0.16*Math.max(0, g); L += 0.12*Math.max(0, -g);
          L = clamp(L, 0, 1);
          let R = 12 + 70*L, G = 70 + 95*L, B = 112 + 95*L;
          // foschia e riflesso del cielo verso l'orizzonte
          R = R*haze + 168*(1-haze); G = G*haze + 205*(1-haze); B = B*haze + 225*(1-haze);
          // scintillio del sole
          if (sunX != null){ const sx = Math.abs((q0.x + q1.x)/2 - sunX) / (W*0.18); if (sx < 1){ const k = (1 - sx)*(0.25 + 0.55*clamp(face/amp + 0.3, 0, 1))*(0.6 + 0.4*(1-haze)); R += 120*k; G += 110*k; B += 80*k; } }
          const colr = `rgb(${R|0},${G|0},${B|0})`; ctx.fillStyle = colr; ctx.strokeStyle = colr; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(q1.x, q1.y + 0.6); ctx.lineTo(q0.x, q0.y + 0.6); ctx.closePath(); ctx.fill(); ctx.stroke();   // il bordo copre le giunture
          // creste bianche con vento forte (o nelle raffiche)
          if ((tws > 12.5 || (g > 0.5 && tws > 10)) && zz > amp*0.62 && dist < 220){
            const h = ((c*73 + Math.floor((dist + t*2)/6)*31) >>> 0) % 7;
            if (h < 2){ ctx.fillStyle = `rgba(255,255,255,${0.55*haze})`; ctx.beginPath(); ctx.ellipse((q0.x + q1.x)/2, (q0.y + p0.y)/2, Math.max(1, (q1.x - q0.x)*0.35), Math.max(0.8, (q0.y - p0.y)*0.25), 0, 0, 6.283); ctx.fill(); }
          }
        }
      }
      prev = row;
    }
    // riflesso abbagliante del sole sull'orizzonte
    if (sunX != null){ const gl = ctx.createRadialGradient(sunX, horizon + 2, 1, sunX, horizon + 2, W*0.2); gl.addColorStop(0, 'rgba(255,255,235,0.55)'); gl.addColorStop(1, 'rgba(255,255,235,0)'); ctx.fillStyle = gl; ctx.fillRect(sunX - W*0.2, horizon - 10, W*0.4, H*0.25); }
    // oggetti: boe, Comitato, altre barche (dal più lontano)
    const objs = [];
    race.marks.forEach((m, i) => objs.push({ k:'mark', x:m.x, y:m.y, n: markName(i), hi: b.nextMark === i }));
    if (race.committee){ objs.push({ k:'mark', x:race.pin.x, y:0, n: tx('Partenza','Pin') }); objs.push({ k:'cb', x:race.committee.x + 4, y:0 }); }
    for (const o of race.boats.values()) if (o !== b && !o.ghost) objs.push({ k:'boat', o, x:o.x, y:o.y });
    objs.forEach(o => { o.z = eta(o.x, o.y); const p = P(o.x, o.y, o.z); o.p = p; });
    objs.filter(o => o.p && o.p.f < 400).sort((a, c) => c.p.f - a.p.f).forEach(o => {
      const p = o.p;
      if (o.k === 'mark'){
        const w = Math.max(2, 1.1/p.f*F), h = Math.max(4, 1.6/p.f*F), top = P(o.x, o.y, o.z + 1.6);
        ctx.fillStyle = o.hi ? '#ffcc33' : '#ff8c1a'; ctx.fillRect(p.x - w/2, top.y, w, p.y - top.y);
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(p.x - w/2, top.y, w*0.3, p.y - top.y);
        if (p.f < 160){ ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText(o.n, p.x, top.y - 4); }
      } else if (o.k === 'cb'){
        const w = 8/p.f*F, h = 2.2/p.f*F;
        ctx.fillStyle = '#eceff1'; ctx.fillRect(p.x - w/2, p.y - h, w, h); ctx.fillStyle = '#90a4ae'; ctx.fillRect(p.x - w*0.3, p.y - h*1.6, w*0.35, h*0.6);
      } else {
        const ob = o.o, L = ob.C.len, ms = (ob.C.type === 'cat' ? 9 : ob.C.type === 'board' ? 4.5 : L*1.25);
        const rel = (ob.hdg - b.hdg) * D2R, hw = Math.max(1.5, (Math.abs(Math.sin(rel))*L*0.5 + ob.C.beam*0.5)/p.f*F);
        const top = P(o.x, o.y, o.z + ms);
        ctx.fillStyle = ob.color; ctx.fillRect(p.x - hw, p.y - Math.max(1.5, 0.4/p.f*F), hw*2, Math.max(1.5, 0.4/p.f*F));
        const side = -(ob.tackSide || 1) * (Math.cos(rel) > 0 ? 1 : -1);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath(); ctx.moveTo(p.x, top.y); ctx.lineTo(p.x, p.y - 2); ctx.lineTo(p.x + side*hw*1.1, p.y - 2); ctx.closePath(); ctx.fill();
        if (p.f < 120){ ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText(ob.name, p.x, top.y - 4); }
      }
    });
    ctx.restore();

    // ---- la propria barca in primo piano (fissa nello schermo, inclinata con lo sbandamento) ----
    ctx.save(); ctx.translate(W/2, H); ctx.rotate(heel*0.6);
    const col = b.color;
    if (!crew){
      // coperta vista da poppa: fianchi colorati, coperta bianca con antiscivolo, pozzetto, cinghie, barra
      const hg = ctx.createLinearGradient(-W*0.5, 0, W*0.5, 0); hg.addColorStop(0, shade(col, -35)); hg.addColorStop(0.5, shade(col, 10)); hg.addColorStop(1, shade(col, -35));
      ctx.fillStyle = hg; ctx.beginPath(); ctx.moveTo(-W*0.5, 0); ctx.quadraticCurveTo(-W*0.3, -H*0.3, -W*0.02, -H*0.44); ctx.lineTo(W*0.02, -H*0.44); ctx.quadraticCurveTo(W*0.3, -H*0.3, W*0.5, 0); ctx.closePath(); ctx.fill();
      const dg = ctx.createLinearGradient(0, -H*0.42, 0, 0); dg.addColorStop(0, '#eef3f6'); dg.addColorStop(1, '#ffffff');
      ctx.fillStyle = dg; ctx.beginPath(); ctx.moveTo(-W*0.4, 0); ctx.quadraticCurveTo(-W*0.24, -H*0.28, -W*0.015, -H*0.42); ctx.lineTo(W*0.015, -H*0.42); ctx.quadraticCurveTo(W*0.24, -H*0.28, W*0.4, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(110,125,140,0.45)'; ctx.beginPath(); ctx.moveTo(-W*0.22, 0); ctx.lineTo(-W*0.07, -H*0.24); ctx.lineTo(W*0.07, -H*0.24); ctx.lineTo(W*0.22, 0); ctx.closePath(); ctx.fill();   // pozzetto
      ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 3; for (const sx of [-1, 1]){ ctx.beginPath(); ctx.moveTo(sx*W*0.06, -H*0.2); ctx.lineTo(sx*W*0.17, -H*0.02); ctx.stroke(); }   // cinghie
      ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(b.rudder*W*0.12, -H*0.2); ctx.stroke();   // barra del timone
      ctx.strokeStyle = '#212121'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.rudder*W*0.12, -H*0.2); ctx.lineTo(b.rudder*W*0.2 + 10, -H*0.27); ctx.stroke();   // stick
    } else {
      // prua vista da vicino
      const hg = ctx.createLinearGradient(-W*0.5, 0, W*0.5, 0); hg.addColorStop(0, shade(col, -35)); hg.addColorStop(0.5, shade(col, 10)); hg.addColorStop(1, shade(col, -35));
      ctx.fillStyle = hg; ctx.beginPath(); ctx.moveTo(-W*0.5, 0); ctx.quadraticCurveTo(-W*0.2, -H*0.2, 0, -H*0.31); ctx.quadraticCurveTo(W*0.2, -H*0.2, W*0.5, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f7fafc'; ctx.beginPath(); ctx.moveTo(-W*0.4, 0); ctx.quadraticCurveTo(-W*0.16, -H*0.18, 0, -H*0.28); ctx.quadraticCurveTo(W*0.16, -H*0.18, W*0.4, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(160,175,190,0.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -H*0.28); ctx.stroke();
      // spruzzi di prua con velocità
      if (b.speed > b.C.vmax*0.5){ ctx.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 8; i++){ const t = (now*2.5 + i*0.13) % 1; ctx.beginPath(); ctx.arc((i % 2 ? 1 : -1)*W*(0.05 + t*0.25), -H*0.28 + t*H*0.1 - Math.sin(t*3.1)*H*0.12, 2*(1 - t) + 0.5, 0, 6.283); ctx.fill(); } }
    }
    ctx.restore();
    // albero e vela sul lato sottovento, aperta secondo la scotta
    const sideS = -(b.tackSide || 1);
    const open = (b.sailAngle != null ? b.sailAngle : b.sheet*85) / 85;
    const mastX = W/2 + (crew ? -sideS*W*0.05 : 0), mastBase = crew ? H*0.80 : H*0.60;
    const luff = (b.trimErr || 0) > 8 || b.irons || b.capsized;
    const boomX = mastX + sideS * W * (crew ? 0.18 + open*0.30 : 0.10 + open*0.36);
    const boomY = mastBase + (crew ? 0 : H*0.04) - open*H*0.05;
    const headY = crew ? -H*0.2 : H*0.02;
    ctx.save(); ctx.translate(W/2, H); ctx.rotate(heel*0.6); ctx.translate(-W/2, -H);
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(mastX, mastBase); ctx.lineTo(mastX, headY); ctx.stroke();
    // fiocco davanti all'albero (420, Hobie 16)
    let jibG = null;
    const drawJib = () => {
      const jOpen = (b.jibSheet != null ? b.jibSheet : b.sheet);
      const bowX = W/2, bowY = crew ? H*0.70 : H*0.565;
      const jHeadX = mastX + (bowX - mastX)*0.15, jHeadY = headY + (mastBase - headY)*0.18;
      const clX = crew ? bowX + sideS*W*(0.12 + jOpen*0.26) : mastX + sideS*W*(0.17 + jOpen*0.3), clY = crew ? H*0.9 : bowY + H*0.04;
      const jl = (b.jibErr || 0) > 8 || b.irons || b.capsized;
      ctx.strokeStyle = 'rgba(40,50,60,0.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bowX, bowY); ctx.lineTo(jHeadX, jHeadY); ctx.stroke();   // strallo
      const jg = ctx.createLinearGradient(bowX, 0, clX, 0); jg.addColorStop(0, 'rgba(255,255,255,0.96)'); jg.addColorStop(1, 'rgba(200,214,228,0.94)');
      ctx.fillStyle = jg; ctx.strokeStyle = 'rgba(80,100,120,0.8)';
      ctx.beginPath(); ctx.moveTo(jHeadX, jHeadY);
      if (jl){ for (let i = 1; i <= 7; i++){ const t = i/7; ctx.lineTo(jHeadX + (clX - jHeadX)*t + Math.sin(now*19 + i)*5, jHeadY + (clY - jHeadY)*t); } }
      else ctx.quadraticCurveTo(jHeadX + sideS*W*0.14, (jHeadY + clY)/2, clX, clY);
      ctx.lineTo(bowX, bowY); ctx.closePath(); ctx.fill(); ctx.stroke();
      jibG = { x0: jHeadX, y0: jHeadY, x1: bowX, y1: bowY };
    };
    if (b.C.jib && crew) drawJib();
    const sgr = ctx.createLinearGradient(mastX, 0, boomX, 0); sgr.addColorStop(0, 'rgba(255,255,255,0.97)'); sgr.addColorStop(1, 'rgba(205,218,230,0.95)');
    ctx.fillStyle = sgr; ctx.strokeStyle = 'rgba(80,100,120,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mastX, headY);
    if (luff){ for (let i = 1; i <= 8; i++){ const t = i/8; ctx.lineTo(mastX + (boomX - mastX)*t + Math.sin(now*18 + i)*6, headY + (boomY - headY)*t); } }
    else ctx.quadraticCurveTo(mastX + sideS*W*0.18*(1 - open*0.4), (headY + boomY)/2, boomX, boomY);
    ctx.lineTo(mastX, boomY); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (!luff){ ctx.strokeStyle = 'rgba(80,100,120,0.35)'; ctx.lineWidth = 1.5; for (const t of [0.25, 0.5, 0.75]){ const yy = headY + (boomY - headY)*t, xe = mastX + (boomX - mastX)*t*0.92; ctx.beginPath(); ctx.moveTo(xe - sideS*W*0.07*t, yy); ctx.lineTo(xe, yy); ctx.stroke(); } }
    ctx.strokeStyle = '#455a64'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(mastX, boomY); ctx.lineTo(boomX, boomY); ctx.stroke();
    if (b.C.jib && !crew) drawJib();
    // spinnaker: pallone colorato che riempie la vista davanti, sottovento
    if (b.spiUp > 0.05){
      const k = b.spiUp, coll = b.spiIssue === 'collapse';
      const cx = W/2 + sideS*W*(0.18 + 0.1*k), cy = crew ? H*0.38 : H*0.42, rx = W*0.2*k*(coll ? 0.65 : 1), ry = H*0.27*k*(coll ? 0.6 : 1);
      const g = ctx.createRadialGradient(cx - rx*0.3, cy - ry*0.3, 2, cx, cy, Math.max(rx, ry));
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, shade(b.color || '#e53935', 15)); g.addColorStop(1, shade(b.color || '#e53935', -30));
      ctx.fillStyle = g; ctx.strokeStyle = 'rgba(40,40,40,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 28; i++){ const a = i/28*6.283, w = coll ? 1 + Math.sin(now*18 + i)*0.12 : 1; const px = cx + Math.cos(a)*rx*w, py = cy + Math.sin(a)*ry*w; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // ricciolo sul bordo d'attacco quando è regolato al limite
      if (!coll && (b.spiErr || 0) > 2){ ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; const lx = cx - sideS*rx*0.95; ctx.beginPath(); ctx.arc(lx + sideS*4, cy - ry*0.1, 6, 0, 3.14); ctx.stroke(); }
    }   // dal timone il fiocco si vede a sottovento, oltre la randa
    // filetti: tre coppie lungo l'inferitura (rosso sopravvento, verde sottovento). Il prodiere guarda quelli del fiocco
    const onJib = !!(jibG && (crew || (b.leadAllowed() && !(b.crew && b.crew.length) && typeof App !== 'undefined' && App.myRole === 'helm')));
    const e = onJib ? (b.jibErr || 0) : (b.trimErr || 0), dead = b.irons || b.speed < 0.3;
    const tell = (x, y, colr, mode, ph) => {
      ctx.strokeStyle = colr; ctx.lineWidth = 2.3; ctx.beginPath(); ctx.moveTo(x, y);
      for (let i = 1; i <= 5; i++){ let yy = 0; if (mode === 'up') yy = -i*2.3 + Math.sin(now*12 + i + ph)*3; else if (mode === 'down') yy = i*2.3 + Math.sin(now*14 + i + ph)*2.3; else yy = Math.sin(now*5 + i + ph)*0.7; ctx.lineTo(x + sideS*i*4.5, y + yy); }
      ctx.stroke();
    };
    const ld = onJib ? (b.leadD || 0) : 0;
    [[0.25, 3 + 4*ld], [0.5, 0], [0.75, -3 - 4*ld]].forEach(([k, off], i) => {
      const x = onJib ? jibG.x0 + (jibG.x1 - jibG.x0)*k + sideS*6 : mastX + sideS*W*0.03, y = onJib ? jibG.y0 + (jibG.y1 - jibG.y0)*k : headY + (boomY - headY)*k, eh = e + off;
      tell(x, y - 4, '#e53935', dead || eh > 6 ? 'up' : 'ok', i);
      tell(x, y + 4, '#2e7d32', dead || (eh < -8 && Math.abs(b.awa) < 150) ? 'down' : 'ok', i + 2);
    });
    if (!onJib && !luff){   // filetto di balumina della randa
      const lx = mastX + (boomX - mastX)*0.45*0.92, ly = headY + (boomY - headY)*0.45, hid = (b.trimErr || 0) < -10 && Math.abs(b.awa) < 150;
      ctx.strokeStyle = '#fb8c00'; ctx.lineWidth = 2.3; ctx.beginPath(); ctx.moveTo(lx, ly);
      for (let i = 1; i <= 4; i++) ctx.lineTo(lx + sideS*(hid ? -i*3 : i*4), ly + (hid ? -i*2.5 : Math.sin(now*6 + i)*0.8));
      ctx.stroke();
    }
    // segnavento in testa d'albero: punta da dove viene il vento apparente
    const awa = (b.awa || 0) * D2R;
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(mastX, headY); ctx.lineTo(mastX - Math.sin(awa)*14, headY + Math.cos(awa)*6 - 2); ctx.stroke();
    ctx.restore();
    // etichetta
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    const lab = (crew ? tx('Vista prodiere','Crew view') : tx('Vista timoniere','Helm view')) + ' · ' + Math.abs(b.speed).toFixed(1) + tx(' nodi',' kn');
    ctx.font = '700 11px system-ui'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(8,30,54,0.7)'; roundRect(ctx, 6, 6, ctx.measureText(lab).width + 14, 20, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(lab, 13, 20);
  }
}

'use strict';
// =====================================================================
//  RETE: stanze online con codice (PeerJS, connessione diretta tra
//  dispositivi). Nessun dato personale salvato su server.
// =====================================================================

const PEER_PREFIX = 'sailacademy-v1-';

class Net {
  constructor(){ this.peer = null; this.conns = new Map(); this.host = null; this.isHost = false; this.handlers = {}; this.myPid = null; }
  on(t, fn){ this.handlers[t] = fn; }
  emit(t, ...a){ this.handlers[t] && this.handlers[t](...a); }
  available(){ return typeof Peer !== 'undefined'; }

  static makeCode(){
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
    for (let i=0;i<5;i++) s += A[Math.floor(Math.random()*A.length)];
    return s;
  }

  createRoom(){
    return new Promise((resolve, reject) => {
      if (!this.available()) return reject(new Error('Libreria di rete non disponibile'));
      const code = Net.makeCode();
      this.isHost = true; this.code = code; this.myPid = 'host';
      this.peer = new Peer(PEER_PREFIX + code, { debug: 0 });
      const to = setTimeout(() => reject(new Error('Il server di collegamento non risponde. Controlla la connessione.')), 12000);
      this.peer.on('open', () => { clearTimeout(to); resolve(code); });
      this.peer.on('error', e => { clearTimeout(to); if (e.type === 'unavailable-id') { this.peer.destroy(); this.createRoom().then(resolve, reject); } else { this.emit('error', e); reject(e); } });
      this.peer.on('connection', conn => {
        this.conns.set(conn.peer, conn);
        conn.on('open', () => { const q = conn._q || []; conn._q = []; q.forEach(m => conn.send(m)); });
        conn.on('data', d => this.emit('msg', d, conn.peer));
        conn.on('close', () => { this.conns.delete(conn.peer); this.emit('leave', conn.peer); });
        conn.on('error', () => {});
      });
    });
  }

  joinRoom(code){
    return new Promise((resolve, reject) => {
      if (!this.available()) return reject(new Error('Libreria di rete non disponibile'));
      this.isHost = false; this.code = code.toUpperCase().trim();
      this.peer = new Peer({ debug: 0 });
      const to = setTimeout(() => reject(new Error('Stanza non trovata o connessione assente.')), 15000);
      this.peer.on('open', id => {
        this.myPid = id;
        const conn = this.peer.connect(PEER_PREFIX + this.code, { reliable: true });
        this.host = conn;
        conn.on('open', () => { clearTimeout(to); resolve(); });
        conn.on('data', d => this.emit('msg', d, 'host'));
        conn.on('close', () => this.emit('hostlost'));
        conn.on('error', () => {});
      });
      this.peer.on('error', e => { clearTimeout(to); reject(new Error(e.type === 'peer-unavailable' ? 'Stanza ' + this.code + ' non trovata.' : 'Errore di rete: ' + e.type)); });
    });
  }

  sendConn(c, msg){ if (c.open) c.send(msg); else (c._q = c._q || []).push(msg); }
  send(msg, pid){ // host → un giocatore
    const c = this.conns.get(pid); if (c) this.sendConn(c, msg);
  }
  broadcast(msg, except){
    for (const [pid, c] of this.conns) if (pid !== except) this.sendConn(c, msg);
  }
  toHost(msg){ if (this.host && this.host.open) this.host.send(msg); }
  close(){ try { this.peer && this.peer.destroy(); } catch(e){} this.peer = null; this.conns.clear(); this.host = null; }
}

'use strict';
// =====================================================================
//  MISSIONI: sfide brevi con stelle (1-3), salvate sul dispositivo
//  Ogni missione: impostazioni della regata + controllo a ogni passo.
//  check(st, race, boat, dt) aggiorna lo stato; ritorna {done, stars}
// =====================================================================

const MISSIONS = [
  { id:'andature', icon:'🧭',
    t:['Le andature','Points of sail'],
    d:['Naviga per 3 secondi in bolina, al traverso, al lasco e in poppa.','Sail for 3 seconds close-hauled, on a beam reach, on a broad reach and on a run.'],
    S:{ mode:'allenamento', course:'bastone', nBots:0 },
    init: st => { st.got = {}; st.cur = null; st.acc = 0; },
    check(st, R, b, dt){
      const a = Math.abs(b.twa), C = b.C; let k = null;
      if (a >= C.nogo && a < 62) k = 'bolina'; else if (a >= 78 && a < 102) k = 'traverso'; else if (a >= 110 && a < 150) k = 'lasco'; else if (a >= 160) k = 'poppa';
      if (k && b.speed > C.vmax*0.25){ if (st.cur !== k){ st.cur = k; st.acc = 0; } st.acc += dt; if (st.acc > 3) st.got[k] = 1; } else st.cur = null;
      const n = Object.keys(st.got).length;
      st.txt = tb(`Andature completate: ${n}/4 (${['bolina','traverso','lasco','poppa'].map(x => (st.got[x] ? '✓ ' : '· ') + x).join(', ')})`,
                  `Points of sail done: ${n}/4 (${['close-hauled','beam reach','broad reach','run'].map((x,i) => (st.got[['bolina','traverso','lasco','poppa'][i]] ? '✓ ' : '· ') + x).join(', ')})`);
      return n === 4 ? { done:true, stars: st.time < 70 ? 3 : st.time < 120 ? 2 : 1 } : null;
    } },
  { id:'virate', icon:'↩️',
    t:['Virate','Tacking'],
    d:['Fai 4 virate e riparti ogni volta ad almeno metà velocità.','Make 4 tacks and get back to at least half speed each time.'],
    S:{ mode:'allenamento', course:'bastone', nBots:0 },
    init: st => { st.n = 0; st.wait = false; st.side = null; },
    check(st, R, b, dt){
      if (st.side == null) st.side = b.tackSide;
      if (b.tackSide !== st.side && Math.abs(b.twa) < 90){ st.side = b.tackSide; st.wait = true; }
      if (st.wait && b.speed > b.C.vmax*0.5 && !b.auto){ st.wait = false; st.n++; }
      st.txt = tb(`Virate riuscite: ${st.n}/4`, `Good tacks: ${st.n}/4`);
      return st.n >= 4 ? { done:true, stars: st.time < 45 ? 3 : st.time < 80 ? 2 : 1 } : null;
    } },
  { id:'strambate', icon:'↪️',
    t:['Strambate','Gybing'],
    d:['Scendi verso la Boa 2 e fai 3 strambate. Occhio al boma!','Sail down towards Mark 2 and make 3 gybes. Mind the boom!'],
    S:{ mode:'allenamento', course:'bastone', nBots:0 },
    init: st => { st.n = 0; st.side = null; },
    check(st, R, b, dt){
      if (st.side == null) st.side = b.tackSide;
      if (b.tackSide !== st.side){ if (Math.abs(b.twa) > 100) st.n++; st.side = b.tackSide; }
      st.txt = tb(`Strambate: ${st.n}/3`, `Gybes: ${st.n}/3`);
      return st.n >= 3 ? { done:true, stars: st.time < 50 ? 3 : st.time < 90 ? 2 : 1 } : null;
    } },
  { id:'filetti', icon:'🎏',
    t:['Leggi i filetti','Read the telltales'],
    d:['Scotta manuale: tieni i filetti distesi per 20 secondi in navigazione.','Manual sheet: keep the telltales streaming for 20 seconds while sailing.'],
    S:{ mode:'allenamento', course:'triangolo', nBots:0 },
    init: st => { st.ok = 0; },
    check(st, R, b, dt){
      b.autoSheet = false;
      if (b.speed > b.C.vmax*0.3 && !b.irons && Math.abs(b.trimErr) <= 6) st.ok += dt;
      st.txt = tb(`Vela regolata bene: ${st.ok.toFixed(0)}/20 s`, `Sail trimmed well: ${st.ok.toFixed(0)}/20 s`);
      return st.ok >= 20 ? { done:true, stars: st.time < 30 ? 3 : st.time < 55 ? 2 : 1 } : null;
    } },
  { id:'boe', icon:'🟠',
    t:['Giro di boa','Rounding the marks'],
    d:['Fai tutto il percorso: lascia le boe alla tua sinistra e non toccarle.','Sail the whole course: leave the marks to port and do not touch them.'],
    S:{ mode:'allenamento', course:'bastone', nBots:0 },
    init: st => { st.start = null; },
    check(st, R, b, dt){
      st.txt = tb(`Prossima: ${markName(Math.min(b.nextMark, R.marks.length-1))} · tocchi di boa: ${b.penServed + b.penalty}`, `Next: ${markName(Math.min(b.nextMark, R.marks.length-1))} · mark touches: ${b.penServed + b.penalty}`);
      if (st.laps == null) st.laps = 0;
      if (b.nextMark === 0 && st.prev === R.marks.length - 1) st.laps++;
      st.prev = b.nextMark;
      if (st.laps >= 1){ const clean = b.penServed + b.penalty === 0; return { done:true, stars: clean ? (st.time < 160 ? 3 : 2) : 1 }; }
      return null;
    } },
  { id:'raffiche', icon:'🌬️',
    t:['Caccia alle raffiche','Gust hunting'],
    d:['Cerca le macchie scure sull’acqua: resta 15 secondi dentro le raffiche.','Look for the dark patches on the water: stay inside gusts for 15 seconds.'],
    S:{ mode:'allenamento', course:'triangolo', nBots:0 },
    init: st => { st.g = 0; },
    check(st, R, b, dt){
      if (b.gust > 0.35 && b.speed > b.C.vmax*0.3) st.g += dt;
      st.txt = tb(`Tempo in raffica: ${st.g.toFixed(0)}/15 s`, `Time in gusts: ${st.g.toFixed(0)}/15 s`);
      return st.g >= 15 ? { done:true, stars: st.time < 60 ? 3 : st.time < 110 ? 2 : 1 } : null;
    } },
  { id:'partenza', icon:'🏁',
    t:['Partenza perfetta','The perfect start'],
    d:['Segui la sequenza 5-4-1-0 e taglia la linea subito dopo il via, senza anticipare.','Follow the 5-4-1-0 sequence and cross the line right after the gun, not early.'],
    S:{ mode:'flotta', course:'bastone', nBots:3 },
    init: st => {},
    check(st, R, b, dt){
      st.txt = R.t < 0 ? tb('Avvicinati alla linea senza superarla prima del via!', 'Get close to the line without crossing it before the gun!')
                       : tb('Taglia la linea!', 'Cross the line!');
      if (b.started){ const late = b.startTime; return { done:true, stars: late <= 3 ? 3 : late <= 7 ? 2 : 1, extra: tb(`Partito ${late.toFixed(1)} s dopo il via`, `Started ${late.toFixed(1)} s after the gun`) }; }
      if (R.t > 40) return { done:true, stars:0 };
      return null;
    } },
  { id:'mure', icon:'⚖️',
    t:['Regata pulita','A clean race'],
    d:['Regata contro 3 barche del computer senza prendere penalità. Guarda gli anelli: rosso = tieniti discosto.','Race 3 computer boats without any penalty. Watch the rings: red = keep clear.'],
    S:{ mode:'flotta', course:'bastone', nBots:3 },
    init: st => {},
    check(st, R, b, dt){
      const pens = b.penServed + b.penalty + (b.penUnserved||0);
      st.txt = tb(`Penalità: ${pens}`, `Penalties: ${pens}`);
      if (b.finished){
        if (pens > 0) return { done:true, stars:0, extra: tb('Hai preso penalità: riprova!', 'You got penalties: try again!') };
        const pos = 1 + [...R.boats.values()].filter(o => o.finished && o.finishTime < b.finishTime && !o.ghost).length;

      if (st.ok >= 2) return { done:true, stars: st.bad === 0 ? 3 : st.bad === 1 ? 2 : 1 };

'use strict';
// =====================================================================
//  SUONO DEL MARE: il vento si sente dalla direzione da cui arriva
//  (vento apparente rispetto alla prua), la vela sbatte quando fileggia,
//  l'acqua scorre sullo scafo con la velocità. Meglio con le cuffie.
// =====================================================================
class SeaAudio {
  constructor(){ this.ok = false; this.on = true; }
  init(ac){
    if (this.ok || !ac) return;
    try {
      this.ac = ac;
      // rumore bianco in loop (2 s)
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      let b0 = 0, b1 = 0;
      for (let i = 0; i < len; i++){ const w = Math.random()*2 - 1; b0 = 0.97*b0 + 0.03*w; b1 = 0.6*b1 + 0.4*w; d[i] = 0.6*b1 + 0.8*b0; }
      const src = () => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = Math.random(); s.start(0, Math.random()*1.5); return s; };
      this.master = ac.createGain(); this.master.gain.value = 0; this.master.connect(ac.destination);
      // posizione 3D del vento (HRTF: con le cuffie si distingue anche davanti/dietro)
      this.pan = ac.createPanner();
      this.pan.panningModel = 'HRTF'; this.pan.distanceModel = 'inverse'; this.pan.refDistance = 1; this.pan.rolloffFactor = 0;
      this.pan.connect(this.master);
      // vento: fruscio filtrato
      this.windF = ac.createBiquadFilter(); this.windF.type = 'bandpass'; this.windF.Q.value = 0.7;
      this.windG = ac.createGain(); this.windG.gain.value = 0;
      src().connect(this.windF); this.windF.connect(this.windG); this.windG.connect(this.pan);
      // raffica: soffio più acuto
      this.gustF = ac.createBiquadFilter(); this.gustF.type = 'highpass'; this.gustF.frequency.value = 1800;
      this.gustG = ac.createGain(); this.gustG.gain.value = 0;
      src().connect(this.gustF); this.gustF.connect(this.gustG); this.gustG.connect(this.pan);
      // vela che sbatte: rumore modulato da un oscillatore lento
      this.luffF = ac.createBiquadFilter(); this.luffF.type = 'bandpass'; this.luffF.frequency.value = 700; this.luffF.Q.value = 1.5;
      this.luffG = ac.createGain(); this.luffG.gain.value = 0;
      this.luffMod = ac.createGain(); this.luffMod.gain.value = 0;
      this.lfo = ac.createOscillator(); this.lfo.type = 'square'; this.lfo.frequency.value = 9;
      this.lfoDepth = ac.createGain(); this.lfoDepth.gain.value = 0.5;
      this.lfo.connect(this.lfoDepth); this.lfoDepth.connect(this.luffMod.gain); this.lfo.start();
      src().connect(this.luffF); this.luffF.connect(this.luffMod); this.luffMod.connect(this.luffG); this.luffG.connect(this.master);
      // acqua sullo scafo
      this.waterF = ac.createBiquadFilter(); this.waterF.type = 'lowpass'; this.waterF.frequency.value = 400;
      this.waterG = ac.createGain(); this.waterG.gain.value = 0;
      src().connect(this.waterF); this.waterF.connect(this.waterG); this.waterG.connect(this.master);
      this.ok = true;
    } catch(e){ this.ok = false; }
  }
  set(param, v, tc = 0.15){ try { param.setTargetAtTime(v, this.ac.currentTime, tc); } catch(e){ param.value = v; } }
  // chiamato a ogni fotogramma con la barca che si sta guardando
  update(b, active){
    if (!this.ok) return;
    const vol = this.on && active && b ? 1 : 0;
    this.set(this.master.gain, vol * 0.9, 0.25);
    if (!vol) return;
    // direzione del vento apparente rispetto alla prua: x = destra, z negativo = davanti
    const a = (b.awa || 0) * D2R;
    const x = Math.sin(a), z = -Math.cos(a);
    if (this.pan.positionX){ this.set(this.pan.positionX, x, 0.08); this.set(this.pan.positionY, 0.2, 0.08); this.set(this.pan.positionZ, z, 0.08); }
    else this.pan.setPosition(x, 0.2, z);
    const aws = Math.max(0, b.aws || 0);
    // più vento apparente = più forte e più acuto; da prua si sente di più che da poppa
    const front = 0.75 + 0.25*Math.cos(a);
    this.set(this.windG.gain, Math.min(0.9, Math.pow(aws/18, 1.3)) * front * 0.55);
    this.set(this.windF.frequency, 250 + aws*55);
    this.set(this.gustG.gain, (b.gust || 0) * Math.min(1, aws/12) * 0.25, 0.3);
    // vela che fileggia (troppo lasca o nell'angolo morto)
    const luff = b.capsized ? 0 : (b.irons ? 1 : clamp(((b.trimErr || 0) - 6) / 18, 0, 1));
    this.set(this.luffG.gain, luff * Math.min(1, aws/8) * 0.45, 0.1);
    this.set(this.lfo.frequency, 6 + aws*0.5);
    // acqua: cresce con la velocità
    const sp = Math.abs(b.speed || 0) / (b.C ? b.C.vmax : 6);
    this.set(this.waterG.gain, Math.min(1, sp) * 0.35);
    this.set(this.waterF.frequency, 250 + sp*900);
  }
}
const SEA = new SeaAudio();
