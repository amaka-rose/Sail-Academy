<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sail Academy">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sail Academy – impara a regatare giocando</title>
<style>
:root{ --navy:#0b3a5b; --sea:#1d6fa3; --sky:#e8f4fb; --ink:#10273a; --acc:#ffb300; --ok:#2e7d32; --bad:#c62828; --card:#ffffff; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--navy); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
button{ font:inherit; cursor:pointer; }
.screen{ position:fixed; inset:0; display:none; overflow:auto; }
.screen.on{ display:block; }
.wrap{ max-width:760px; margin:0 auto; padding:18px 16px 40px; }
h1{ color:#fff; font-size:30px; margin:8px 0 2px; letter-spacing:.3px; }
body{ background:radial-gradient(1200px 600px at 50% -10%, #1f7fb8 0%, #0b3a5b 60%) fixed; }
.hero{ display:flex; align-items:center; gap:14px; margin-top:6px; }
.hero svg{ width:84px; height:64px; flex:0 0 84px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
h1 small{ display:block; font-size:14px; font-weight:500; color:#b9dcf2; margin-top:4px; }
h2{ font-size:18px; margin:0 0 10px; }
.card{ background:var(--card); border-radius:14px; padding:16px; margin-top:14px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
label{ display:block; font-size:13px; font-weight:600; color:#3b5468; margin:10px 0 4px; }
input,select{ width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1.5px solid #c7d6e2; border-radius:10px; background:#fbfdff; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > *{ flex:1 1 200px; }
.btn{ display:block; width:100%; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:700; color:#fff; background:var(--sea); margin-top:10px; }
.btn.alt{ background:#e3eef6; color:var(--navy); }
.btn.acc{ background:var(--acc); color:#3a2700; }
.btn.ok{ background:var(--ok); }
.btn:disabled{ opacity:.45; }
.hint{ font-size:13px; color:#5b7184; margin-top:6px; line-height:1.4; }
.pill{ display:inline-block; padding:3px 9px; border-radius:20px; background:#e3eef6; font-size:12px; font-weight:700; color:var(--navy); margin:2px; }
.code{ font-size:44px; font-weight:800; letter-spacing:8px; text-align:center; color:var(--navy); background:#fff6d6; border-radius:12px; padding:10px; }
.plist{ list-style:none; padding:0; margin:8px 0 0; }
.plist li{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #e6eef4; flex-wrap:wrap; }
.dot{ width:14px; height:14px; border-radius:50%; flex:0 0 14px; border:1px solid rgba(0,0,0,.3); }
.plist select{ width:auto; padding:4px 8px; font-size:14px; }
.err{ color:var(--bad); font-weight:600; margin-top:8px; }
.foot{ color:#9cc3dc; font-size:12px; text-align:center; margin-top:18px; line-height:1.5; }
.foot a{ color:#cfe7f6; }

/* ---------- gioco ---------- */
#game{ background:#175f8e; overflow:hidden; touch-action:none; }
#game, #game *{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
button{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
#cv{ position:absolute; inset:0; width:100%; height:100%; }
.glass{ background:rgba(8,30,54,.58); -webkit-backdrop-filter:blur(10px) saturate(140%); backdrop-filter:blur(10px) saturate(140%); border:1px solid rgba(255,255,255,.16); box-shadow:0 8px 24px rgba(0,0,0,.25); border-radius:18px; color:#fff; }
#hud{ position:absolute; inset:0; display:flex; flex-direction:column; gap:8px; pointer-events:none;
  padding:max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
#hud button, #hud .int{ pointer-events:auto; }
.bar{ display:flex; align-items:center; gap:10px; padding:6px 8px 6px 14px; min-height:52px; }
.clockbox{ display:flex; flex-direction:column; min-width:0; flex:1; }
#clock{ font-size:24px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
#status{ font-size:12.5px; font-weight:600; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#flags{ display:flex; gap:4px; }
#flags canvas{ width:30px; height:20px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.4); }
.ib{ width:42px; height:42px; border-radius:13px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.12); color:#fff; font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 42px; }
.ib:active{ background:rgba(255,255,255,.3); }
.mid{ flex:1; min-height:0; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.info{ display:flex; gap:10px; align-items:center; padding:8px 12px 8px 8px; max-width:min(330px, 62vw); }
#windDial{ width:62px; height:62px; flex:0 0 62px; }
#infoTxt{ font-size:12.5px; font-weight:600; line-height:1.35; min-width:0; }
#infoTxt .spd{ font-size:24px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
#infoTxt .spd small{ font-size:12px; font-weight:700; opacity:.8; margin-left:3px; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; background:rgba(255,255,255,.14); font-size:11.5px; font-weight:700; margin:3px 3px 0 0; }
.chip i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.chip.red{ background:#c62828; }
#infoTxt .desc{ font-weight:500; opacity:.85; font-size:11.5px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
#infoTxt .desc .en{ display:inline; margin-left:4px; }
.sheetcol{ display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; max-height:340px; }
#sailBtns{ display:flex; flex-direction:column; gap:4px; align-items:stretch; }
#sailBtns button{ display:none; border:0; border-radius:10px; padding:5px 7px; font-size:11px; font-weight:800; background:rgba(255,255,255,.92); color:#0b3a5b; white-space:nowrap; }
#bSpi.up{ background:#e53935; color:#fff; } #bSpi.hint{ animation:pulse 0.9s infinite; background:#ffca28; color:#3a2700; }
#sheetAuto{ border:0; border-radius:12px; padding:7px 9px; font-size:11.5px; font-weight:800; background:rgba(255,255,255,.92); color:#0b3a5b; white-space:nowrap; }
#sheetBox{ position:relative; flex:1; width:66px; min-height:110px; border-radius:20px; pointer-events:auto; touch-action:none; }
#sheetBox .lab{ position:absolute; left:0; right:0; text-align:center; color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.4px; }
#sheetFill{ position:absolute; left:11px; right:11px; bottom:24px; background:linear-gradient(#ffe082,#ff8f00); border-radius:10px; box-shadow:0 0 10px rgba(255,179,0,.5); }
#sheetOpt{ position:absolute; left:5px; right:5px; height:4px; border-radius:2px; background:#69f0ae; box-shadow:0 0 8px #69f0ae; }
.dock{ display:flex; flex-direction:column; gap:8px; }
.instcard{ padding:8px 10px; display:flex; gap:10px; align-items:stretch; }
#tip{ font-size:12px; font-weight:600; line-height:1.35; flex:1; min-width:0; display:flex; align-items:center; }
#inst{ width:220px; height:96px; flex:0 0 220px; }
.ctrlrow{ display:flex; align-items:center; gap:10px; }
.tbtn{ width:72px; height:72px; flex:0 0 72px; border-radius:50%; color:#fff; font-size:28px; font-weight:800; border:2px solid rgba(255,255,255,.5);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(8,30,54,.55)); box-shadow:0 6px 16px rgba(0,0,0,.3); touch-action:none; }
.tbtn.on{ background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), rgba(30,90,140,.8)); transform:scale(.96); }
#bMan{ flex:1; height:60px; border:0; border-radius:20px; font-size:19px; font-weight:900; letter-spacing:1px; color:#3a2700; background:linear-gradient(180deg,#ffd54f,#ffa000); box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.5); }
#bMan:active{ transform:scale(.98); }
#bPen{ width:100%; height:46px; border:0; border-radius:16px; background:linear-gradient(180deg,#ef5350,#c62828); color:#fff; font-size:15px; font-weight:900; display:none; box-shadow:0 6px 16px rgba(0,0,0,.3); }
#banner{ position:absolute; left:50%; top:calc(max(8px, env(safe-area-inset-top)) + 66px); transform:translateX(-50%); width:min(560px, 94vw); background:rgba(255,255,255,.97); color:var(--ink); border-radius:14px; padding:10px 14px; font-size:14.5px; font-weight:600; box-shadow:0 8px 22px rgba(0,0,0,.3); display:none; pointer-events:none; line-height:1.35; z-index:3; }
#banner .rn{ display:inline-block; background:var(--navy); color:#fff; border-radius:6px; padding:1px 7px; font-size:12px; margin-right:6px; }
#banner.warn{ border-left:6px solid var(--acc); } #banner.pen{ background:#fff0f0; border-left:6px solid var(--bad); } #banner.good{ background:#effaf0; border-left:6px solid var(--ok); }
#bProt{ display:none; align-self:flex-end; border:0; border-radius:12px; padding:7px 11px; font-weight:900; font-size:13px; background:#c62828; color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.3); }
#protBox{ position:absolute; left:50%; transform:translateX(-50%); top:38%; display:flex; flex-direction:column; gap:6px; align-items:center; width:min(380px, 88vw); z-index:4; pointer-events:none; }
#protBox .pc{ background:rgba(255,255,255,.97); border-radius:14px; padding:9px 11px; font-size:13px; font-weight:600; box-shadow:0 8px 22px rgba(0,0,0,.35); width:100%; text-align:center; pointer-events:auto; color:var(--ink); }
#protBox button{ border:0; border-radius:11px; padding:10px 13px; font-weight:800; font-size:14px; margin:6px 3px 0; }
.bprot{ background:#c62828; color:#fff; } .bacc{ background:#ffb300; color:#3a2700; } .bjury{ background:#e3eef6; color:#0b3a5b; }
#pip{ position:absolute; left:max(8px, env(safe-area-inset-left)); top:120px; width:min(48vw, 380px); aspect-ratio:16/10; border-radius:14px; border:2px solid rgba(255,255,255,.55); box-shadow:0 8px 22px rgba(0,0,0,.35); z-index:2; display:none; touch-action:manipulation; cursor:pointer; }
@media (min-aspect-ratio: 1/1) and (max-height:420px){ #pip{ width:min(36vw, 300px); } }
#callBar{ display:none; flex-wrap:wrap; gap:5px; justify-content:flex-end; }
#callBar button, .cpCalls button{ border:0; border-radius:10px; padding:6px 9px; font-size:12px; font-weight:800; background:rgba(255,255,255,.92); color:#0b3a5b; }
#callBar button.hot{ background:#ffca28; color:#3a2700; animation:pulse 0.9s infinite; }
#crewPad{ display:none; padding:8px; flex-direction:column; gap:6px; }
#crewPad .cpTitle{ font-size:12px; font-weight:700; text-align:center; }
#crewPad .cpRow{ display:flex; gap:6px; }
#crewPad .cpb{ flex:1; border:1px solid rgba(255,255,255,.3); border-radius:12px; padding:10px 6px; font-size:13px; font-weight:800; background:rgba(255,255,255,.12); color:#fff; }
#crewPad .cpb.on{ background:#43a047; border-color:#a5d6a7; }
#crewPad .cpb.wind{ box-shadow:0 0 0 2px #ffca28 inset; }
#cpBig{ border:0; border-radius:14px; padding:12px; font-size:16px; font-weight:900; background:#ffca28; color:#3a2700; display:none; }
#cpBig.go{ display:block; animation:pulse 0.8s infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
.cpCalls{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
#crewPad{ max-width:340px; max-height:calc(100vh - 120px); overflow:auto; }
#crewPad .cpCalls{ flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
#crewPad .cpCalls button{ flex:0 0 auto; }
@media (max-height:440px){
  #crewPad{ padding:6px; gap:4px; }
  #crewPad .cpb{ padding:6px 4px; font-size:12px; border-radius:10px; }
  #crewPad .cpTitle{ font-size:11px; }
  #cpBig{ padding:8px; font-size:14px; }
}
#kbHint{ position:absolute; left:50%; transform:translateX(-50%); top:42%; background:rgba(8,30,54,.85); color:#fff; padding:8px 14px; border-radius:12px; font-weight:700; font-size:13px; display:none; pointer-events:none; z-index:3; }
#menuSheet{ position:absolute; right:max(8px, env(safe-area-inset-right)); top:calc(max(8px, env(safe-area-inset-top)) + 60px); display:none; flex-direction:column; gap:6px; padding:10px; z-index:5; min-width:190px; }
#menuSheet.on{ display:flex; }
#menuSheet button{ border:0; border-radius:12px; padding:11px 12px; text-align:left; font-size:15px; font-weight:700; background:rgba(255,255,255,.12); color:#fff; }
#menuSheet .zr{ display:flex; gap:6px; } #menuSheet .zr button{ flex:1; text-align:center; font-size:18px; }
#instr{ position:absolute; right:max(8px, env(safe-area-inset-right)); top:calc(max(8px, env(safe-area-inset-top)) + 60px); width:min(340px, 92vw); max-height:72vh; overflow:auto; background:rgba(255,255,255,.97); border-radius:16px; padding:12px; font-size:13px; display:none; z-index:4; box-shadow:0 10px 30px rgba(0,0,0,.35); }
#instr h3{ margin:0 0 6px; font-size:15px; }
#instr .inc{ padding:6px 0; border-bottom:1px solid #e5edf3; cursor:pointer; }
#instr .inc b{ color:var(--navy); }
#pauseOv{ position:absolute; inset:0; background:rgba(0,20,40,.4); display:none; align-items:center; justify-content:center; color:#fff; font-size:34px; font-weight:900; letter-spacing:3px; pointer-events:none; z-index:2; }
.hide{ display:none !important; }
/* ---------- disposizione a griglia: le zone non possono sovrapporsi, il mare resta libero ---------- */
#hud{ display:grid; gap:6px; }
.mid, .dock{ display:contents; }
.bar{ grid-area:bar; min-height:0; padding:4px 6px 4px 12px; border-radius:16px; }
.clockbox{ flex-direction:row; align-items:baseline; gap:10px; }
#clock{ font-size:20px; } #status{ font-size:12.5px; }
.ib{ width:36px; height:36px; flex-basis:36px; font-size:16px; border-radius:11px; }
.ib.sm{ width:30px; height:30px; flex:0 0 30px; font-size:14px; border-radius:9px; }
#info{ grid-area:info; align-self:start; justify-self:start; padding:4px 10px 4px 5px; gap:8px; border-radius:16px; max-width:100%; }
#windDial{ width:40px; height:40px; flex-basis:40px; }
#infoTxt{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 4px; font-size:11px; }
#infoTxt .spd{ font-size:19px; margin-right:4px; } #infoTxt .spd small{ font-size:11px; }
.chip{ font-size:10.5px; padding:2px 7px; margin:0; }
#infoTxt .desc{ display:none !important; }
#sheetCol{ grid-area:sheet; justify-self:end; align-self:end; gap:5px; height:auto; max-height:none; }
#sheetBox{ width:48px; height:min(230px, 32vh); flex:0 0 auto; min-height:0; border-radius:16px; }
#sheetBox .lab{ font-size:9px; } #sheetFill{ left:9px; right:9px; }
#sheetAuto{ padding:5px 8px; font-size:10.5px; border-radius:10px; }
#sheetCol.auto #sheetBox{ display:none; }
#instCard{ grid-area:inst; padding:6px 8px; gap:6px; flex-direction:column; border-radius:16px; }
.tiprow{ display:flex; align-items:center; gap:8px; }
#tip{ font-size:11.5px; line-height:1.3; height:3.9em; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; align-items:initial; }
#tip .en{ display:inline; margin-left:4px; }
#inst{ width:100%; height:78px; flex:0 0 auto; }
#instCard.closed #inst{ display:none; }
#ctrlCol{ grid-area:ctrl; display:flex; flex-direction:column; gap:6px; align-self:end; }
.tbtn{ width:58px; height:58px; flex-basis:58px; font-size:22px; } #bMan{ height:50px; font-size:17px; border-radius:16px; } #bPen{ height:40px; font-size:14px; border-radius:14px; }
#banner{ top:calc(max(8px, env(safe-area-inset-top)) + 50px); }
/* verticale */
@media (max-aspect-ratio: 1/1){
  #hud{ grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto minmax(0,1fr) auto auto;
        grid-template-areas:"bar bar" "info info" ". sheet" "inst inst" "ctrl ctrl"; }
}
/* orizzontale */
@media (min-aspect-ratio: 1/1){
  #hud{ grid-template-columns:minmax(0,auto) minmax(0,1fr) auto auto; grid-template-rows:auto auto minmax(0,1fr) auto;
        grid-template-areas:"bar bar bar bar" "info . . sheet" ". . . sheet" "inst . ctrl sheet"; }
  #instCard{ width:min(380px, 40vw); align-self:end; }
  #ctrlCol{ width:min(300px, 32vw); }
  #sheetBox{ height:min(260px, 52vh); }
}
@media (min-aspect-ratio: 1/1) and (max-height:420px){
  #hud{ gap:5px; } #clock{ font-size:17px; } #status{ font-size:11.5px; } .ib{ width:30px; height:30px; flex-basis:30px; font-size:14px; }
  #windDial{ width:34px; height:34px; flex-basis:34px; } #infoTxt .spd{ font-size:16px; }
  #inst{ height:62px; } #tip{ font-size:10.5px; }
  .tbtn{ width:48px; height:48px; flex-basis:48px; font-size:19px; } #bMan{ height:44px; font-size:15px; } #bPen{ height:34px; font-size:12.5px; }
  #sheetBox{ width:42px; height:calc(100vh - 120px); }
  #banner{ top:42px; font-size:12px; padding:6px 10px; }
}
@media (min-aspect-ratio: 1/1) and (max-height:300px){ #instCard{ width:min(280px, 36vw); } .chip:nth-of-type(n+4){ display:none; } }
/* risultati / scuola */
table{ width:100%; border-collapse:collapse; font-size:14px; }
th,td{ text-align:left; padding:7px 5px; border-bottom:1px solid #e3ebf1; }
th{ font-size:12px; color:#5b7184; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.tabs button{ border:0; border-radius:20px; padding:8px 14px; background:#d7e8f4; color:var(--navy); font-weight:700; }
.tabs button.on{ background:var(--acc); color:#3a2700; }
.qa button{ display:block; width:100%; text-align:left; margin-top:8px; padding:12px; border-radius:10px; border:1.5px solid #c7d6e2; background:#fbfdff; font-size:15px; }
.qa button.btn{ background:var(--sea); color:#fff; text-align:center; border:0; font-weight:700; }
.qa button.btn.acc{ background:var(--acc); color:#3a2700; }
.qa button.ok{ background:#e4f6e5; border-color:var(--ok); }
.qa button.no{ background:#ffe1e1; border-color:var(--bad); }
.rulecard{ border-left:5px solid var(--sea); padding:6px 10px; margin:10px 0; background:#f4f9fc; border-radius:6px; }
.rulecard b{ color:var(--navy); }
.src{ font-size:12px; color:#5b7184; }
.mis{ display:flex; gap:12px; align-items:center; cursor:pointer; margin-top:10px; padding:12px 14px; }
.mis:active{ transform:scale(.99); }
.mis .mi{ font-size:30px; width:44px; text-align:center; }
.mis .st{ color:#f9a825; font-size:20px; white-space:nowrap; }
#misList > .card:first-child{ margin-top:14px; }
.en{ display:block; font-style:italic; font-weight:500; color:#1565c0; font-size:.92em; margin-top:2px; }
#infoTxt .en, #tip .en, #status .en{ color:#bbdefb; } #status .en{ display:inline; margin-left:6px; }
#banner .en{ color:#0d47a1; }
.pcase{ border:1px solid #d6e3ec; border-radius:10px; padding:8px; margin:8px 0; background:#fbfdff; }
.pcase canvas{ width:100%; height:150px; background:#1d6fa3; border-radius:8px; display:block; margin:6px 0; }
.pcase .sug{ font-size:12px; color:#37474f; background:#eef5fa; border-radius:6px; padding:5px 7px; }
.pcase button{ border:0; border-radius:8px; padding:7px 10px; font-weight:700; margin:6px 4px 0 0; }
.vk{ display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px solid #e6eef4; font-size:15px; }
.vk span:last-child{ color:#1565c0; font-weight:600; }


/* ---- progressi ---- */
.card.prog{ padding:12px 14px; }
.pgTop{ display:flex; align-items:center; gap:10px; }
.pgLvl{ flex:0 0 46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#ffca28,#ff8f00); color:#3a2700; font:900 22px system-ui; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2); }
.pgMid{ flex:1; font-size:14px; min-width:0; }
.pgMid .hint{ font-size:11.5px; }
.pgBar{ height:9px; border-radius:6px; background:#e3edf5; overflow:hidden; margin:4px 0 2px; }
.pgBar i{ display:block; height:100%; background:linear-gradient(90deg,#43a047,#9ccc65); border-radius:6px; transition:width .6s; }
.pgBar.goal i{ background:linear-gradient(90deg,#ff7043,#ffca28); }
.pgSt{ flex:0 0 auto; font-size:24px; text-align:center; line-height:1; }
.pgSt b{ display:block; font-size:15px; color:#e65100; }
.pgSt.off{ filter:grayscale(1); opacity:.5; }
.pgGoal{ display:flex; justify-content:space-between; font-size:13px; margin-top:8px; }
#xpToast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 64px); transform:translate(-50%,-20px); opacity:0; pointer-events:none; z-index:60;
  background:#1b5e20; color:#fff; font:800 14px system-ui; padding:9px 14px; border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,.3); transition:.3s; max-width:92vw; text-align:center; }
#xpToast.on{ opacity:1; transform:translate(-50%,0); }
table.lg{ width:100%; border-collapse:collapse; } table.lg td{ padding:7px 6px; border-bottom:1px solid #e6eef5; font-size:14px; vertical-align:middle; }
table.lg tr.me{ background:#fff6d6; }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; max-width:260px; }
.cal i{ display:block; aspect-ratio:1; border-radius:5px; background:#e3edf5; } .cal i.h{ background:#90caf9; } .cal i.g{ background:#43a047; }
.badges{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
.bd{ border:1px solid #e3edf5; border-radius:12px; padding:8px; text-align:center; } .bd span{ font-size:28px; display:block; } .bd b{ display:block; font-size:13px; } .bd small{ font-size:11px; color:#5b7186; }
.bd.off{ filter:grayscale(1); opacity:.45; }
.pillxp{ background:#fff3cd; color:#7a5200; }
</style>
</head>
<body>

<!-- ======================= MENU ======================= -->
<div id="menu" class="screen on"><div class="wrap">
  <div class="hero"><svg viewBox="0 0 120 90" aria-hidden="true"><defs><linearGradient id="sl" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d7e9f7"/></linearGradient></defs>
  <path d="M58 8 L58 66 L22 66 Z" fill="url(#sl)"/><path d="M62 16 L62 66 L92 66 Z" fill="#ffb300"/><path d="M14 70 L100 70 L90 80 L26 80 Z" fill="#e53935"/>
  <path d="M0 84 Q15 78 30 84 T60 84 T90 84 T120 84 V90 H0Z" fill="#5fb7ea"/></svg>
  <h1>Sail Academy<small data-t="subtitle"></small></h1></div>
  <div class="card prog"><div id="progCard"></div><button class="btn alt" id="goLeague" data-t="goLeague"></button></div>
  <div class="card">
    <h2 data-t="who"></h2>
    <div class="row">
      <div><label data-t="nickL"></label><input id="nick" maxlength="14" data-tp="nickP"></div>
      <div><label data-t="catL"></label><select id="cat"></select></div>
    </div>
    <div class="row">
      <div><label data-t="clsL"></label><select id="cls"></select></div>
      <div><label data-t="physL"></label><select id="phys"><option value="0" data-t="physS"></option><option value="1" data-t="physR"></option></select></div>
    </div>
    <div class="row">
      <div><label data-t="langL"></label><select id="lang"><option value="it">Italiano</option><option value="bi">Italiano + English (per imparare l’inglese)</option><option value="en">English</option></select></div>
    </div>
    <div class="hint" id="clsDesc"></div>
    <div class="hint" id="physHint"></div>
  </div>
  <div class="card">
    <h2 data-t="play"></h2>
    <button class="btn" id="goSolo" data-t="goSolo"></button>
    <button class="btn" id="goMis" data-t="goMis" style="background:#5e35b1"></button>
    <button class="btn acc" id="goCreate" data-t="goCreate"></button>
    <div class="row" style="align-items:end">
      <div><label data-t="codeL"></label><input id="joinCode" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:3px"></div>
      <div><button class="btn alt" id="goJoin" style="margin-top:0" data-t="goJoin"></button></div>
    </div>
    <div class="err" id="menuErr"></div>
    <button class="btn ok" id="goSchool" data-t="goSchool"></button>
  </div>
  <div class="foot"><span data-t="foot"></span><br><a href="#" id="goAbout" style="color:inherit;font-weight:700">Sail Academy 1.0 · <span data-t="aboutL"></span></a></div>
</div></div>

<!-- ======================= MISSIONI ======================= -->
<div id="missions" class="screen"><div class="wrap">
  <h1 data-t="misH"></h1>
  <div id="misList"></div>
  <button class="btn alt" id="misBack" data-t="back"></button>
</div></div>

<!-- ======================= IMPOSTAZIONI REGATA ======================= -->
<div id="setup" class="screen"><div class="wrap">
  <h1 id="setupTitle">Nuova regata</h1>
  <div class="card">
    <div class="row">
      <div><label data-t="sModeL"></label><select id="sMode"></select></div>
      <div><label data-t="sCourseL"></label><select id="sCourse"></select></div>
    </div>
    <div class="hint" id="sModeDesc"></div>
    <div class="row">
      <div><label data-t="sCatL"></label><select id="sCat"></select></div>
      <div><label data-t="sBotsL"></label><select id="sBots"></select></div>
    </div>
    <div class="row">
      <div><label data-t="sFlagL"></label><select id="sFlag"><option value="P" data-t="fP"></option><option value="I" data-t="fI"></option><option value="R" data-t="fR"></option></select></div>
      <div id="instrBox"><label data-t="sInstrL"></label><select id="sInstr"><option value="0" data-t="iNo"></option><option value="1" data-t="iYes"></option></select></div>
    </div>
    <div class="row">
      <div><label data-t="sWindL"></label><select id="sWind"></select></div>
      <div><label data-t="sTrendL"></label><select id="sTrend"></select></div>
    </div>
    <div class="row">
      <div><label data-t="sSeaL"></label><select id="sSea"></select></div>
      <div><label data-t="sCurL"></label><select id="sCur"></select></div>
    </div>
    <div class="hint" data-t="mixHint"></div>
    <button class="btn acc" id="setupGo" data-t="next"></button>
    <button class="btn alt" id="setupBack" data-t="back"></button>
    <div class="err" id="setupErr"></div>
  </div>
</div></div>

<!-- ======================= LOBBY ======================= -->
<div id="lobby" class="screen"><div class="wrap">
  <h1 data-t="lobbyH"></h1>
  <div class="card">
    <div class="hint" style="margin-top:0" data-t="lobCodeH"></div>
    <div class="code" id="lobCode">-----</div>
    <div class="hint" id="lobInfo"></div>
    <div id="lobRole" style="display:none"><label data-t="myRoleL"></label><select id="myRole"></select><div class="hint" id="lobCrewHint"></div></div>
    <ul class="plist" id="lobList"></ul>
    <button class="btn ok" id="lobStart" data-t="lobStart"></button>
    <div class="hint" id="lobWait" style="display:none" data-t="lobWait"></div>
    <button class="btn alt" id="lobLeave" data-t="lobLeave"></button>
    <div class="err" id="lobErr"></div>
  </div>
</div></div>

<!-- ======================= GIOCO ======================= -->
<div id="game" class="screen">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar glass">
      <div class="clockbox"><div id="clock"></div><div id="status"></div></div>
      <div id="flags"></div>
      <button class="ib" id="bPip" title="Vista timoniere / prodiere (I)">👁</button>
      <button class="ib" id="bCenter" title="Ricentra la barca (C)">◎</button>
      <button class="ib" id="bView" title="Panoramica">⤢</button>
      <button class="ib" id="bMenu" title="Menu">☰</button>
    </div>
    <div class="mid">
      <div class="info glass" id="info"><canvas id="windDial"></canvas><div id="infoTxt"></div></div>
      <div class="sheetcol" id="sheetCol">
        <div id="sailBtns"><button id="bSpi"></button><button id="bLead"></button></div>
        <button id="sheetAuto"></button>
        <div id="sheetBox" class="glass"><div class="lab" style="top:7px" data-t="cazza"></div><div id="sheetFill"></div><div id="sheetOpt"></div><div class="lab" style="bottom:7px" data-t="lasca"></div></div>
      </div>
    </div>
    <div class="dock">
      <div class="instcard glass" id="instCard"><div class="tiprow"><div id="tip"></div><button class="ib sm" id="bInst" title="Strumenti">▾</button></div><canvas id="inst"></canvas></div>
      <div class="ctrlcol" id="ctrlCol">
        <button id="bPen"></button>
        <button id="bProt" title="Protesto (regola 61.1)">🚩 <span id="bProtT"></span></button>
        <div id="callBar"></div>
        <div id="crewPad" class="glass">
          <div class="cpTitle" id="cpTitle"></div>
          <div class="cpRow"><button class="cpb" id="cpL">◀</button><button class="cpb" id="cpC"></button><button class="cpb" id="cpR">▶</button></div>
          <div class="cpRow"><button class="cpb" id="cpHike"></button><button class="cpb" id="cpFore"></button></div>
          <button id="cpBig"></button>
        </div>
        <div class="ctrlrow" id="steerRow">
          <button class="tbtn" id="bL">◀</button>
          <button id="bMan"></button>
          <button class="tbtn" id="bR">▶</button>
        </div>
      </div>
    </div>
  </div>
  <canvas id="pip"></canvas>
  <div id="banner"></div>
  <div id="protBox"></div>
  <div id="kbHint"></div>
  <div id="menuSheet" class="glass">
    <div class="zr"><button id="bZout">－</button><button id="bZin">＋</button></div>
    <button id="bSound"></button>
    <button id="bFull"></button>
    <button id="bPause" data-t="bPause"></button>
    <button id="bInstr" data-t="bInstr"></button>
    <button id="bStop" data-t="bStop"></button>
    <button id="bExit" data-t="bExit"></button>
  </div>
  <div id="instr"></div>
  <div id="pauseOv" data-t="pause"></div>
</div>

<!-- ======================= RISULTATI ======================= -->
<div id="results" class="screen"><div class="wrap">
  <h1 data-t="resH"></h1>
  <div class="card" id="resBody"></div>
  <div class="card">
    <button class="btn acc" id="resAgain">Nuova regata</button>
    <button class="btn alt" id="resMenu" data-t="resMenu"></button>
  </div>
</div></div>

<!-- ======================= CLASSIFICA ======================= -->
<div id="league" class="screen"><div class="wrap">
  <h1 data-t="goLeague"></h1>
  <div class="tabs" id="lgTabs"></div>
  <div class="card" id="lgBody"></div>
  <button class="btn alt" id="lgBack" data-t="schBack"></button>
</div></div>

<!-- ======================= INFO ======================= -->
<div id="about" class="screen"><div class="wrap">
  <h1 data-t="aboutL"></h1>
  <div class="card" id="aboutBody"></div>
  <button class="btn alt" id="aboutBack" data-t="schBack"></button>
</div></div>

  <h1 data-t="schH"></h1>

</div></div>

// =====================================================================
//  MOTORE: geometria, vento, fisica della barca
//  Convenzioni: x verso destra, y verso il basso (schermo).
//  Angoli in gradi, 0 = nord (alto), crescono in senso orario.
//  TWD = direzione DA CUI soffia il vento reale. Vento medio da nord.
// =====================================================================

const D2R = Math.PI/180;
const norm180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a; };
const norm360 = a => ((a % 360) + 360) % 360;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const dirVec = h => ({ x: Math.sin(h*D2R), y: -Math.cos(h*D2R) });
const vecHdg = (x,y) => norm360(Math.atan2(x, -y)/D2R);

function polarAt(cls, twaAbs){
  const c = CLASSES[cls];
  if (twaAbs < c.nogo) return 0;
  const P = POLARS[c.type];
  // riscala la parte bassa della polare sul no-go della classe
  for (let i=1;i<P.length;i++){
    if (twaAbs <= P[i][0]){
      const a = P[i-1], b = P[i];
      return lerp(a[1], b[1], (twaAbs - a[0])/(b[0]-a[0]));
    }
  }
  return P[P.length-1][1];
}

// ---------------------------------------------------------------------
// Generatore pseudo-casuale con seme (uguale per tutti i giocatori)
// ---------------------------------------------------------------------
function rng(seed){
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------------
// Vento: oscillazioni + raffiche (macchie scure sull'acqua)
// Deterministico: dipende solo da seme, posizione e tempo di regata.
// ---------------------------------------------------------------------
const METEO = {
  wind:  { leggero:6, medio:10, forte:16 },
  cur:   { no:0, debole:0.6, forte:1.2 },        // nodi
};
class Wind {
  constructor(seed, cat, area, S){
    S = S || {};
    const C = CATEGORIES[cat];
    const r = rng(seed);
    // limiti di sicurezza per categoria: i bambini non regatano con vento troppo forte
    this.maxKn = { bambini:12, ragazzi:17, adulti:21 }[cat] || 17;
    this.base0 = Math.min(METEO.wind[S.wind] || 10, this.maxKn - 1);   // nodi
    this.base = this.base0;
    this.trend = S.trend || 'stabile';
    const pk = this.base0 / 10;              // raffiche proporzionali al vento
    this.osc = C.windOsc;
    this.phase = r()*6.28; this.phase2 = r()*6.28;
    this.period = 70 + r()*40;
    this.area = area;        // {x0,y0,w,h}
    this.drift = 3.2;        // m/s, le raffiche scendono col vento
    this.puffs = [];
    for (let i=0;i<C.puffs;i++){
      this.puffs.push({ rx:r(), ry:r(), rad: 22 + r()*30, kn: pk*C.puffKn*(0.6+r()*0.6), sh: (r()<0.5?-1:1)*C.puffShift*(0.4+r()*0.6) });
    }
    // buchi di vento: acqua liscia e chiara
    for (let i=0;i<Math.ceil(C.puffs/2);i++){
      this.puffs.push({ rx:r(), ry:r(), rad: 20 + r()*22, kn: -pk*C.puffKn*(0.5+r()*0.3), sh: (r()<0.5?-1:1)*C.puffShift*0.3, lull:true });
    }
    // onda: arriva dalla direzione media del vento, più alta con più vento
    this.H = S.sea === 'onda' ? clamp(0.12 + 0.045*this.base0, 0.25, 1.0) : 0;   // metri
    this.lambda = 6 + 1.0*this.base0;                                             // metri
    this.wk = 2*Math.PI/this.lambda; this.wc = 1.25*Math.sqrt(this.lambda);       // m/s
    // corrente costante su tutto il campo
    const ck = (METEO.cur[S.cur] || 0) * (cat === 'bambini' ? 0.6 : 1), ca = r()*360;
    const cd = dirVec(ca); this.cur = { x: cd.x*ck*KN, y: cd.y*ck*KN, kn: ck, dir: ca };
  }
  ramp(t){ return clamp((t + 60) / 480, 0, 1); }
  // direzione media (con la rotazione persistente) e vento di base nel tempo
  meanTwd(t){ const k = this.ramp(t); return this.trend === 'destra' ? 18*k : this.trend === 'sinistra' ? -18*k : 0; }
  baseAt(t){ const k = this.ramp(t); return Math.min(this.maxKn, this.base0 * (this.trend === 'rinforza' ? 1 + 0.45*k : this.trend === 'cala' ? 1 - 0.35*k : 1)); }
  // fase dell'onda in un punto: 0 = cresta
  wavePhase(x, y, t){
    if (!this.H) return 0;
    const u = dirVec(this.meanTwd(t) + 180);
    return this.wk * (x*u.x + y*u.y - this.wc*t);
  }
  puffPos(p, t){
    const A = this.area;
    const y = A.y0 + ((p.ry*A.h + this.drift*t) % A.h);
    const x = A.x0 + p.rx*A.w + Math.sin(t/23 + p.rx*9)*8;
    return { x, y };
  }
  at(x, y, t){
    let twd = this.meanTwd(t) + this.osc*Math.sin(2*Math.PI*t/this.period + this.phase) + 0.45*this.osc*Math.sin(2*Math.PI*t/(this.period*0.41) + this.phase2);
    const base = this.baseAt(t);
    let tws = base + 0.06*base*Math.sin(t/17 + this.phase2);
    let gust = 0;
    for (const p of this.puffs){
      const q = this.puffPos(p, t);
      const d = Math.hypot(x-q.x, y-q.y);
      if (d < p.rad){ const f = 1 - (d/p.rad)**2; tws += p.kn*f; twd += p.sh*f; if (!p.lull) gust = Math.max(gust, f); }
    }
    return { twd: norm360(twd), tws: Math.max(2, tws), gust };
  }
}

// ---------------------------------------------------------------------
// Barca
// ---------------------------------------------------------------------
let BOAT_SEQ = 0;
class Boat {
  constructor(o){
    this.id = o.id || ('b' + (++BOAT_SEQ) + '_' + Math.floor(Math.random()*1e6));
    this.name = o.name || 'Barca';
    this.cls = o.cls || 'optimist';
    this.cat = o.cat || 'bambini';
    this.color = o.color || '#e74c3c';
    this.team = o.team || 0;
    this.bot = !!o.bot;
    this.skill = o.skill ?? 0.8;
    this.x = o.x||0; this.y = o.y||0; this.hdg = o.hdg ?? 270; this.speed = 0;
    this.rudder = 0; this.sheet = 0.5; this.autoSheet = true; this.realistic = false;
    this.twa = 0; this.awa = 0; this.aws = 0; this.tws = 10; this.twd = 0; this.gust = 0;
    this.sailAngle = 0; this.optSail = 0; this.trimErr = 0; this.eff = 1; this.jibErr = 0; this.jibSheet = 0.5;
    this.spi = 0; this.spiUp = 0; this.spiSheet = 0.6; this.spiErr = 0; this.spiFx = 1; this.lead = 0; this.leadD = 0;
    this.tackSide = 1;  // +1 mure a dritta, -1 mure a sinistra
    this.tacking = false; this.lastTack = -99;
    this.auto = null;   // manovra automatica {type, target, dir}
    this.penalty = 0; this.penSweep = 0; this.penStart = 0;
    this.capsized = 0; this.flyTime = 0; this.flying = 0;
    // stato regata
    this.started = false; this.ocs = false; this.ocsI = false; this.iRound = false;
    this.nextMark = 0; this.finished = false; this.finishTime = 0; this.penServed = 0; this.penUnserved = 0;
    this.markSweep = 0; this.wrongSide = 0; this.markHits = 0;
    this.trail = [];
    this.crewSheet = null; // regolazione inviata dal prodiere (modalità equipaggio)
    this.crew = [];        // equipaggio umano: {pid, name, role, side:-1|0|1 (sinistra/centro/dritta), fore:-1|0|1, hike:0|1, col}
    this.crewPos = null;   // posizioni da disegnare (anche per le barche degli altri)
    this.trimFx = 1;       // effetto dei pesi sulla velocità (per i consigli)
  }
  get C(){ return CLASSES[this.cls]; }

  // vettore velocità (m/s)
  vel(){ const d = dirVec(this.hdg); return { x: d.x*this.speed*KN, y: d.y*this.speed*KN }; }

  bow(){ const d = dirVec(this.hdg); const L = this.C.len/2; return { x:this.x + d.x*L, y:this.y + d.y*L }; }
  stern(){ const d = dirVec(this.hdg); const L = this.C.len/2; return { x:this.x - d.x*L, y:this.y - d.y*L }; }

  computeWind(w){
    this.tws = w.tws; this.twd = w.twd; this.gust = w.gust;
    this.twa = norm180(w.twd - this.hdg);
    // vento reale come moto dell'aria (verso cui va)
    const wd = dirVec(w.twd + 180);
    const wx = wd.x*w.tws, wy = wd.y*w.tws;
    const bd = dirVec(this.hdg);
    // vento di velocità = opposto al moto della barca
    const ax = wx - bd.x*this.speed, ay = wy - bd.y*this.speed;
    this.aws = Math.hypot(ax, ay);
    const awdFrom = vecHdg(-ax, -ay);
    this.awa = this.aws > 0.05 ? norm180(awdFrom - this.hdg) : this.twa;
    this.awdFrom = awdFrom;
  }

  // Angolo di vela ottimale rispetto all'asse della barca (gradi, 0 = cazzata)
  optimalSail(){
    const a = Math.abs(this.awa);

  }

  step(dt, wind, t){
    const C = this.C;
    this.computeWind(wind.at(this.x, this.y, t));

    // ---- scuffia (solo fisica realistica, categoria che la prevede) ----
    if (this.capsized > 0){
      this.capsized -= dt; this.speed = Math.max(0, this.speed - 3*dt);
      this.x += (dirVec(this.twd+180).x*0.4 + wind.cur.x)*dt; this.y += (dirVec(this.twd+180).y*0.4 + wind.cur.y)*dt;
      if (this.capsized <= 0){ this.capsized = 0; this.hdg = norm360(this.twd + 90*(this.tackSide||1)); }
      return;
    }

    // ---- manovre automatiche ----
    let r = this.rudder;
    if (this.auto){
      const A = this.auto;
      if (A.type === 'penalty'){
        r = A.dir;
      } else {
        const diff = norm180(A.target - this.hdg);
        if (Math.abs(diff) < 3 || (A.prev != null && Math.sign(diff) !== Math.sign(A.prev) && Math.abs(diff) < 30)) { this.auto = null; r = 0; }
        else { r = A.dir; A.prev = diff; }
      }
      if (this.auto && performance.now() - (this.auto.t0||0) > 15000) this.auto = null; // sicurezza
    }

    // ---- timone ----
    const vmaxNow = C.vmax;
    const aspd = Math.abs(this.speed);
    const steer = this.realistic ? (0.12 + 0.88*clamp(aspd/(0.45*vmaxNow),0,1)) : (0.55 + 0.45*clamp(aspd/(0.4*vmaxNow),0,1));
    let rate = C.turn * r * steer;
    // a marcia indietro il timone lavora al contrario (solo fisica realistica)
    if (this.realistic && this.speed < -0.05) rate = -rate * 0.7;
    this.sternway = this.speed < -0.05;
    if (this.cls === 'windsurf' && this.realistic) rate *= 0.85; // si governa con l'albero, meno diretto
    const prevTwa = this.twa;
    this.hdg = norm360(this.hdg + rate*dt);
    if (this.penalty > 0) this.penSweep += rate*dt;

    // ricalcola dopo la rotazione
    this.computeWind(wind.at(this.x, this.y, t));

    // ---- virata: passaggio della prua al vento (regola 13) ----
    if (Math.sign(this.twa) !== Math.sign(prevTwa) && Math.abs(this.twa) < 90 && Math.abs(prevTwa) < 90){
      this.tacking = true; this.lastTack = t;
    }
    if (Math.abs(this.twa) > 0.1) this.tackSide = this.twa > 0 ? 1 : -1;
    if (this.tacking && (Math.abs(this.twa) >= C.ch - 2 || t - this.lastTack > 6)) this.tacking = false;

    // ---- regolazione della vela ----
    this.optSail = this.optimalSail();
    let s;
    // con troppo vento la regolazione migliore è lascare un po' (sventare) per tenere la barca piatta
    const rfac = (Math.abs(this.awa) > 40 && Math.abs(this.awa) < 130) ? 1 : 0.6;
    const effMax = clamp(C.maxPow / Math.max(0.1, this.tws * rfac), 0.35, 1);
    this.depower = effMax < 1 ? Math.min(40, 30*Math.sqrt(1 - effMax)) : 0;
    this.optSailEff = clamp(this.optSail + this.depower, 0, 85);
    if (this.autoSheet) s = this.optSailEff/85;
    else s = this.sheet;
    this.sheet = s;
    this.sailAngle = s*85;
    // fiocco (420, Hobie 16): lo regola il prodiere; da soli segue la randa.
    // con lo spi issato il prodiere passa alla scotta dello spi e il fiocco segue la randa
    const spiOn = this.spiAllowed() && this.spiUp > 0.99;
    if (C.jib) this.jibSheet = (this.crewSheet != null && !spiOn) ? this.crewSheet : s;
    // issata / ammainata dello spi: circa 3 secondi
    if (this.spiAllowed()) this.spiUp = clamp(this.spiUp + (this.spi ? 1 : -1)*dt/3, 0, 1); else { this.spi = 0; this.spiUp = 0; }
    const absAwa = Math.abs(this.awa);
    let eff;
    this.irons = Math.abs(this.twa) < C.nogo;
    if (this.irons || absAwa < C.nogo - 12) { eff = 0; this.trimErr = 30; }
    else {
      const e = this.sailAngle - this.optSail; // >0 troppo lasca (fileggia), <0 troppo cazzata (stallo)
      this.trimErr = e;
      if (e >= 0) eff = Math.max(0, 1 - (e/30)**2);
      else eff = Math.max(0.18, 1 - (e/42)**2);
      if (absAwa > 150 && this.sailAngle > 70) eff = Math.max(eff, 0.95); // in poppa tutta fuori va bene
      if (C.jib){
        const ej = this.jibSheet*85 - this.optSail; this.jibErr = ej;   // stesso metro della randa
        let effJ = ej >= 0 ? Math.max(0, 1 - (ej/30)**2) : Math.max(0.18, 1 - (ej/42)**2);
        // carrello del fiocco (adulti): avanti con poco vento, indietro con tanto vento per svergolare e sventare
        if (this.leadAllowed()){ const optLead = this.tws < 8 ? -1 : this.tws > 14 ? 1 : 0; this.leadD = this.lead - optLead; effJ *= 1 - 0.12*Math.abs(this.leadD); }
        else this.leadD = 0;
        if (absAwa > 150) effJ = Math.max(effJ, 0.7);                   // in poppa il fiocco è coperto dalla randa
        eff = 0.7*eff + 0.3*effJ;
      }
    }
    if (C.jib && (this.irons || absAwa < C.nogo - 12)) this.jibErr = 30;
    this.eff = eff;
    // pesi a bordo: con equipaggio umano conta dove si siedono (sopravvento, fuori, avanti/indietro)
    const wSide = this.tackSide || 1;           // +1: sopravvento è il lato di dritta
    let maxPow = C.maxPow, crewFx = 1;
    if (this.leadAllowed() && this.lead > 0) maxPow *= 1.05;        // carrello indietro: balumina aperta, meno sbandamento
    this.crewIssue = null;
    if (this.crew.length){
      let lev = 0, fore = 0;
      for (const m of this.crew){ lev += (m.side*wSide) * (0.6 + 0.6*(m.hike||0)); fore += m.fore||0; }
      lev = (lev + 1.0) / (this.crew.length + 1);            // il timoniere sta sopravvento da solo
      maxPow = C.maxPow * clamp(0.75 + 0.21*lev, 0.55, 1.0);
      const twaA = Math.abs(this.twa), light = this.tws < 8, foreAvg = fore / this.crew.length;
      if (light && lev > 0.7) { crewFx *= 0.97; this.crewIssue = 'light_hike'; }        // con poco vento fuori non serve
      if (light && lev <= 0.35) crewFx *= 1.03;                                          // un po' sottovento: meno superficie bagnata
      if (twaA < 70){ crewFx *= foreAvg > 0.3 ? 1.02 : foreAvg < -0.3 ? 0.97 : 1; if (foreAvg < -0.3) this.crewIssue = this.crewIssue || 'aft_upwind'; }
      if (twaA > 100 && this.tws > 11){ crewFx *= foreAvg < -0.3 ? 1.04 : foreAvg > 0.3 ? 0.95 : 1; if (foreAvg > 0.3) this.crewIssue = this.crewIssue || 'fwd_downwind'; }
      if (this.crew.some(m => m.side === -wSide) && !light) this.crewIssue = this.crewIssue || 'leeward';
    }
    this.trimFx = crewFx;
    // ---- spinnaker (420 ragazzi/adulti) ----
    this.spiFx = 1; this.spiIssue = null;
    if (this.spiUp > 0){
      const ta = Math.abs(this.twa);
      if (this.spiUp < 1){ this.spiFx = 0.93; }                        // durante issata/ammainata la barca rallenta un po'
      else if (ta < 95 || this.irons){
        // spi issato di bolina o al traverso stretto: la barca si sdraia (straorza)
        this.spiFx = 0.55; maxPow *= 0.6; this.spiIssue = 'broach'; this.spiErr = 0;
      } else {
        const sOpt = this.optSail + 4;                                   // regolato bene: al limite del "ricciolo" sul bordo d'attacco
        if (this.crewSheet == null || this.bot) this.spiSheet = clamp(sOpt/85, 0, 1);
        else this.spiSheet = this.crewSheet;
        const e = this.spiSheet*85 - this.optSail; this.spiErr = e;
        const effS = e > 9 ? Math.max(0, 1 - (e - 9)/9) : e >= 0 ? 1 : Math.max(0.3, 1 - (e/30)**2);
        const gain = ta < 115 ? 0.10 + (ta - 95)/20*0.12 : ta < 165 ? 0.22 : 0.16;   // più utile al lasco largo
        this.spiFx = effS < 0.3 ? 0.95 : 1 + gain*effS;
        if (e > 9) this.spiIssue = 'collapse'; else if (e < -6) this.spiIssue = 'overtrim';
      }
    }

    this.overload = power / maxPow;

    // ---- velocità obiettivo ----
    const twaAbs = Math.abs(this.twa);
    let windF = Math.pow(clamp(this.tws/10, 0.3, 1.8), this.realistic ? C.gustGain : 0.55);

    // planata della tavola al traverso con raffica (realistico)
    if (this.realistic && this.cls === 'windsurf' && twaAbs > 75 && twaAbs < 135 && this.tws > 11.5 && eff > 0.75) target *= 1.25;
    target *= this.spiFx;
    if (this.overload > 1) target /= Math.pow(this.overload, 1.3);
    target *= crewFx;
    // onda: frena chi la prende di prua in bolina, fa surfare chi la segue in poppa e al lasco
    this.waveEff = 0;
    if (wind.H){
      const into = Math.cos((this.hdg - wind.meanTwd(t)) * D2R);       // 1 = prua contro l'onda
      const ph = wind.wavePhase(this.x, this.y, t);
      const size = clamp(3 / C.len, 0.5, 1.3);
      if (into > 0.2){ const k = 0.30*wind.H*into*into*(1 + 0.6*Math.max(0, Math.cos(ph)))*size; target *= 1 - k; this.waveEff = -k; }
      else if (into < -0.2 && this.speed > C.vmax*0.35){ const k = (C.type === 'mono' ? 0.4 : 0.55)*wind.H*Math.max(0, Math.sin(ph))*(-into); target *= 1 + k; this.waveEff = k; }
    }
    if (this.bot) target *= 0.8 + 0.2*this.skill; // barche del computer più o meno brave: la flotta si allunga
    // perdita di velocità quando si gira il timone
    const turnFrac = Math.abs(rate)/C.turn;
    target *= 1 - turnFrac*C.tackLoss*(this.realistic?1.0:0.6);

    // in prua al vento, con fisica realistica, il vento spinge la barca all'indietro
    if (this.realistic && this.irons && C.type !== 'board') target = -0.14 * C.vmax * clamp(this.tws/10, 0.5, 1.5) * (1 - Math.abs(this.twa)/C.nogo*0.5);
    const tau = target > this.speed ? C.tauAcc : (this.speed > 0 ? 1.4 : 2.5);

    if (!this.realistic && this.speed < 0) this.speed = 0;

    // ---- prua al vento: la barca si ferma e scade ----
    if (twaAbs < C.nogo + 1 && !this.auto && Math.abs(r) < 0.1){
      // in prua al vento la barca si ferma e la prua viene spinta lentamente via dal vento
      const k = this.realistic ? 3 : (this.speed < 0.6 ? 16 : 8);
      this.hdg = norm360(this.hdg - Math.sign(this.twa||1) * k * dt);
    }

    // ---- scafo che vola / scuffia (realistico) ----
    this.flying = clamp((this.overload - 1) / 0.25, 0, 1);
    if (this.realistic && CATEGORIES[this.cat].capsize){
      if (this.overload > 1.22){ this.flyTime += dt; }
      else this.flyTime = Math.max(0, this.flyTime - dt*2);
      if (this.flyTime > 2.6){ this.spi = 0; this.spiUp = 0; this.capsized = 7; this.speed = 0; this.flyTime = 0; this.auto = null; this.onEvent && this.onEvent('capsize'); }
    }

    // ---- spostamento ----
    const d = dirVec(this.hdg);
    let vx = d.x*this.speed*KN, vy = d.y*this.speed*KN;
    // scarroccio leggero e scadimento in prua al vento
    const lee = dirVec(this.twd + 180);
    const leeK = 0.04 + (twaAbs < C.nogo ? 0.35 : 0) * (this.speed < 1 ? 1 : 0.3);
    vx += lee.x*leeK; vy += lee.y*leeK;
    // corrente: sposta la barca rispetto al fondo
    vx += wind.cur.x; vy += wind.cur.y;
    this.x += vx*dt; this.y += vy*dt;

    if (!this.trail.length || Math.hypot(this.trail[this.trail.length-1].x - this.x, this.trail[this.trail.length-1].y - this.y) > 2){
      this.trail.push({x:this.x, y:this.y}); if (this.trail.length > 60) this.trail.shift();
    }
  }

  // ---- comandi di manovra ----
  startTack(){
    if (this.capsized || this.auto) return;
    const C = this.C, ch = C.ch;
    const side = this.twa >= 0 ? 1 : -1;
    // nuova rotta: bolina stretta sulle altre mure
    const target = norm360(this.twd + side*ch);
    this.auto = { type:'tack', target, dir: side, t0: performance.now() };
  }
  startGybe(){
    if (this.capsized || this.auto) return;
    const side = this.twa >= 0 ? 1 : -1;
    const keep = clamp(Math.abs(this.twa), 135, 165);
    // nuova rotta: stesso angolo dal vento sulle mure opposte
    const tgt = norm360(this.twd + side*keep);
    this.auto = { type:'gybe', target: tgt, dir: -side, t0: performance.now() };
  }
  spiAllowed(){ return !!(this.C.spi && this.cat !== 'bambini'); }
  leadAllowed(){ return !!(this.C.jib && this.cat === 'adulti'); }
  setSpi(v){ if (!this.spiAllowed() || this.capsized) return; this.spi = v ? 1 : 0; }
  maneuver(){ // pulsante unico: vira se di bolina/traverso, stramba se in poppa
    if (Math.abs(this.twa) < 100) this.startTack(); else this.startGybe();
  }
  startPenaltyTurns(){
    if (this.penalty <= 0 || this.capsized) return;
    this.auto = { type:'penalty', dir: (this.twa >= 0 ? 1 : -1), t0: performance.now() + 60000 };
    this.penSweep = 0;
  }

  // stato compatto per la rete
  // posizioni dell'equipaggio da disegnare: timoniere a poppa sopravvento + equipaggio umano
  updCrewPos(){
    if (!this.crew.length){ this.crewPos = null; return; }
    const w = this.tackSide || 1, hk = clamp(((this.overload||0) - 0.55)/0.5, 0, 1);
    this.crewPos = [{ side: w, fore: -1, hike: hk, col: '#ff7043' }].concat(this.crew.map(m => ({ side: m.side, fore: m.fore || 0, hike: m.hike || 0, col: m.col || '#ffca28' })));
  }

//  REGATA: percorso, sequenza di partenza, giri di boa, regole,

const TIME_SCALE = 1.8;  // secondi di simulazione per secondo reale

    this.pairs = new Map();       // stato per coppie (regola 18, cooldown)

  buildCourse(){

  placeBoats(){

      minD:+d.toFixed(2), avgL:(a.C.len+b.C.len)/2, turned: this.headingChange(rw, 2.2) > 14, twd:+rw.twd.toFixed(1),

  }
  contactsOnly(arr){
    for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) if (this.contact(arr[i], arr[j])) this.separate(arr[i], arr[j]);
  }
  clear18(a,b){ const P = this.pairs.get(this.pairKey(a,b)); if (P) { P.m18 = false; P.entitled = null; } }
  update18(a, b, P){
    if (!(this.ruleActive(a,'r18') || this.ruleActive(b,'r18')) || this.training) { P.m18 = false; return; }
    if (!a.started || !b.started || a.nextMark !== b.nextMark || a.nextMark >= this.marks.length){ P.m18 = false; P.entitled = null; return; }
    const M = this.marks[a.nextMark];
    const near = Math.min(Math.hypot(a.x-M.x,a.y-M.y), Math.hypot(b.x-M.x,b.y-M.y));
    const zone = 3 * Math.max(a.C.len, b.C.len);
    const inA = Math.hypot(a.x-M.x,a.y-M.y) < zone, inB = Math.hypot(b.x-M.x,b.y-M.y) < zone;
    if (!inA && !inB){ P.m18 = false; P.entitled = null; P.mk = null; return; }
    if (P.m18 && P.mk === a.nextMark) return;
    // eccezione 18.1(a)(1): mure opposte su un'andatura di bolina
    if (a.tackSide !== b.tackSide && Math.abs(a.twa) < 70 && Math.abs(b.twa) < 70) { P.m18 = false; return; }
    P.m18 = true; P.mk = a.nextMark;
    if (this.overlapped(a, b)){
      const da = Math.hypot(a.x-M.x,a.y-M.y), db = Math.hypot(b.x-M.x,b.y-M.y);
      P.entitled = da < db ? a.id : b.id; // barca interna
    } else {
      P.entitled = inA ? a.id : b.id;     // chi è entrata per prima
    }
  }

  // distanza tra segmenti (scafi come capsule)
  segDist(p1,p2,q1,q2){
    const d1={x:p2.x-p1.x,y:p2.y-p1.y}, d2={x:q2.x-q1.x,y:q2.y-q1.y}, r={x:p1.x-q1.x,y:p1.y-q1.y};
    const a=d1.x*d1.x+d1.y*d1.y, e=d2.x*d2.x+d2.y*d2.y, f=d2.x*r.x+d2.y*r.y;
    let s,t; const c=d1.x*r.x+d1.y*r.y, b=d1.x*d2.x+d1.y*d2.y, den=a*e-b*b;

    }
    s = den>1e-9 ? clamp((b*f-c*e)/den,0,1) : 0;

    const cx=p1.x+d1.x*s-(q1.x+d2.x*t), cy=p1.y+d1.y*s-(q1.y+d2.y*t);

  }
  contact(a, b){
    const r = this.segDist(a.stern(), a.bow(), b.stern(), b.bow());
    return r.d < (a.C.beam + b.C.beam)/2 * 0.8;
  }
  separate(a, b){
    const r = this.segDist(a.stern(), a.bow(), b.stern(), b.bow());
    const need = (a.C.beam + b.C.beam)/2*0.8 - r.d;
    const n = Math.hypot(r.nx, r.ny) || 1;
    const ux = r.nx/n, uy = r.ny/n;
    if (this.local.has(a.id)){ a.x += ux*need*0.6; a.y += uy*need*0.6; a.speed *= 0.6; }
    if (this.local.has(b.id)){ b.x -= ux*need*0.6; b.y -= uy*need*0.6; b.speed *= 0.6; }

  timeToContact(a, b, k = 1){
    const va = a.vel(), vb = b.vel();
    const rx = b.x-a.x, ry = b.y-a.y, vx = vb.x-va.x, vy = vb.y-va.y;
    const vv = vx*vx+vy*vy; if (vv < 1e-4) return null;
    const tc = -(rx*vx+ry*vy)/vv; if (tc < 0) return null;
    const cx = rx+vx*tc, cy = ry+vy*tc;
    const lim = (a.C.len + b.C.len)/2 * k;

  }

  // ------------------------------------------------------------------
  // Barche del computer
  // ------------------------------------------------------------------
  crowded(b){
    for (const o of this.boats.values()) if (o !== b && !o.finished && !o.ghost && Math.hypot(o.x-b.x,o.y-b.y) < 3.5*Math.max(b.C.len, o.C.len)) return true;
    return false;
  }
  // La barca passerebbe davanti a "o" se continuasse? (per le partenze e gli incroci)
  // la rotta h passa lontano da boe, boa di partenza e Comitato?
  pathClear(b, h){
    // traccia sul fondo: velocità della barca più la corrente
    const v = Math.max(Math.abs(b.speed), b.C.vmax*0.3)*KN, d = dirVec(h), c = this.wind.cur;
    const gx = d.x*v + c.x, gy = d.y*v + c.y, T = 3*TIME_SCALE;
    const look = Math.max(10, Math.hypot(gx, gy)*T) / Math.max(0.01, Math.hypot(gx, gy));
    const ahead = { x: b.x + gx*look, y: b.y + gy*look };
    for (const ob of this.obstacles()){
      if (this.segDist({x:b.x, y:b.y}, ahead, ob.a, ob.b).d < b.C.beam/2 + ob.r + 1.8) return false;
    }
    return true;
  }
  // distanza minima prevista tra b (con rotta h) e o nei prossimi T secondi di simulazione
  predictGap(b, h, o, T){
    const v = Math.max(b.speed, b.C.vmax*0.35) * KN, d = dirVec(h);
    const vo = o.vel();   // la corrente sposta entrambe allo stesso modo: si annulla nel moto relativo
    const rx = o.x - b.x, ry = o.y - b.y, wx = vo.x - d.x*v, wy = vo.y - d.y*v;
    const ww = wx*wx + wy*wy;
    const tm = ww > 1e-6 ? clamp(-(rx*wx + ry*wy)/ww, 0, T) : 0;
    return Math.hypot(rx + wx*tm, ry + wy*tm);
  }
  // evita le barche da cui ci si deve tenere discosti (e all'ultimo anche le altre, regola 14)
  avoid(b, desired){
    const C = b.C, T = 4.5*TIME_SCALE, threats = [];
    for (const o of this.boats.values()){
      if (o === b || o.finished || o.ghost) continue;
      const dist = Math.hypot(o.x-b.x, o.y-b.y), lim = (C.len + o.C.len)*0.62 + 1;
      if (dist > 9*Math.max(C.len, o.C.len)) continue;

      const mustAvoid = row && row.kc === b;
      const last = !mustAvoid && this.predictGap(b, b.hdg, o, 1.2*TIME_SCALE) < lim*0.8;  // regola 14
      if (mustAvoid || last) threats.push({ o, lim: mustAvoid ? lim : lim*0.8 });

      if (safe(h)) return { h, slow: Math.abs(off) >= 90 };
      const g = Math.min(...threats.map(t => this.predictGap(b, h, t.o, T) - t.lim));
      if (g > bestGap){ bestGap = g; best = h; }

    return { h: best ?? desired, slow: true };
  }
  botThink(b, dt){

    const C = b.C, s = b.tackSide;
    // --- penalità: prima allontanarsi da barche e boe (44.2), poi i giri ---
    if (b.penalty > 0 && !b.auto){
      let near = false;
      for (const o of this.boats.values()) if (o !== b && Math.hypot(o.x-b.x,o.y-b.y) < 4*C.len) near = true;
      for (const m of this.marks) if (Math.hypot(m.x-b.x,m.y-b.y) < 4*C.len + 3) near = true;
      if (!near || this.t - b.penStart > 25){ b.startPenaltyTurns(); return; }

    }

    if (b.auto) return;

    // vento medio "ricordato" dal bot per riconoscere i salti
    b._twdAvg = b._twdAvg == null ? b.twd : norm360(b._twdAvg + norm180(b.twd - b._twdAvg) * Math.min(1, dt/40));

    }

    let tx, ty, slow = false;
    const hw = this.lineW/2;
    if (!b.started && !this.training){
      if (!b._plan){ const n = b._nSlots || 1, k = (b._slot ?? 0) - (n-1)/2; b._plan = { x: k*(this.lineW*0.8/n), hy: 24 + ((b._slot||0)%2)*14, early: (Math.random()-0.5)*(1-b.skill)*6, dir: 1 }; }
      const P = b._plan;
      const tToGun = -this.t;
      const vmg = Math.max(0.5, C.vmax*0.6*KN*TIME_SCALE) * (0.8 + 0.2*b.skill);
      const timeToLine = Math.max(0, b.y) / vmg;
      if (b.ocsI){ tx = (b.x > 0 ? 1 : -1)*(hw + 12); ty = 12; }
      else if (b.ocs || (this.t >= 0 && b.y <= 0)){ tx = clamp(b.x, -hw*0.7, hw*0.7); ty = 14; }
      else if (this.t < 0 && tToGun > timeToLine + 6 + P.early){
        // attesa dietro la linea: avanti e indietro al traverso, vela lasca
        if ((P.dir > 0 && b.x > P.x + 10) || (P.dir < 0 && b.x < P.x - 10)) P.dir = -P.dir;
        tx = P.x + P.dir*30; ty = P.hy;
        if (Math.abs(b.y - P.hy) < 6) slow = true;
      } else {
        tx = clamp(this.t >= 0 ? b.x : P.x, -hw*0.75, hw*0.75); ty = -20;
        // troppo in anticipo? rallenta lascando la vela invece di passare la linea
        if (this.t < 0 && timeToLine < tToGun - 1.5 - P.early && b.y < 12) slow = true;
        if (this.t < 0 && b.y < 2.5) slow = true;
      }
    } else {
      const mi = b.nextMark;
      if (mi < this.marks.length){
        const M = this.marks[mi];
        const dm = Math.hypot(M.x-b.x, M.y-b.y);
        let rr = Math.max(7, C.len*2.6) + this.wind.cur.kn*4;
        // spazio alla boa: se la barca interna ha diritto, gira più larghi
        for (const o of this.boats.values()){
          if (o === b) continue; const P = this.pairs.get(this.pairKey(b,o));
          if (P && P.m18 && P.entitled === o.id) rr += C.len*1.6;
        }
        if (dm < rr*3.2 && b.markSweep > -20){
          const a = Math.atan2(-(b.y - M.y), b.x - M.x) + 75*D2R;
          tx = M.x + Math.cos(a)*rr; ty = M.y - Math.sin(a)*rr;
        } else {
          const toM = vecHdg(M.x - b.x, M.y - b.y);
          const off = dirVec(toM + 90);
          tx = M.x + off.x*rr; ty = M.y + off.y*rr;
        }
      } else { tx = b._finX ?? (b._finX = (Math.random()-0.5)*this.lineW*0.6); ty = -15; }
    }

    // corrente: si mira più a monte per arrivare dove si vuole
    if (this.wind.cur.kn){
      const eta = Math.hypot(tx - b.x, ty - b.y) / Math.max(1, Math.abs(b.speed)*KN*0.8);
      tx -= this.wind.cur.x*Math.min(eta, 40); ty -= this.wind.cur.y*Math.min(eta, 40);
    }
    const bearing = vecHdg(tx - b.x, ty - b.y);
    const twaM = norm180(b.twd - bearing);
    const ch = C.ch + 1, dn = C.type === 'cat' ? 142 : (C.type==='board'?150:168);
    const abs = Math.abs(twaM), side = Math.sign(twaM) || 1;
    const canMan = !this.crowded(b) && this.t - (b._lastMan ?? -99) > 6 && !this.avoid(b, b.hdg);
    const man = kind => { b._lastMan = this.t; kind === 'tack' ? b.startTack() : b.startGybe(); };
    let desired;
    if (abs >= ch && abs <= dn){
      desired = bearing;
      if (side !== s && canMan){ man(abs < 100 ? 'tack' : 'gybe'); return; }
    } else if (abs < ch){
      desired = norm360(b.twd - s*ch);
      if (side !== s && abs >= ch - 4 && (canMan || abs > ch + 15)){ man('tack'); return; }
      // salto di vento: se la barca "scade" (buono sulle altre mure) i bot bravi virano
      const shift = norm180(b.twd - b._twdAvg) * s;
      if (b.started && shift < -5 - (1-b.skill)*8 && canMan && abs < ch*0.8 && Math.random() < b.skill*0.05){ man('tack'); return; }
    } else {
      desired = norm360(b.twd - s*dn);
      if (side !== s && abs <= dn + 4 && (canMan || abs < dn - 15)){ man('gybe'); return; }
    }

    // --- precedenze: scegliere la rotta più vicina a quella voluta che non porta a contatto ---
    const av = this.avoid(b, desired);
    if (av){ desired = av.h; if (av.slow) slow = true; }
    // --- non urtare boe, boa di partenza e Comitato ---
    if (!this.pathClear(b, desired)){
      let found = null;
      for (const off of [15,-15,30,-30,45,-45,60,-60,90,-90]){
        const h = norm360(desired + off);
        if (Math.abs(norm180(b.twd - h)) < C.nogo) continue;
        if (this.pathClear(b, h)){ found = h; break; }
      }
      if (found != null) desired = found; else slow = true;
    }
    if (slow){ b.autoSheet = false; b.sheet = 0.95; }
    const err = norm180(desired - b.hdg);
    b.rudder = clamp(err/14, -1, 1) * (0.75 + 0.25*b.skill);
  }

  // ------------------------------------------------------------------
  // Classifica
  // ------------------------------------------------------------------
  finishRace(){
    if (this.over) return;
    this.over = true;
    this.results = Race.computeResults([...this.boats.values()].filter(b => !b.ghost), this.S);
    if (this.onOver) this.onOver(this.results);
  }
  static computeResults(boats, S){
    const classes = new Set(boats.map(b => b.cls));
    const mixed = S.cat === 'mista' || classes.size > 1;
    const rows = boats.map(b => {
      const pen = (b.penUnserved||0) * 15;
      let el = b.finished ? b.finishTime + pen : null;
      let corr = el;
      if (el != null && mixed){
        corr = el * classFactor(b.cls) * (S.cat === 'mista' ? CATEGORIES[b.cat].handicap : 1);
      }
      return { id:b.id, name:b.name, cls:b.cls, cat:b.cat, team:b.team, bot:b.bot, color:b.color, fin:b.finished, el, corr, pen:b.penUnserved||0, served:b.penServed||0, stt:b.startTime ?? null };
    });
    rows.sort((a,b) => (a.corr==null) - (b.corr==null) || (a.corr - b.corr));
    rows.forEach((r,i) => r.pos = r.fin ? i+1 : rows.length + 1);
    const out = { rows, mixed, mode:S.mode };
    if (S.mode === 'squadre'){
      out.teams = [0,0];
      rows.forEach(r => { out.teams[r.team] += r.pos; });
    }
    if (S.mode === 'sfida'){
      const target = S.targetTime;
      const ok = rows.filter(r => r.fin && r.el <= target).length;
      const pens = rows.reduce((s,r) => s + r.served + r.pen, 0);
      out.sfida = { target, ok, total: rows.length, pens, win: ok === rows.length };
      out.sfida.stars = (out.sfida.win ? 1 : 0) + (out.sfida.win && pens === 0 ? 1 : 0) + (ok >= rows.length*0.5 ? 1 : 0);
    }
    return out;
  }

  // Tempo obiettivo per la sfida collaborativa
  targetTime(){
    let L = 0, p = {x:0,y:0};
    for (const m of this.marks){ L += Math.hypot(m.x-p.x, m.y-p.y); p = m; }
    L += Math.hypot(p.x, p.y);
    let vmin = Infinity; for (const b of this.boats.values()) vmin = Math.min(vmin, b.C.vmax);
    if (!isFinite(vmin)) vmin = 4.6;
    const avg = vmin * 0.55 * KN * TIME_SCALE;
    return Math.round(L / avg * 1.45);
  }
}

//  GRAFICA: campo di regata, barche, boe, strumenti didattici

// texture del mare generata una volta: increspature chiare e scure, ripetibile senza giunture
function makeWaterTex(dark){
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), r = rng(dark ? 77 : 41);
  g.lineCap = 'round';
  // variazioni morbide di colore (acqua più chiara e più scura), senza giunture
  if (!dark) for (let i = 0; i < 26; i++){
    const x = r()*N, y = r()*N, rad = 40 + r()*110, light = r() < 0.5;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]){
      const gr = g.createRadialGradient(x+ox, y+oy, 0, x+ox, y+oy, rad);
      gr.addColorStop(0, light ? 'rgba(120,200,240,0.10)' : 'rgba(0,30,70,0.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x+ox-rad, y+oy-rad, 2*rad, 2*rad);
    }
  }
  const strokes = dark ? 900 : 520;
  for (let i = 0; i < strokes; i++){
    const x = r()*N, y = r()*N, len = (dark ? 5 : 6) + r()*(dark ? 10 : 18), ang = (r() - 0.5) * 0.5, bend = (r() - 0.5) * 5;
    const light = dark ? r() < 0.25 : r() < 0.62;
    g.strokeStyle = light ? `rgba(255,255,255,${dark ? 0.05 + r()*0.12 : 0.03 + r()*0.07})` : `rgba(0,25,55,${dark ? 0.06 + r()*0.22 : 0.03 + r()*0.06})`;
    g.lineWidth = dark ? 0.8 + r()*1.6 : 0.7 + r()*1.0;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]){
      const cx = x + ox, cy = y + oy, dx = Math.cos(ang)*len/2, dy = Math.sin(ang)*len/2;
      g.beginPath(); g.moveTo(cx - dx, cy - dy); g.quadraticCurveTo(cx, cy - 2.5 + bend*0.2, cx + dx, cy + dy); g.stroke();
    }
  }
  return c;
}
class Renderer {
  constructor(canvas, inst, dial){
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.inst = inst; this.ictx = inst.getContext('2d');
    this.dial = dial; this.dctx = dial.getContext('2d');
    this.cam = { x:0, y:0, s:8 };
    this.texA = this.ctx.createPattern(makeWaterTex(false), 'repeat');
    this.texB = this.ctx.createPattern(makeWaterTex(true), 'repeat');
    this.zoom = 1; this.mode = 'follow'; this.followId = null;
  }
  resize(){

    for (const c of [this.cv, this.inst, this.dial]){
      const r = c.getBoundingClientRect();
      c.width = Math.max(1, Math.round(r.width*dpr)); c.height = Math.max(1, Math.round(r.height*dpr));
      c._dpr = dpr; c._w = r.width; c._h = r.height;
    }
  }
  w2s(x, y){ const c=this.cam, W=this.cv._w, H=this.cv._h; return { x: W/2 + (x-c.x)*c.s, y: H/2 + (y-c.y)*c.s }; }

  updateCamera(race, dt){

    let tx, ty, ts;
    const target = race.boat(this.followId) || race.me();
    if (this.mode === 'panorama' || !target){
      const xs = [race.committee?.x||25, race.pin?.x||-25], ys = [0];
      race.marks.forEach(m => { xs.push(m.x); ys.push(m.y); });
      for (const b of race.boats.values()){ xs.push(b.x); ys.push(b.y); }
      const minX = Math.min(...xs)-30, maxX = Math.max(...xs)+30, minY = Math.min(...ys)-40, maxY = Math.max(...ys)+40;
      tx = (minX+maxX)/2; ty = (minY+maxY)/2;
      ts = Math.min(W/(maxX-minX), H/(maxY-minY)) * this.zoom;
    } else {
      const v = target.vel(), F = this.free || { x:W/2, y:H/2, w:W, h:H };
