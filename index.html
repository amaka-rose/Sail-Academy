};

function dayKey(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayDiff(a, b){ return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
function weekKey(d = new Date()){ const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); }   // lunedì della settimana
function prevWeekKey(){ const x = new Date(); x.setDate(x.getDate() - 7); return weekKey(x); }

const Progress = {
  get p(){
    if (!App.prefs.prog) App.prefs.prog = {};
    const p = App.prefs.prog;
    p.xp ??= 0; p.goal ??= 30; p.days ??= {}; p.streak ??= 0; p.best ??= 0; p.last ??= null; p.freezes ??= 0;
    p.badges ??= {}; p.cnt ??= {}; p.group ??= {}; p.week ??= { k: weekKey(), xp: 0 };
    if (p.week.k !== weekKey()){ p.lastWeek = p.week; p.week = { k: weekKey(), xp: 0 }; }
    return p;
  },
  save(){ Store.set({ prog: App.prefs.prog }); },
  level(xp = this.p.xp){ let L = 1; while (xp >= 25*L*(L+1)) L++; return L; },        // 50, 150, 300, 500, 750…
  levelFloor(L){ return 25*(L-1)*L; },
  title(L){ const t = LEVELS[Math.min(L, LEVELS.length) - 1]; return tx(t[0], t[1]); },
  today(){ return this.p.days[dayKey()] || 0; },
  // serie mostrata: valida se l'ultimo obiettivo è di oggi o di ieri (o se i salvagenti coprono i giorni persi)
  streakNow(){
    const p = this.p; if (!p.last) return 0;
    const gap = dayDiff(p.last, dayKey());
    return gap <= 1 || gap - 1 <= p.freezes ? p.streak : 0;
  },
  add(n, why){
    if (!n) return;
    const p = this.p, before = this.today(), lvl0 = this.level();
    p.xp += n; p.week.xp += n; p.days[dayKey()] = before + n;
    // tieni solo gli ultimi 70 giorni
    const ks = Object.keys(p.days).sort(); while (ks.length > 70) delete p.days[ks.shift()];
    const msgs = [`+${n} XP · ${why}`];
    if (before < p.goal && before + n >= p.goal){
      const t = dayKey();
      if (p.last !== t){
        const gap = p.last ? dayDiff(p.last, t) : 1;
        if (gap === 1) p.streak++;
        else if (gap > 1 && gap - 1 <= p.freezes){ p.freezes -= gap - 1; p.streak++; msgs.push(tx(`🛟 Usati ${gap-1} salvagenti: la serie continua!`, `🛟 Used ${gap-1} streak freeze(s): streak saved!`)); }
        else p.streak = 1;
        p.last = t; p.best = Math.max(p.best, p.streak);
        msgs.push(tx(`🎯 Obiettivo del giorno raggiunto! 🔥 ${p.streak} ${p.streak === 1 ? 'giorno' : 'giorni di fila'}`, `🎯 Daily goal reached! 🔥 ${p.streak}-day streak`));
        if (p.streak % 7 === 0 && p.freezes < 2){ p.freezes++; msgs.push(tx('🛟 Hai guadagnato un salvagente: protegge la serie se salti un giorno.','🛟 You earned a streak freeze: it protects your streak if you miss a day.')); }
        if (p.streak >= 3) this.badge('streak3'); if (p.streak >= 7) this.badge('streak7'); if (p.streak >= 30) this.badge('streak30');
      }
    }
    const lvl1 = this.level();
    if (lvl1 > lvl0){ msgs.push(tx(`⬆️ Livello ${lvl1}: ${this.title(lvl1)}!`, `⬆️ Level ${lvl1}: ${this.title(lvl1)}!`)); if (lvl1 >= 5) this.badge('level5'); }
    this.save(); this.toast(msgs); this.share();
  },
  count(k, n = 1){ const c = this.p.cnt; c[k] = (c[k] || 0) + n; this.save(); return c[k]; },
  badge(k){
    const p = this.p; if (p.badges[k] || !BADGES[k]) return;
    p.badges[k] = dayKey(); this.save();
    const b = BADGES[k]; this.toast([`${b[0]} ${tx('Nuovo traguardo','New badge')}: ${tx(b[1][0], b[1][1])}`]);
  },
  toast(lines){
    let el = document.getElementById('xpToast');
    if (!el){ el = document.createElement('div'); el.id = 'xpToast'; document.body.appendChild(el); }
    el._lines = (el.classList.contains('on') ? (el._lines || []) : []).concat(lines).slice(-3);   // al massimo 3 righe
    el.innerHTML = el._lines.map(esc).join('<br>');
    el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => { el.classList.remove('on'); el._lines = []; }, 3800);
    renderProgressCard();
  },
  // riepilogo da far vedere agli altri nella stanza (solo soprannome e numeri di gioco)
  summary(){ const p = this.p; return { lvl: this.level(), wk: p.week.k, wxp: p.week.xp, st: this.streakNow(), xp: p.xp }; },
  remember(name, s){
    if (!name || !s) return; const key = name.trim().toLowerCase(); if (!key) return;
    const g = this.p.group, old = g[key];
    // tiene anche il punteggio della settimana scorsa per la classifica "settimana scorsa"
    const lastWeek = old && old.wk !== s.wk ? { wk: old.wk, wxp: old.wxp } : (old && old.lastWeek);
    g[key] = { name: name.slice(0, 14), lvl: s.lvl, wk: s.wk, wxp: s.wxp, st: s.st, xp: s.xp, seen: dayKey(), lastWeek };
    const keys = Object.keys(g); if (keys.length > 60){ keys.sort((a, b) => (g[a].seen > g[b].seen ? 1 : -1)); delete g[keys[0]]; }
    this.save();
  },
  share(){
    if (!App.online || !App.net) return;
    const m = { t:'prog', name: App.prefs.nick || 'Velista', s: this.summary() };
    if (App.net.isHost) App.net.broadcast(m); else App.net.toHost(m);
  },

  // ---------------- regole dei punti ----------------
  onRace(res, myId, crew){
    const r = res.rows.find(x => x.id === myId); if (!r) return;
    const humans = res.rows.length;
    let xp = 0, why = [];
    if (r.fin){
      xp += 10; why.push(tx('regata finita','race finished'));
      if (humans >= 2){
        const bonus = r.pos === 1 ? 15 : r.pos === 2 ? 10 : r.pos === 3 ? 6 : (r.pos <= Math.ceil(humans/2) ? 3 : 0);
        if (bonus){ xp += bonus; why.push(r.pos <= 3 ? tx(`${r.pos}° posto`, `${r.pos}${['st','nd','rd'][r.pos-1]} place`) : tx('prima metà','top half')); }
      }
      if (!r.pen && !r.served){ xp += 5; why.push(tx('nessuna penalità','no penalties')); if (this.count('clean') >= 10) this.badge('clean10'); }
      if (r.stt != null && r.stt <= 5 && res.mode !== 'allenamento'){ xp += 5; why.push(tx('partenza perfetta','perfect start')); if (this.count('starts') >= 10) this.badge('starter10'); }
      if (crew){ xp += 3; why.push(tx('lavoro di squadra','teamwork')); if (this.count('crewRaces') >= 5) this.badge('crew5'); }
      this.count('races'); this.badge('first_race');
      if (r.pos === 1 && humans >= 2){ this.count('wins'); this.badge('first_win'); }
      if (r.pos <= 3 && humans >= 3 && this.count('podiums') >= 5) this.badge('podium5');
    } else { xp += 3; why.push(tx('in acqua anche oggi','out on the water')); }
    this.add(xp, why.join(' · '));
    return { xp, why };
  },
  onMission(M, stars, old){
    if (!stars) { this.add(2, tx('missione provata','mission attempted')); return; }
    let xp = 5*stars + (old ? 0 : 10);
    this.add(xp, tx(`missione ${'★'.repeat(stars)}`, `mission ${'★'.repeat(stars)}`) + (old ? '' : tx(' · prima volta',' · first time')));
    const st = App.prefs.stars || {};
    if (MISSIONS.every(m => st[m.id] >= 1)) this.badge('missions');
    if (MISSIONS.every(m => st[m.id] >= 3)) this.badge('missions3');
  },
  onQuiz(ok){ if (ok){ this.add(2, tx('risposta giusta','right answer')); if (this.count('quizOk') >= 100) this.badge('quiz100'); } },
  onQuizEnd(score, n){ if (score === n) this.add(5, tx('quiz perfetto','perfect quiz')); },
  onVocab(ok){ if (ok){ this.add(1, tx('parola giusta','right word')); if (this.count('vocabOk') >= 50) this.badge('vocab50'); } },
  onGhost(){ this.add(10, tx('nuovo record','new record')); this.badge('ghost'); },
};

// scheda nel menu: livello, barra XP, serie e obiettivo del giorno
function renderProgressCard(target){
  if (!target){ const c2 = document.getElementById('progCard2'); if (c2) renderProgressCard(c2); }
  const el = target || document.getElementById('progCard'); if (!el) return;
  const P = Progress, p = P.p, L = P.level(), f0 = P.levelFloor(L), f1 = P.levelFloor(L+1);
  const frac = Math.min(1, (p.xp - f0)/(f1 - f0)), today = P.today(), st = P.streakNow();
  const done = today >= p.goal;
  el.innerHTML = `
    <div class="pgTop"><div class="pgLvl">${L}</div>
      <div class="pgMid"><b>${esc(P.title(L))}</b> · ${p.xp} XP<div class="pgBar"><i style="width:${Math.round(frac*100)}%"></i></div><span class="hint">${f1 - p.xp} ${tx('XP al livello','XP to level')} ${L+1}</span></div>
      <div class="pgSt${st ? '' : ' off'}" title="${tx('Giorni di fila','Day streak')}">🔥<b>${st}</b></div></div>
    <div class="pgGoal"><span>${done ? '✅' : '🎯'} ${tx('Obiettivo di oggi','Today’s goal')}: <b>${Math.min(today, p.goal)}/${p.goal} XP</b></span>${p.freezes ? `<span>🛟×${p.freezes}</span>` : ''}</div>
    <div class="pgBar goal"><i style="width:${Math.round(Math.min(1, today/p.goal)*100)}%"></i></div>`;
}

// schermata classifica e traguardi
function openLeague(tab = 'week'){
  const P = Progress, p = P.p, me = (App.prefs.nick || 'Velista');
  P.remember(me, P.summary());
  const tabs = [['week', tx('Questa settimana','This week')], ['last', tx('Settimana scorsa','Last week')], ['me', tx('I miei progressi','My progress')], ['badges', tx('Traguardi','Badges')]];

  $('lgTabs').querySelectorAll('button').forEach(b => b.onclick = () => openLeague(b.dataset.k));

    if (!rows.length) h += `<p>${tx('Ancora nessun punto in questa settimana: gioca una regata!','No points yet this week: sail a race!')}</p>`;
    else h += `<table class="lg">` + rows.map((r, i) => `<tr class="${r.k === meKey ? 'me' : ''}"><td>${['🥇','🥈','🥉'][i] || (i + 1)}</td><td><b>${esc(r.name)}</b>${r.k === meKey ? tx(' (tu)',' (you)') : ''}<br><span class="hint">${tx('Liv.','Lv.')} ${r.lvl} · ${esc(P.title(r.lvl))}${r.st ? ' · 🔥' + r.st : ''}</span></td><td style="text-align:right"><b>${r.xp}</b> XP</td></tr>`).join('') + `</table>`;
  } else if (tab === 'me'){

    h += `<div id="progCard2"></div>
      <h2>${tx('Ultime 4 settimane','Last 4 weeks')}</h2><div class="cal">${cells.join('')}</div>
      <p class="hint">${tx('Verde: obiettivo raggiunto · azzurro: hai giocato un po’','Green: goal reached · blue: some play')}</p>

const COLORS = ['#e53935','#1e88e5','#fdd835','#43a047','#8e24aa','#fb8c00','#00acc1','#d81b60','#6d4c41','#3949ab','#7cb342','#f4511e'];

// ------------------------- preferenze locali -------------------------
const Store = {
  k: 'velaregata.v1',
  get(){ try { return JSON.parse(localStorage.getItem(this.k)) || {}; } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem(this.k, JSON.stringify(Object.assign(this.get(), o))); } catch(e){} },
};

  prefs: Object.assign({ nick:'', cat:'bambini', cls:'optimist', phys:0, races:0, lang:'it', stars:{}, ghosts:{} }, Store.get()),

function confirmTap(btn, fn){
  if (btn._armed){ clearTimeout(btn._armed); btn._armed = null; btn.textContent = btn._label; fn(); return; }
  btn._label = btn.textContent; btn.textContent = tx('Tocca ancora','Tap again');
  btn._armed = setTimeout(() => { btn._armed = null; btn.textContent = btn._label; }, 2500);
}
function notice(msg){ const e = $('menuErr'); if (e) e.textContent = msg; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); if (id === 'menu' && typeof renderProgressCard === 'function') renderProgressCard(); }
function fmt(t){ const s = Math.max(0, Math.round(Math.abs(t))); return (t < 0 ? '−' : '') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function opt(sel, items, val){ sel.innerHTML = items.map(([v,t]) => `<option value="${v}">${esc(t)}</option>`).join(''); if (val != null) sel.value = val; }
function compass(deg){ const n = LANG.cur === 'en' ? ['N','NE','E','SE','S','SW','W','NW'] : ['N','NE','E','SE','S','SO','O','NO']; return n[Math.round(norm360(deg)/45) % 8]; }
function boatName(id){ const b = App.race && App.race.boat(id); return b ? b.name : '?'; }

// ------------------------- suoni (segnali) -------------------------
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); if (AC) SEA.init(AC); }
function beep(dur=0.35, f=880){
  if (!AC) return;
  try { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.value = 0.06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur); } catch(e){}
}

  opt($('sTrend'), Object.keys(METEO_T.trend).map(k => [k, meteoT('trend', k)]), kid ? 'stabile' : 'sorpresa');
  opt($('sSea'), Object.keys(METEO_T.sea).map(k => [k, meteoT('sea', k)]), kid ? 'calmo' : 'sorpresa');
  opt($('sCur'), Object.keys(METEO_T.cur).map(k => [k, meteoT('cur', k)]), kid ? 'no' : 'sorpresa');
  const upd = () => { $('sModeDesc').textContent = modeDesc($('sMode').value); $('sFlag').disabled = $('sCat').value === 'bambini'; $('sBots').disabled = ['allenamento','cronometro'].includes($('sMode').value); };
  $('sMode').oninput = upd; $('sCat').oninput = upd; upd();
  $('setupErr').textContent = '';
  $('setupBack').onclick = () => show('menu');
  $('setupGo').onclick = async () => {
    App.S = { mode: $('sMode').value, course: $('sCourse').value, cat: $('sCat').value, nBots: +$('sBots').value, flag: $('sFlag').value,
              wind: $('sWind').value, trend: $('sTrend').value, sea: $('sSea').value, cur: $('sCur').value };
    App.instructor = online && $('sInstr').value === '1';
    if (!online){ App.roster = [ me2roster('host') ]; startRaceHost(); return; }
    $('setupGo').disabled = true; $('setupErr').textContent = tx('Creo la stanza…','Creating the room…');
    try {
      App.net = new Net(); bindNet();

      App.roster = [ Object.assign(me2roster('host'), { role: App.instructor ? 'spectator' : 'helm' }) ];
      $('setupErr').textContent = '';

    } catch(e){ $('setupErr').textContent = tx('Impossibile creare la stanza: ','Could not create the room: ') + e.message + tx(' Se stai provando il gioco dentro Claude, il gioco online funziona solo dalla versione pubblicata sul web.',' If you are trying the game inside Claude, online play only works from the version published on the web.'); }
    $('setupGo').disabled = false;

}
function me2roster(pid){

function openMissions(){

    MISSIONS.map((m, i) => { const st = stars[m.id] || 0; return `<div class="card mis" data-i="${i}"><div class="mi">${m.icon}</div><div style="flex:1"><b>${i+1}. ${tb(m.t[0], m.t[1])}</b><div class="hint">${tb(m.d[0], m.d[1])}</div></div><div class="st">${'★'.repeat(st)}<span style="opacity:.3">${'★'.repeat(3-st)}</span></div></div>`; }).join('');

function startMission(M){

function missionDone(res){
  SEA.update(null, false);
  const M = App.mission.M; const old = (App.prefs.stars || {})[M.id] || 0;
  if (res.stars > old){ App.prefs.stars = Object.assign({}, App.prefs.stars, { [M.id]: res.stars }); Store.set({ stars: App.prefs.stars }); }
  // punti: le stelle nuove valgono di più, rifare una missione già perfetta vale poco
  if (res.stars > old) Progress.onMission(M, res.stars, old); else Progress.add(res.stars ? 2 : 1, tx('allenamento missione','mission practice'));
  App.mission.done = true;
  const R = App.race; if (R) R.over = true;

    <p>${res.stars ? tb('Missione completata!','Mission complete!') : tb('Missione non riuscita: riprova!','Mission failed: try again!')} ${res.extra || ''}</p>

  $('resAgain').textContent = tx('Riprova','Try again');

//  STANZA ONLINE
// =====================================================================
async function joinRoom(code){
  code = (code||'').toUpperCase().trim();
  if (code.length < 4){ $('menuErr').textContent = tx('Inserisci il codice della stanza.','Enter the room code.'); return; }
  $('menuErr').textContent = tx('Mi collego alla stanza ','Joining room ') + code + '…';
  try {
    App.net = new Net(); bindNet(); App.online = true; App.instructor = false; App.mission = null;
    await App.net.joinRoom(code);
    App.net.toHost({ t:'join', p: me2roster(App.net.myPid) });
    $('menuErr').textContent = '';
    openLobby(code);
  } catch(e){ $('menuErr').textContent = e.message + tx(' (Il gioco online funziona dalla versione pubblicata sul web, non dall’anteprima dentro Claude.)',' (Online play works from the version published on the web, not from the preview inside Claude.)'); App.net && App.net.close(); App.net = null; }
}
function openLobby(code){
  $('lobCode').textContent = code;
  const host = App.net && App.net.isHost;
  $('lobStart').style.display = host ? '' : 'none';
  $('lobWait').style.display = host ? 'none' : '';
  $('lobInfo').innerHTML = host && App.S
    ? `${tx('Modalità','Mode')}: <b>${esc(modeName(App.S.mode))}</b> · ${esc(courseName(App.S.course))} · <b>${esc(catShort(App.S.cat))}</b>${App.instructor ? ' · <b>' + tx('modalità istruttore','coach mode') + '</b>' : ''}<br>${tx('Fino a 8 giocatori. Chi entra può timonare o regolare la scotta di un compagno (equipaggio).','Up to 8 players. Each can steer or trim the sheet of a team-mate (crew).')}`
    : tx('Puoi timonare la tua barca oppure regolare la scotta di un compagno.','You can steer your own boat or trim a team-mate’s sheet.');
  $('lobLeave').onclick = () => { App.net && App.net.close(); App.net = null; show('menu'); };
  $('lobStart').onclick = () => {
    const helms = App.roster.filter(r => r.role === 'helm').length;
    if (helms + App.S.nBots === 0){ $('lobErr').textContent = tx('Serve almeno una barca in acqua.','At least one boat is needed.'); return; }
    if (helms + App.S.nBots > 12){ $('lobErr').textContent = tx('Massimo 12 barche in totale.','Maximum 12 boats in total.'); return; }
    $('lobErr').textContent = ''; startRaceHost();
  };
  $('myRole').onchange = () => {
    const v = $('myRole').value;
    const role = v === 'helm' ? 'helm' : 'crew';
    const crewRole = role === 'crew' ? v.split(':')[0] : null, crewOf = role === 'crew' ? v.split(':').slice(1).join(':') : null;
    if (host){ const r = App.roster.find(r => r.pid === 'host'); r.role = role; r.crewOf = crewOf; r.crewRole = crewRole; lobbyChanged(); }
    else App.net.toHost({ t:'role', role, crewOf, crewRole });
  };
  renderLobby(); show('lobby');
}
function renderLobby(){
  const host = App.net && App.net.isHost;
  const myPid = App.net ? App.net.myPid : 'host';
  const teams = App.S && App.S.mode === 'squadre';
  $('lobList').innerHTML = App.roster.map((r, i) => {
    const hn = esc((App.roster.find(x => x.pid === r.crewOf)||{}).name || '?');
    const role = r.role === 'helm' ? tx('Timoniere','Helm') : r.role === 'crew' ? tx('Prodiere di ','Crew for ') + hn : tx('Istruttore','Coach');
    const teamSel = teams && r.role === 'helm' ? (host ? `<select data-pid="${r.pid}" class="teamSel"><option value="0"${r.team==0?' selected':''}>● ${tx('Squadra Blu','Blue team')}</option><option value="1"${r.team==1?' selected':''}>◆ ${tx('Squadra Gialla','Yellow team')}</option></select>` : `<span class="pill">${r.team ? '◆ ' + tx('Gialla','Yellow') : '● ' + tx('Blu','Blue')}</span>`) : '';
    return `<li><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span><b>${esc(r.name)}</b>${r.pid===myPid?tx(' (tu)',' (you)'):''}
      <span class="pill">${esc(catShort(r.cat))}</span><span class="pill">${esc(CLASSES[r.cls].name)}</span><span class="pill">${role}</span>${r.prog ? `<span class="pill pillxp">${tx('Liv.','Lv.')} ${r.prog.lvl}${r.prog.st ? ' · 🔥' + r.prog.st : ''}</span>` : ''}${teamSel}</li>`;
  }).join('') + (App.S && App.S.nBots ? `<li><span class="dot" style="background:#90a4ae"></span>+ ${App.S.nBots} ${tx('barche del computer','computer boats')}</li>` : '');
  document.querySelectorAll('.teamSel').forEach(s => s.onchange = () => { const r = App.roster.find(x => x.pid === s.dataset.pid); r.team = +s.value; lobbyChanged(); });
  const me = App.roster.find(r => r.pid === myPid);
  if (me && !(host && App.instructor)){
    $('lobRole').style.display = '';
    // equipaggio realistico: solo le barche in doppio (420, Hobie 16) hanno un posto per il prodiere
    const helms = App.roster.filter(r => r.role === 'helm' && r.pid !== myPid && crewFree(r, myPid) > 0);
    const opts = [['helm', tx('Timoniere della mia barca','Helm of my own boat')]];
    helms.forEach(h => opts.push(['scotta:' + h.pid, tx('Prodiere (fiocco, trapezio e chiamate) sul ','Crew (jib, trapeze and calls) on the ') + CLASSES[h.cls].name + tx(' di ',' of ') + h.name]));
    opt($('myRole'), opts, me.role === 'crew' ? 'scotta:' + me.crewOf : 'helm');
    $('lobCrewHint').innerHTML = tb('Optimist, ILCA e windsurf sono barche singole. In due si va solo su <b>420</b> e <b>Hobie Cat 16</b>: timoniere + prodiere.','Optimist, ILCA and windsurf are single-handers. Two people sail only on the <b>420</b> and the <b>Hobie Cat 16</b>: helm + crew.');
  } else $('lobRole').style.display = 'none';
}
// posti liberi per il prodiere sulla barca di un timoniere (escluso chi chiede)
function crewFree(h, exceptPid){
  const cap = (CLASSES[h.cls] && CLASSES[h.cls].crew) || 0;
  return cap - App.roster.filter(r => r.role === 'crew' && r.crewOf === h.pid && r.pid !== exceptPid).length;
}
// l'host fa rispettare l'equipaggio di ogni classe
function validateCrew(){
  const used = {};
  App.roster.forEach(r => {
    if (r.role !== 'crew') return;
    const h = App.roster.find(x => x.pid === r.crewOf && x.role === 'helm');
    const cap = h ? ((CLASSES[h.cls] && CLASSES[h.cls].crew) || 0) : 0;
    used[r.crewOf] = (used[r.crewOf] || 0) + 1;
    if (!h || used[r.crewOf] > cap){ r.role = 'helm'; r.crewOf = null; r.crewRole = null; }
    else r.crewRole = 'scotta';
  });
}
function lobbyChanged(){
  validateCrew();
  if (App.S.mode === 'squadre'){
    const h = App.roster.filter(r => r.role === 'helm');
    const c0 = h.filter(r => r.team === 0).length, c1 = h.length - c0;
    if (Math.abs(c0 - c1) > 1) h.forEach((r,i) => r.team = i % 2);
  }
  renderLobby();
  App.net.broadcast({ t:'lobby', roster: App.roster, S: App.S });
}

// =====================================================================
//  MESSAGGI DI RETE
// =====================================================================
function bindNet(){
  const N = App.net;
  N.on('msg', (m, from) => { if (N.isHost) hostMsg(m, from); else clientMsg(m); });
  N.on('leave', pid => {
    App.roster = App.roster.filter(r => r.pid !== pid);
    App.roster.forEach(r => { if (r.crewOf === pid) { r.role = 'helm'; r.crewOf = null; } });
    if (!App.race) lobbyChanged();
  });
  N.on('hostlost', () => { if (App.net) tryRejoin(0); });
}
// collegamento perso: si riprova a rientrare nella stessa stanza con la stessa barca
async function tryRejoin(n){
  const R = App.race, code = App.net && App.net.code;
  if (!code) return;
  if (!R || !R.myId){ leaveGame(); notice(tx('Collegamento con la stanza interrotto.','Connection to the room lost.')); return; }
  if (n >= 6){ leaveGame(); notice(tx('Collegamento con la stanza interrotto.','Connection to the room lost.')); return; }
  App.hostWait = true; R.paused = true;
  try { App.net.close(); } catch(e){}
  try {
    App.net = new Net(); bindNet();
    await App.net.joinRoom(code);
    App.net.toHost({ t:'rejoin', boatId: R.myId, name: App.prefs.nick });
  } catch(e){ setTimeout(() => tryRejoin(n + 1), 2500); }
}
function ownerPid(boatId){ if (App.owner && App.owner[boatId]) return App.owner[boatId]; return boatId.startsWith('p_') ? boatId.slice(2) : 'host'; }
function hostMsg(m, from){
  const R = App.race;
  switch (m.t){
    case 'rejoin': {
      // un giocatore caduto rientra nella regata con la sua barca
      if (!R || !R.boat(m.boatId)){ App.net.send({ t:'busy' }, from); return; }
      App.owner = App.owner || {}; App.owner[m.boatId] = from;
      const old = App.roster.find(r => 'p_' + r.pid === m.boatId); if (old) old.pid = from;
      App.net.send({ t:'start', S: R.S, boats: [...R.boats.values()].filter(b => !b.ghost).map(b => b.pack()), roster: App.roster, lineW: R.lineW, youAre: m.boatId, rt: R.t }, from);
      break;
    }
    case 'join': {
      if (App.race){ App.net.send({ t:'busy' }, from); return; }
      if (App.roster.length >= 8){ App.net.send({ t:'full' }, from); return; }
      const p = m.p; p.pid = from; p.name = String(p.name).slice(0,14) || 'Velista';
      p.role = 'helm'; p.crewOf = null; p.team = App.roster.filter(r => r.role==='helm').length % 2;
      if (p.prog) Progress.remember(p.name, p.prog);
      App.roster.push(p); lobbyChanged(); break;
    }
    case 'role': { const r = App.roster.find(x => x.pid === from); if (!r) return; r.role = m.role; r.crewOf = m.crewOf; r.crewRole = m.crewRole; lobbyChanged(); break; }
    case 'crewpos': if (R){ const b = R.boat(m.id); if (!b) return; if (R.local.has(m.id)) applyCrewPos(b, m); else App.net.send(m, ownerPid(m.id)); } break;
    case 'call': handleCall(m); App.net.broadcast(m, from); break;
    case 'prog': { Progress.remember(m.name, m.s); const r = App.roster.find(x => x.pid === from); if (r) r.prog = m.s; App.net.broadcast(m, from); break; }
    case 'st': if (R){ const b = R.boat(m.b.id); if (b && !R.local.has(b.id)) b.unpack(m.b); } break;
    case 'sheet': if (R){ const b = R.boat(m.id); if (!b) return; if (R.local.has(m.id)) b.crewSheet = m.s; else App.net.send(m, ownerPid(m.id)); } break;
    case 'sail': if (R){ const b = R.boat(m.id); if (!b) return; if (R.local.has(m.id)) applySail(b, m); else App.net.send(m, ownerPid(m.id)); } break;
    case 'inc': if (R){ R.incidents.push(m.inc); if (R.incidents.length > 80) R.incidents.shift(); renderInstr(); } break;
    case 'prot': hostProtest(m.p); break;
    case 'protAcc': protAccepted(m.id); break;
    case 'protJury': { const p = App.protests.get(m.id); if (p && p.status === 'aperta') toJury(p); break; }
  }
}
function clientMsg(m){
  switch (m.t){
    case 'lobby': App.roster = m.roster; App.S = m.S; App.roster.forEach(r => r.prog && Progress.remember(r.name, r.prog)); if (!App.race) renderLobby(); break;
    case 'prog': Progress.remember(m.name, m.s); break;
    case 'full': leaveGame(); notice(tx('La stanza è piena (massimo 8 giocatori).','The room is full (8 players max).')); break;
    case 'busy': leaveGame(); notice(tx('La regata in questa stanza è già iniziata. Riprova tra poco.','The race in this room has already started. Try again shortly.')); break;
    case 'start': startRaceClient(m); break;
    case 'tick': {
      const R = App.race; if (!R) return;
      App.lastTickAt = performance.now(); App.hostWait = false;
      R.paused = !!m.p; if (Math.abs(R.t - m.rt) > 0.3) R.t = m.rt;
      for (const p of m.b){
        if (R.local.has(p.id)) continue;
        let b = R.boat(p.id); if (!b){ b = new Boat({ id:p.id }); R.boats.set(p.id, b); }
        b.unpack(p);
      }
      break;
    }
    case 'sheet': { const R = App.race; if (R && R.boat(m.id) && R.local.has(m.id)) R.boat(m.id).crewSheet = m.s; break; }
    case 'sail': { const R = App.race; if (R && R.boat(m.id) && R.local.has(m.id)) applySail(R.boat(m.id), m); break; }
    case 'crewpos': { const R = App.race; if (R && R.boat(m.id) && R.local.has(m.id)) applyCrewPos(R.boat(m.id), m); break; }
    case 'call': handleCall(m); break;
    case 'protested': showProtested(m.p); break;
    case 'protUpd': protUpdate(m.p); break;
    case 'res': if (App.race){ App.race.over = true; showResults(m.res); } break;
    case 'back': App.race = null; App.roster = m.roster || App.roster; openLobby(App.net.code); break;
  }
}

//  PROTESTE (regole 60.2, 44.1 e definizione di "tenersi discosta")

function isHost(){ return !App.online || App.net.isHost; }
// incrocio ravvicinato rilevato su questo dispositivo
function onEncounter(enc){
  const R = App.race; if (!R || R.over) return;
  const me = R.me();
  // il giocatore coinvolto può decidere se protestare
  if (me && (enc.kc === me.id || enc.row === me.id) && !me.finished){
    const other = enc.kc === me.id ? enc.row : enc.kc;
    protCard({
      key: 'enc' + enc.id, ttl: 9000,
      html: tb(`Incrocio ravvicinato con <b>${esc(boatName(other))}</b>. Pensi che abbia infranto una regola?`, `Close crossing with <b>${esc(boatName(other))}</b>. Do you think she broke a rule?`),
      buttons: [[tx('PROTESTO!','PROTEST!'), 'bprot', () => startProtest(enc, me.id, other)], [tx('No','No'), 'bjury', null]],
    });
  }
  // le barche del computer a volte protestano (non sempre a ragione)
  if (isHost()){
    const rw = R.boat(enc.row), kc = R.boat(enc.kc);
    if (rw && rw.bot && R.local.has(rw.id) && kc && !(kc.bot && rw.bot)){
      const strong = enc.turned || enc.minD < 0.35*enc.avgL;
      if (Math.random() < (strong ? 0.75 : 0.18) * (0.6 + 0.4*rw.skill)) setTimeout(() => startProtest(enc, rw.id, kc.id), 700 + Math.random()*1200);
    }
  }
}
// pulsante "Protesto": scegli l'incidente degli ultimi 60 secondi e la barca da protestare
function openProtestPicker(){
  const R = App.race, me = R && R.me(); if (!me || R.over) return;
  const mine = (R.encLog || []).filter(e => (e.kc === me.id || e.row === me.id) && R.t - e.t <= 60 && !App.protests.has(e.id + '_' + me.id)).slice(-3).reverse();
  if (!mine.length){
    protCard({ key:'pick', ttl: 7000, html: tb('Nessun incrocio ravvicinato o contatto negli ultimi 60 secondi. Si protesta solo per un fatto avvenuto vicino a te, subito dopo (regola 61.1: grida «Protesto!» e alza la bandiera rossa).','No close crossing or contact in the last 60 seconds. You can only protest an incident near you, right after it happens (rule 61.1: hail “Protest!” and show the red flag).'), buttons: [[tx('Ho capito','OK'), 'bjury', null]] });
    return;
  }
  mine.forEach(e => {
    const other = e.kc === me.id ? e.row : e.kc, ago = Math.round(R.t - e.t);
    protCard({ key:'pick' + e.id, ttl: 10000,
      html: tb(`${e.contact ? 'Contatto' : 'Incrocio ravvicinato'} con <b>${esc(boatName(other))}</b>, ${ago} s fa. Protesti?`, `${e.contact ? 'Contact' : 'Close crossing'} with <b>${esc(boatName(other))}</b>, ${ago} s ago. Protest?`),
      buttons: [[tx('PROTESTO!','PROTEST!'), 'bprot', () => startProtest(e, me.id, other)], [tx('Annulla','Cancel'), 'bjury', null]] });
  });
}
function startProtest(enc, byId, againstId){
  const R = App.race; if (!R) return;
  const p = { id: enc.id + '_' + byId, enc, by: byId, against: againstId, byName: boatName(byId), againstName: boatName(againstId), status:'aperta', t: R.t };
  const b = R.boat(byId); if (b) b.hailUntil = performance.now() + 3500;
  if (R.me() && byId === R.me().id) pushBanner({ key:'r60' }, R.me().cat);
  beep(0.15, 1200);
  if (isHost()) hostProtest(p); else App.net.toHost({ t:'prot', p });
}
function hostProtest(p){
  const R = App.race; if (!R || App.protests.has(p.id)) return;
  App.protests.set(p.id, p); renderInstr();
  const ag = R.boat(p.against);
  if (!ag) return;
  if (ag.bot && R.local.has(ag.id)){
    // il bot accetta il 44.1 se sa di avere torto
    setTimeout(() => {
      if (p.status !== 'aperta') return;
      if (p.enc.kc === ag.id && Math.random() < 0.55 + 0.4*ag.skill){ applyPenalty(ag, 'r441', { protest: p.byName }); protAccepted(p.id); }
      else toJury(p);
    }, 1500 + Math.random()*1500);
  } else {
    const owner = ownerPid(ag.id);
    if (owner === 'host') showProtested(p); else App.net.send({ t:'protested', p }, owner);
    setTimeout(() => { if (p.status === 'aperta') toJury(p); }, 13000);
  }
  broadcastProt(p);
}
function showProtested(p){
  const R = App.race; const me = R && R.me(); if (!me || me.id !== p.against) return;
  const r = p.enc.rule;
  protCard({
    key: 'pr' + p.id, ttl: 12000,
    html: tb(`<b>${esc(p.byName)}</b> ti protesta (${ruleN(r)} – ${RULE_TXT[r].t}). Se sai di aver sbagliato fai subito il giro (regola 44.1), altrimenti decide la giuria.`,
             `<b>${esc(p.byName)}</b> protests you (${RULE_NUM_EN(RULE_TXT[r].n)} – ${(RULE_EN[r]||{}).t}). If you know you were wrong take your turn now (rule 44.1), otherwise the jury decides.`),
    buttons: [[tx('Faccio il giro','I take the turn'), 'bacc', () => {
        applyPenalty(me, 'r441', { protest: p.byName });
        if (App.mission && App.mission.M.id === 'proteste' && p.enc.kc === me.id) App.mission.st.ok++;
        if (isHost()) protAccepted(p.id); else App.net.toHost({ t:'protAcc', id: p.id });
      }], [tx('Decida la giuria','Let the jury decide'), 'bjury', () => { if (isHost()) { const q = App.protests.get(p.id); if (q && q.status === 'aperta') toJury(q); } else App.net.toHost({ t:'protJury', id: p.id }); }]],
  });
}
function protAccepted(id){
  const p = App.protests.get(id); if (!p || p.status !== 'aperta') return;
  p.status = 'accettata'; broadcastProt(p); protUpdate(p);
}
function toJury(p){
  if (p.status !== 'aperta') return;
  p.status = 'giuria';
  p.sug = judge(p);
  if (App.instructor){ broadcastProt(p); renderInstr(); pushBanner({ key:'jury_new', extra: p.byName + ' → ' + p.againstName }, 'ragazzi'); beep(0.2, 600); }
  else setTimeout(() => resolveProt(p, p.sug.ok), 1200);
}
// Giuria automatica: chi doveva tenersi discosto? L'altra barca ha dovuto manovrare?
function judge(p){
  const e = p.enc, R = RULE_TXT[e.rule], En = RULE_EN[e.rule] || {};
  if (e.kc !== p.against){
    return { ok:false, it:`${p.againstName} aveva diritto di rotta: per la ${R.n} (${R.t}) era ${p.byName} a doversi tenere discosta.`,
                        en:`${p.againstName} had right of way: under ${RULE_NUM_EN(R.n)} (${En.t}) it was ${p.byName} who had to keep clear.` };
  }
  if (e.turned || e.minD < 0.35*e.avgL){
    return { ok:true, it:`${p.againstName} doveva tenersi discosta (${R.n} – ${R.t}) e ${e.turned ? p.byName + ' ha dovuto cambiare rotta per evitarla' : 'il passaggio è stato così stretto che ' + p.byName + ' non avrebbe potuto cambiare rotta senza toccarla'}.`,
                       en:`${p.againstName} had to keep clear (${RULE_NUM_EN(R.n)} – ${En.t}) and ${e.turned ? p.byName + ' had to change course to avoid her' : 'the gap was so small that ' + p.byName + ' could not have changed course without contact'}.` };
  }
  return { ok:false, it:`${p.againstName} si è tenuta discosta: ${p.byName} ha potuto seguire la sua rotta senza manovre evasive (definizione di «Tenersi discosta»).`,
                      en:`${p.againstName} kept clear: ${p.byName} could hold her course without taking avoiding action (definition of “Keep Clear”).` };
}
function resolveProt(p, ok, byCoach){
  if (p.status === 'accolta' || p.status === 'respinta' || p.status === 'accettata') return;
  p.status = ok ? 'accolta' : 'respinta'; p.coach = !!byCoach;
  p.verdict = byCoach ? (ok ? { it: tx('L’istruttore ha accolto la protesta.','The coach upheld the protest.'), en:'The coach upheld the protest.' } : { it:'L’istruttore ha respinto la protesta.', en:'The coach dismissed the protest.' }) : p.sug;
  if (byCoach && p.sug) p.verdict = { it: p.verdict.it + ' ' + p.sug.it, en: p.verdict.en + ' ' + p.sug.en };
  broadcastProt(p); protUpdate(p); renderInstr();
}
function broadcastProt(p){ if (App.online && App.net.isHost) App.net.broadcast({ t:'protUpd', p }); }
// ogni dispositivo applica le decisioni alle proprie barche
function protUpdate(p){
  const R = App.race; if (!R) return;
  const old = App.protests.get(p.id);
  if (old && old !== p) Object.assign(old, p); else if (!old) App.protests.set(p.id, p);
  const q = App.protests.get(p.id);
  if (q._shown === q.status) return; q._shown = q.status;
  const me = R.me();
  const involved = me && (me.id === q.by || me.id === q.against);
  if (q.status === 'accolta'){
    const ag = R.boat(q.against);
    if (ag && R.local.has(ag.id)){
      if (ag.finished) ag.penUnserved = (ag.penUnserved||0) + CATEGORIES[R.boatCat(ag)].penaltyTurns;
      else applyPenalty(ag, q.enc.rule, { protest: q.byName });
    }
  }
  if (App.mission && App.mission.M.id === 'proteste' && me && q.by === me.id){ if (q.status === 'accolta') App.mission.st.ok++; if (q.status === 'respinta') App.mission.st.bad++; }
  if (involved && ['accolta','respinta','accettata'].includes(q.status)) pushBanner({ key:'verdict', p:q }, me.cat);
  renderInstr();
}
function applyPenalty(b, rule, x){ const R = App.race; if (!R) return; R.givePenalty(b, rule, x); }

// piccola scheda con pulsanti al centro dello schermo
function protCard(o){
  const box = $('protBox');
  const old = box.querySelector(`[data-k="${o.key}"]`); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'pc'; d.dataset.k = o.key;
  d.innerHTML = `<div>${o.html}</div>` + o.buttons.map((b, i) => `<button class="${b[1]}" data-i="${i}">${esc(b[0])}</button>`).join('');
  d.querySelectorAll('button').forEach(btn => btn.onclick = () => { const f = o.buttons[+btn.dataset.i][2]; d.remove(); f && f(); });
  box.appendChild(d);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => d.remove(), o.ttl || 9000);
}

function startRaceHost(){
  App.owner = {};
  const S = Object.assign({}, App.S);
  S.seed = Math.floor(Math.random()*1e9);
  const fleetCat = S.cat === 'mista' ? 'ragazzi' : S.cat;
  S.prepFlag = fleetCat === 'bambini' ? 'P' : (S.flag === 'R' ? (Math.random() < 0.5 ? 'P' : 'I') : (S.flag || 'P'));
  // condizioni "a sorpresa": si decidono qui, una volta per tutti i giocatori
  const pick = a => a[Math.floor(Math.random()*a.length)];
  if (!S.wind || S.wind === 'sorpresa') S.wind = pick(['leggero','medio','medio','forte']);
  if (!S.trend || S.trend === 'sorpresa') S.trend = pick(['stabile','rinforza','cala','destra','sinistra']);
  if (!S.sea || S.sea === 'sorpresa') S.sea = S.wind === 'leggero' ? pick(['calmo','calmo','onda']) : pick(['calmo','onda','onda']);
  if (!S.cur || S.cur === 'sorpresa') S.cur = pick(['no','no','debole','forte']);
  if (App.mission) S.nBots = App.mission.M.S.nBots || 0;
  else if (S.mode === 'allenamento' || S.mode === 'cronometro') S.nBots = 0;
  const R = new Race(S, true);
  const helms = App.roster.filter(r => r.role === 'helm');
  if (S.mode === 'squadre'){ const c0 = helms.filter(r=>r.team===0).length; if (c0 === 0 || c0 === helms.length) helms.forEach((r,i)=> r.team = i%2); }
  let ci = 0;
  helms.forEach(r => {
    const idx = App.roster.indexOf(r);
    const b = new Boat({ id:'p_' + r.pid, name:r.name, cls:r.cls, cat: S.cat === 'mista' ? r.cat : S.cat, color: COLORS[idx % COLORS.length], team: r.team });
    R.boats.set(b.id, b); ci = Math.max(ci, idx+1);
  });
  const teamBal = [helms.filter(r => r.team === 0).length, helms.filter(r => r.team === 1).length];
  const hostCls = App.roster[0].cls;
  for (let i=0;i<S.nBots;i++){
    const team = teamBal[0] <= teamBal[1] ? 0 : 1; teamBal[team]++;
    const cls = S.cat === 'mista' || helms.length === 0 ? hostCls : helms[i % helms.length].cls;
    const b = new Boat({ id:'bot_' + i, name: BOT_NAMES[i % BOT_NAMES.length], cls, cat: fleetCat, color: COLORS[(ci + i) % COLORS.length], team, bot:true, skill: 0.55 + Math.random()*0.4 });
    R.boats.set(b.id, b); R.local.add(b.id);
  }
  R.placeBoats();
  S.targetTime = R.targetTime(); R.S.targetTime = S.targetTime;
  const myR = App.roster.find(r => r.pid === 'host');
  App.myRole = myR ? myR.role : 'spectator'; App.crewOf = myR ? myR.crewOf : null;
  if (App.myRole === 'helm'){ R.myId = 'p_host'; R.local.add('p_host'); }
  // fantasma del cronometro
  if (S.mode === 'cronometro' && R.me()){
    const key = ghostKey(R.me(), S);
    const g = (App.prefs.ghosts || {})[key];
    if (g){ const gb = new Boat({ id:'ghost', name: tx('Fantasma ','Ghost ') + fmt(g.time), cls: R.me().cls, cat: R.me().cat, color:'#cfd8dc' }); gb.ghost = true; gb.track = g.pts; R.boats.set('ghost', gb); }
    App.ghostRec = { key, pts: [], lastT: -99 };
  } else App.ghostRec = null;
  setupLocalBoats(R);
  if (App.online){
    const packs = [...R.boats.values()].map(b => b.pack());
    App.net.broadcast({ t:'start', S, boats: packs, roster: App.roster, lineW: R.lineW });
  }
  beginGame(R);
}
function ghostKey(b, S){ return [b.cls, S.course, b.cat].join('|'); }
function startRaceClient(m){
  if (m.youAre && App.race && App.race.myId === m.youAre){
    // rientro dopo una disconnessione: si riparte dallo stato del server, senza rifare la partenza
    const R = App.race;
    for (const p of m.boats){ if (p.id === R.myId) continue; let b = R.boat(p.id); if (!b){ b = new Boat({ id:p.id }); R.boats.set(p.id, b); } b.unpack(p); }
    R.t = m.rt; R.lastSignal = R.currentSignal(); R.paused = false; App.hostWait = false; App.lastTickAt = performance.now();
    return;
  }
  const R = new Race(m.S, false);
  if (m.rt != null){ R.t = m.rt; R.lastSignal = R.currentSignal(); }
  for (const p of m.boats){ const b = new Boat({ id:p.id }); b.unpack(p); b.x = p.x; b.y = p.y; b.hdg = p.h; R.boats.set(b.id, b); }
  R.setLineWidth(m.boats.length); R.lineW = m.lineW || R.lineW; R.committee = { x:R.lineW/2, y:0 }; R.pin = { x:-R.lineW/2, y:0 };
  App.roster = m.roster; App.S = m.S; App.mission = null;
  const me = App.roster.find(r => r.pid === App.net.myPid);
  App.myRole = me ? me.role : 'spectator'; App.crewOf = me ? me.crewOf : null;
  if (App.myRole === 'helm'){ R.myId = m.youAre || ('p_' + App.net.myPid); R.local.add(R.myId); }
  setupLocalBoats(R);
  beginGame(R);
}
function setupLocalBoats(R){
  const b = R.me();
  if (b){
    b.realistic = !!App.prefs.phys && !(b.cat === 'bambini' && App.prefs.races < 3);
    b.autoSheet = CATEGORIES[b.cat].autoSheet;
    const crewR = App.roster.filter(r => r.role === 'crew' && 'p_' + r.crewOf === b.id);
    if (crewR.length && C_JIB(b)) b.crewSheet = 0.3;     // il prodiere regola il fiocco, il timoniere la randa
    b.crew = crewR.map((r, i) => ({ pid: r.pid, name: r.name, role: r.crewRole || 'scotta', side: b.tackSide || 1, fore: 0, hike: 0, col: ['#ffca28','#29b6f6','#ab47bc'][i % 3] }));
    b.onEvent = e => { if (e === 'capsize') R.msgs.push({ key:'capsize', t: performance.now() }); };
  }
  for (const id of R.local){ const x = R.boat(id); if (x.bot) { x.realistic = false; x.autoSheet = true; } }
}

function beginGame(R){
  App.race = R; App.lastTickAt = performance.now(); App.hostWait = false; App.bannerUntil = 0; App.gustT = -99; App.gustWarnT = -99; App.protests = new Map();
  App.viewId = App.myRole === 'crew' ? 'p_' + App.crewOf : R.myId;
  if (!App.rend) App.rend = new Renderer($('cv'), $('inst'), $('windDial'));
  App.rend.mode = App.viewId ? 'follow' : 'panorama'; App.rend.followId = App.viewId; App.rend.zoom = 1;
  R.onIncident = inc => { if (App.online && !App.net.isHost) App.net.toHost({ t:'inc', inc }); renderInstr(); };

function myBoatId(){ const R = App.race; if (!R) return null; return App.myRole === 'crew' ? 'p_' + App.crewOf : R.myId; }

  let mm = b.crew.find(x => x.pid === m.pid);

}
function setMyPos(o){ App.myPos = Object.assign({}, App.myPos, o); sendCrewPos(); }
function speak(text){
  if (!SEA.on || !window.speechSynthesis) return;
  try { const u = new SpeechSynthesisUtterance(text.replace(/\(.*\)/, '')); u.lang = LANG.cur === 'en' ? 'en-GB' : 'it-IT'; u.rate = 1.1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
function sendCall(code){
  const id = myBoatId(); if (!id) return;
  const m = { t:'call', id, code, name: App.prefs.nick || 'Velista' };
  handleCall(m);
  if (App.online){ if (App.net.isHost) App.net.broadcast(m); else App.net.toHost(m); }
}
function handleCall(m){
  const R = App.race; if (!R) return; const b = R.boat(m.id); if (!b) return;
  b.callCode = m.code; b.callText = callT(m.code); b.callUntil = performance.now() + 3500;
  if (myBoatId() !== m.id) return;                       // le chiamate delle altre barche si vedono solo nel fumetto
  const cat = R.me() ? R.me().cat : (b.cat || 'ragazzi');
  pushBanner({ key:'call', extra: m }, cat);
  speak(callT(m.code));
  if (m.code === 'pronti_virare' || m.code === 'pronti_strambare'){ App.tackCall = { code: m.code, t: performance.now() }; App.crewReady = false; }
  if (m.code === 'pronti') App.crewReady = true;
  if (m.code === 'vira' || m.code === 'strambo'){ App.tackCall = null; if (App.myRole === 'crew') App.mustSwitch = { t: performance.now(), from: b.tackSide, warned: false }; }
}
// il timoniere con equipaggio chiama prima la manovra, poi la esegue
function helmManeuver(){
  const R = App.race, b = R && R.me(); if (!b) return;
  if (!b.crew || !b.crew.length){ b.maneuver(); return; }
  const up = Math.abs(b.twa) < 100;
  const pend = App.tackCall && performance.now() - App.tackCall.t < 12000;
  if (!pend){ sendCall(up ? 'pronti_virare' : 'pronti_strambare'); return; }
  if (!App.crewReady) pushBanner({ key:'no_ready' }, b.cat);
  b.maneuver(); sendCall(up ? 'vira' : 'strambo'); App.tackCall = null;
}
function crewAdvice(b, pos){
  const w = b.tackSide || 1, light = b.tws < 8, a = Math.abs(b.twa);
  if (pos.side === -w && !light) return tb('Sei sottovento: spostati sul lato sopravvento, la barca sbanda.','You are to leeward: move to the windward side, the boat is heeling.');
  if (light && pos.hike) return tb('Poco vento: rientra dal trapezio, stare fuori frena la barca.','Light wind: come in off the trapeze, it slows the boat.');
  if (!light && (b.overload||0) > 1 && !pos.hike) return tb('La barca sbanda: esci al trapezio per tenerla piatta.','The boat is heeling: get out on the trapeze to keep her flat.');
  if (a < 70 && pos.fore < 0) return tb('In bolina sposta il peso in avanti.','Upwind, move your weight forward.');
  if (a > 100 && b.tws > 11 && pos.fore > 0) return tb('In poppa con vento forte sposta il peso indietro, o la prua affonda.','Downwind in strong wind move your weight aft, or the bow digs in.');
  if (light && pos.side === w && a < 90) return tb('Poco vento: puoi stare al centro o un po’ sottovento.','Light wind: you can sit in the middle or slightly to leeward.');
  return tb('Posizione giusta: barca piatta ed equilibrata.','Good position: boat flat and balanced.');

  const b = R.me(); if (!b) return;
  b.autoSheet = false; b.sheet = s;
}

function extraText(x){

  if (x.mark != null) return markName(x.mark);
  if (x.pin) return tx('boa di partenza','pin end mark');
  if (x.committee) return tx('barca del Comitato','committee boat');
  if (x.protest) return tx('protesta di ','protest by ') + x.protest;
  if (x.ocs) return tx('partenza anticipata','premature start');
  if (x.served) return tx('penalità scontata','penalty taken');
  return '';
}

  const x = T[key]; if (!x) return null;

function pushBanner(m, cat){
  const t = msgText(m, cat); if (!t) return;
  const el = $('banner');
  el.className = t.cls; el.innerHTML = t.html; el.style.display = 'block';
  if ($('game').classList.contains('on')){ const b1 = document.querySelector('.bar').getBoundingClientRect(), b2 = $('info').getBoundingClientRect(); el.style.top = Math.round(Math.max(b1.bottom, b2.bottom) + 6) + 'px'; }
  const len = el.textContent.length;
  App.bannerUntil = performance.now() + Math.min(11000, 3500 + len*35);
  if (t.cls === 'pen') beep(0.25, 330);
}

function renderInstr(){
  const d = $('instr'), R = App.race; if (!R || d.style.display !== 'block') return;
  const pend = [...App.protests.values()].filter(p => p.status === 'giuria');
  const done = [...App.protests.values()].filter(p => p.status !== 'giuria' && p.status !== 'aperta');
  $('bInstr').textContent = tx('Giuria','Jury') + (pend.length ? ` (${pend.length})` : '');
  const list = [...R.incidents].reverse().slice(0, 30);
  let h = `<h3>${tx('Proteste da decidere','Protests to decide')}</h3>`;
  h += pend.length ? pend.map(p => `<div class="pcase" data-p="${esc(p.id)}"><b>${esc(p.byName)}</b> ${tx('protesta','protests')} <b>${esc(p.againstName)}</b> · ${fmt(p.t)}
      <canvas></canvas><div class="sug"><b>${tx('Il gioco suggerisce','Game suggestion')}:</b> ${p.sug.ok ? tx('accogliere','uphold') : tx('respingere','dismiss')}. ${esc(tx(p.sug.it, p.sug.en))}</div>
      <button class="bprot" data-v="1">${tx('Accolta','Uphold')}</button><button class="bjury" data-v="0">${tx('Respinta','Dismiss')}</button></div>`).join('')
    : `<div class="hint">${tx('Nessuna protesta in attesa.','No protests waiting.')}</div>`;
  if (done.length) h += `<h3 style="margin-top:10px">${tx('Proteste decise','Decided protests')}</h3>` + done.map(p => `<div class="inc">${esc(p.byName)} → ${esc(p.againstName)}: <b>${statusText(p.status)}</b></div>`).join('');
  h += `<h3 style="margin-top:10px">${tx('Registro','Log')}</h3>` + (list.length ? list.map(i => `<div class="inc" data-id="${esc(i.id)}"><b>${fmt(i.t)}</b> ${esc(i.name)} · <b>${ruleN(i.rule)}</b> ${RULE_TXT[i.rule] ? esc(tx(RULE_TXT[i.rule].t, (RULE_EN[i.rule]||{}).t || '')) : ''} ${i.x ? '· ' + esc(extraText(i.x)) : ''}</div>`).join('') : `<div class="hint">${tx('Nessuna infrazione finora.','No infringements yet.')}</div>`);
  h += `<h3 style="margin-top:10px">${tx('Segui una barca','Follow a boat')}</h3>` + [...R.boats.values()].filter(b => !b.ghost).map(b => `<div class="inc" data-id="${esc(b.id)}"><span class="dot" style="display:inline-block;vertical-align:middle;background:${b.color}"></span> ${esc(b.name)} <span class="pill">${esc(CLASSES[b.cls].name)}</span></div>`).join('');
  d.innerHTML = h;
  d.querySelectorAll('.inc[data-id]').forEach(el => el.onclick = () => { App.rend.mode = 'follow'; App.rend.followId = el.dataset.id; App.rend.zoom = 1; });
  d.querySelectorAll('.pcase').forEach(el => {
    const p = App.protests.get(el.dataset.p);
    drawCase(el.querySelector('canvas'), p.enc);
    el.querySelectorAll('button').forEach(b => b.onclick = () => resolveProt(p, b.dataset.v === '1', true));
  });
}
function statusText(s){ return { accolta: tx('accolta','upheld'), respinta: tx('respinta','dismissed'), accettata: tx('44.1 accettato','44.1 taken'), giuria: tx('in giuria','with the jury'), aperta: tx('aperta','open') }[s] || s; }
// schema dell'incrocio nel momento di massimo avvicinamento
function drawCase(cv, enc){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = r.width, H = r.height;
  ctx.fillStyle = '#1d6fa3'; ctx.fillRect(0,0,W,H);
  const [A, B] = enc.boats;
  const cx = (A.x+B.x)/2, cy = (A.y+B.y)/2, sep = Math.hypot(A.x-B.x, A.y-B.y);
  const sc = Math.min(W, H) / Math.max(CLASSES[A.cls].len*3.2, sep*2.4);
  const P = (x, y) => [W/2 + (x-cx)*sc, H/2 + (y-cy)*sc];
  // vento
  ctx.save(); ctx.translate(26, 26); ctx.rotate(enc.twd*D2R); ctx.strokeStyle = '#7fd3ff'; ctx.fillStyle = '#7fd3ff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(0,10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(-6,6); ctx.lineTo(6,6); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui'; ctx.fillText(tx('vento','wind'), 12, 56);
  [[A, '#e53935', tx('doveva tenersi discosta','had to keep clear')], [B, '#43a047', tx('diritto di rotta','right of way')]].forEach(([b, col, lab]) => {
    const [x, y] = P(b.x, b.y), L = CLASSES[b.cls].len*sc, Bm = CLASSES[b.cls].beam*sc;
    ctx.save(); ctx.translate(x, y); ctx.rotate(b.h*D2R);
    ctx.fillStyle = b.color; ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,-L/2); ctx.quadraticCurveTo(Bm*0.6,-L*0.1,Bm*0.42,L/2); ctx.lineTo(-Bm*0.42,L/2); ctx.quadraticCurveTo(-Bm*0.6,-L*0.1,0,-L/2); ctx.fill(); ctx.stroke();
    const side = -(b.ts||1), ang = side*(b.sh||0.4)*85*D2R;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -L*0.2); ctx.lineTo(Math.sin(ang)*L*0.6, -L*0.2 + Math.cos(ang)*L*0.6); ctx.stroke();
    ctx.restore();
    let ux = x - W/2, uy = y - H/2; const n = Math.hypot(ux, uy); if (n < 1){ ux = b === A ? -1 : 1; uy = 0; } else { ux /= n; uy /= n; }
    const lx = clamp(x + ux*(L*0.6 + 40), 60, W - 60), ly = clamp(y + uy*(L*0.6 + 22), 14, H - 30);
    ctx.textAlign = 'center'; ctx.font = '800 11px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(`${b.name} · ${b.ts > 0 ? tx('mure a dritta','starboard') : tx('mure a sinistra','port')}`, lx, ly);
    ctx.font = '700 10.5px system-ui'; ctx.fillStyle = col === '#e53935' ? '#ffcdd2' : '#c8e6c9'; ctx.fillText(lab, lx, ly + 13);
  });
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '600 10px system-ui';
  ctx.fillText(`${ruleN(enc.rule)} · ${tx('distanza minima','closest gap')} ${enc.minD.toFixed(1)} m${enc.turned ? ' · ' + tx('ha dovuto cambiare rotta','had to change course') : ''}`, 8, H - 8);
}

//  CICLO DI GIOCO
// =====================================================================
function loop(now){
  requestAnimationFrame(loop);
  if (document.hidden) return;                     // in background ci pensa il worker
  const dt = Math.min(0.05, (now - App.lastT)/1000); App.lastT = now;
  const R = App.race;
  if (!R || !$('game').classList.contains('on')) return;
  simUpdate(R, dt);
  drawFrame(R, dt);
}
// Con la pagina in background il browser ferma il disegno: un worker continua a far avanzare
// la regata e a inviare i dati, così la flotta non si blocca se chi ospita cambia app.
function startBackgroundTicker(){
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},50)'], { type:'text/javascript' })));
    w.onmessage = () => {
      if (!document.hidden) return;
      const now = performance.now(), dt = Math.min(0.25, (now - App.lastT)/1000); App.lastT = now;
      const R = App.race; if (!R || !$('game').classList.contains('on')) return;
      for (let k = dt; k > 0; k -= 0.05) simUpdate(R, Math.min(0.05, k));
    };
  } catch(e){}
}
function simUpdate(R, dt){
  const me = R.me();
  // client online: se l'organizzatore non risponde, si mette tutto in pausa e si avvisa
  if (App.online && !App.net.isHost){
    App.hostWait = performance.now() - (App.lastTickAt || performance.now()) > 2500;
    if (App.hostWait) R.paused = true;
  }

  if (me && !me.finished){
    const rud = (App.input.keyR - App.input.keyL) || App.input.touch;
    if (rud !== 0 && me.auto) me.auto = null;
    me.rudder = rud * (me.cat === 'bambini' ? 0.8 : 1);
    if (App.input.sheetKey){ me.autoSheet = false; me.sheet = clamp(me.sheet + App.input.sheetKey*0.6*dt, 0, 1); }
  } else if (me) me.rudder = 0;
  if (App.myRole === 'crew' && App.input.sheetKey) setMySheet(clamp((App.crewSheet ?? 0.4) + App.input.sheetKey*0.6*dt, 0, 1));

  // fantasma: segue la traccia registrata
  const gb = R.boat('ghost');
  if (gb && gb.track && R.t >= 0){
    const tr = gb.track; let i = 0; while (i < tr.length - 1 && tr[i+1][0] < R.t) i++;
    const a = tr[i], b = tr[Math.min(i+1, tr.length-1)], f = b[0] > a[0] ? clamp((R.t - a[0])/(b[0]-a[0]), 0, 1) : 0;
    gb.tx = lerp(a[1], b[1], f); gb.ty = lerp(a[2], b[2], f); gb.th = norm360(a[3] + norm180(b[3]-a[3])*f); gb.speed = a[4] || 0;
    if (gb.x === 0 && gb.y === 0){ gb.x = gb.tx; gb.y = gb.ty; }
    gb.finished = R.t > tr[tr.length-1][0];
  }

  const sig = R.step(dt);
  if (sig){
    pushBanner({ key: 'sig_' + sig }, me ? me.cat : R.fleetCat);
    if (sig === 'unminuto') beep(1.1, 660); else beep(0.35, 880);
    renderInstr();
  }
  while (R.msgs.length){ const m = R.msgs.shift(); pushBanner(m, me ? me.cat : R.fleetCat); renderInstr(); }
  if (performance.now() > App.bannerUntil) $('banner').style.display = 'none';

  // registrazione della traccia per il fantasma
  if (App.ghostRec && me && R.t >= 0 && !me.finished && R.t - App.ghostRec.lastT > 0.25){
    App.ghostRec.lastT = R.t; App.ghostRec.pts.push([+R.t.toFixed(2), +me.x.toFixed(1), +me.y.toFixed(1), +me.hdg.toFixed(0), +me.speed.toFixed(1)]);
  }

  // lettura del campo: raffiche in arrivo e buchi di vento
  if (me && !me.finished && (me.started || R.training)){
    if (me.gust > 0.45 && App.gustWas <= 0.45 && R.t - App.gustT > 25){
      App.gustT = R.t;
      if (me.cat !== 'bambini') pushBanner({ key: Math.abs(me.twa) < 80 ? 'gust_up' : 'gust_down' }, me.cat);
    }
    App.gustWas = me.gust;
    if (R.t - App.gustWarnT > 35){
      for (const p of R.wind.puffs){
        if (p.lull) continue;
        const q = R.wind.puffPos(p, R.t), up = dirVec(me.twd);
        const rx = q.x - me.x, ry = q.y - me.y, along = rx*up.x + ry*up.y, side = Math.abs(rx*up.y - ry*up.x);
        if (along > p.rad*0.6 && along < p.rad + 30 && side < p.rad*0.8){ App.gustWarnT = R.t; pushBanner({ key:'gust_coming' }, me.cat); break; }
      }
      const w = R.wind.at(me.x, me.y, R.t);
      if (w.tws < 8.2 && me.speed < me.C.vmax*0.5 && R.t - App.gustWarnT > 35){ App.gustWarnT = R.t; pushBanner({ key:'lull' }, me.cat); }
    }
  }

  // missione in corso
  if (App.mission && !App.mission.done && me){
    const st = App.mission.st; if (!R.paused && (R.training || R.t >= -60)) st.time += dt;
    const res = App.mission.M.check(st, R, me, dt);
    if (res) setTimeout(() => missionDone(res), 600), App.mission.done = true;
  }

  // rete
  sendNet(R, me);
}
function sendNet(R, me){
  const t = performance.now();
  if (App.myRole === 'crew' && t - (App._lastPos || 0) > 2000) sendCrewPos();
  if (App.online && t - App.lastSend > 80){
    App.lastSend = t;
    if (App.net.isHost) App.net.broadcast({ t:'tick', rt: +R.t.toFixed(2), p: R.paused ? 1 : 0, b: [...R.boats.values()].filter(b => !b.ghost).map(b => b.pack()) });
    else if (me) App.net.toHost({ t:'st', b: me.pack() });
  }

}
function freeArea(){
  // zona di mare non coperta dai pannelli: la barca va centrata lì
  const W = innerWidth, H = innerHeight, r = id => { const el = id === 'bar' ? document.querySelector('.bar') : $(id); const c = el.getBoundingClientRect(); return c.width && c.height ? c : null; };
  const bar = r('bar'), info = r('info'), inst = r('instCard'), ctrl = r('ctrlCol'), sheet = r('sheetCol');
  let top = Math.max(bar ? bar.bottom : 0, info ? info.bottom : 0), bottom = H, left = 0, right = W;
  if (W < H){ bottom = Math.min(inst ? inst.top : H, ctrl ? ctrl.top : H); }
  else { bottom = Math.min(H, inst ? inst.top + 40 : H); right = Math.min(sheet ? sheet.left : W, W); top = bar ? bar.bottom : 0; }
  return { x: (left + right)/2, y: (top + bottom)/2, w: right - left, h: Math.max(80, bottom - top) };
}
function drawFrame(R, dt){
  const me = R.me();
  if (!App._faT || performance.now() - App._faT > 500){ App._faT = performance.now(); App.rend.free = freeArea(); placePip(); }
  App.rend.updateCamera(R, dt);
  const viewB = R.boat(App.rend.mode === 'follow' && App.rend.followId ? App.rend.followId : App.viewId) || me;
  const vcat = viewB ? viewB.cat : R.fleetCat;
  const C = CATEGORIES[vcat in CATEGORIES ? vcat : 'ragazzi'];
  App.rend.draw(R, { viewId: viewB && viewB.id, zone: C.zone, laylines: C.laylines, nogo: vcat === 'bambini', showTeams: R.S.mode === 'squadre' });
  if (me && vcat !== 'adulti') drawRow(R, me);
  App.rend.drawEdgeArrow(R, viewB);
  App.rend.drawDial(viewB, R.wind.at(0,0,R.t).twd);
  SEA.update(viewB, !R.paused && !R.over && $('game').classList.contains('on'));
  if (App.pip.mode !== 'off') App.pip.draw(R, viewB);

// anelli di precedenza attorno alle barche vicine (verde: hai diritto; rosso: tieniti discosto)
function drawRow(R, me){
  const ctx = App.rend.ctx, s = App.rend.cam.s;
  for (const o of R.boats.values()){
    if (o === me || o.finished || o.ghost || me.finished) continue;
    const d = Math.hypot(o.x - me.x, o.y - me.y);
    if (d > 6*Math.max(me.C.len, o.C.len)) continue;
    const row = R.rightOfWay(me, o); if (!row) continue;
    const mine = row.kc === me;
    const c = App.rend.w2s(o.x, o.y), rr = Math.max(18, o.C.len*s*0.9);
    const a = clamp(1 - d/(6*Math.max(me.C.len, o.C.len)), 0.25, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = mine ? '#ff5252' : '#69f0ae'; ctx.lineWidth = 3; ctx.setLineDash([7,5]);
    ctx.beginPath(); ctx.arc(c.x, c.y, rr, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    App.rend.label(c.x, c.y + rr + 12, (mine ? tx('Tieniti discosto','Keep clear') : tx('Hai diritto di rotta','Right of way')) + ' · ' + ruleN(row.rule).replace(/Regola |Rule /, 'R'), mine ? '#c62828' : '#2e7d32', '#fff');
    ctx.restore();
  }
}

function positionOf(R, b){
  const score = x => {
    if (x.finished) return 1e7 - x.finishTime;
    if (!x.started) return -1e6 + (-x.y);
    const tgt = x.nextMark < R.marks.length ? R.marks[x.nextMark] : { x:0, y:0 };
    return x.nextMark * 1e4 - Math.hypot(tgt.x - x.x, tgt.y - x.y);
  };
  const s = score(b); let p = 1;
  for (const o of R.boats.values()) if (o !== b && !o.ghost && score(o) > s) p++;
  return p;
}

    } else if (el != null) h += `<h2>${tx('Tempo','Time')}: ${fmt(el)}</h2><p>${tx('Record da battere','Record to beat')}: <b>${fmt(old.time)}</b> (${tx('ti mancano','you are')} ${(el - old.time).toFixed(1)} s${LANG.cur === 'en' ? ' behind' : ''})</p>`;
  }
  if (res.mode === 'sfida' && res.sfida){
    const s = res.sfida;
    h += `<h2>${s.win ? '🏆 ' + tx('Sfida superata!','Challenge won!') : tx('Sfida non riuscita… riprovate!','Challenge failed… try again!')}</h2>
      <p style="font-size:28px;margin:4px 0;color:#f9a825">${'★'.repeat(s.stars)}<span style="opacity:.25">${'★'.repeat(3 - s.stars)}</span></p>
      <p>${tx('Arrivate entro','Finished within')} ${fmt(s.target)}: <b>${s.ok}/${s.total}</b> · ${tx('penalità della flotta','fleet penalties')}: <b>${s.pens}</b></p>`;
  }
  if (res.mode === 'squadre' && res.teams){
    const [a, b] = res.teams;
    h += `<h2>${a === b ? tx('Pareggio!','Draw!') : (a < b ? '● ' + tx('Vince la Squadra Blu','Blue team wins') : '◆ ' + tx('Vince la Squadra Gialla','Yellow team wins'))}</h2>
      <p>${tx('Punti (somma dei piazzamenti, vince chi ne ha meno)','Points (sum of places, lowest wins)')}: ● ${tx('Blu','Blue')} <b>${a}</b> · ◆ ${tx('Gialla','Yellow')} <b>${b}</b></p>`;
  }
  h += `<table><tr><th>#</th><th>${tx('Barca','Boat')}</th><th>${tx('Classe','Class')}</th><th>${tx('Tempo','Time')}</th>${res.mixed ? `<th>${tx('Compensato','Corrected')}</th>` : ''}<th>${tx('Pen.','Pen.')}</th></tr>` +
    res.rows.map(r => `<tr${me && r.id === me.id ? ' style="background:#fff6d6"' : ''}><td>${r.fin ? r.pos : '–'}</td>
      <td><span class="dot" style="display:inline-block;vertical-align:middle;background:${r.color}"></span> ${res.mode === 'squadre' ? (r.team ? '◆ ' : '● ') : ''}${esc(r.name)}${r.bot ? ' <span class="pill">PC</span>' : ''}</td>
      <td>${esc(CLASSES[r.cls].name)}${res.mixed ? ' · ' + esc(catShort(r.cat)) : ''}</td>
      <td>${r.fin ? fmt(r.el) : tx('non arrivata','DNF')}</td>${res.mixed ? `<td>${r.fin ? fmt(r.corr) : ''}</td>` : ''}
      <td>${r.served ? r.served + tx(' scontate',' taken') : ''}${r.pen ? ' ' + r.pen + tx(' non scontate',' not taken') + ' (+' + r.pen*15 + ' s)' : ''}</td></tr>`).join('') + '</table>';
  if (res.mixed) h += `<p class="hint">${tx('Tempo compensato: il tempo reale è corretto in base alla velocità della classe' + (R && R.S.cat === 'mista' ? ' e alla categoria (bambini ×0,82, ragazzi ×0,92, adulti ×1)' : '') + ', così barche e velisti diversi si sfidano alla pari.', 'Corrected time: real time is adjusted for the class speed' + (R && R.S.cat === 'mista' ? ' and the category (children ×0.82, youth ×0.92, adults ×1)' : '') + ', so different boats and sailors race on equal terms.')}</p>`;
  const prots = [...App.protests.values()];
  if (prots.length){
    h += `<h2 style="margin-top:14px">${tx('Proteste','Protests')}</h2>` + prots.map(p => `<div class="rulecard"><b>${esc(p.byName)} → ${esc(p.againstName)}</b> · ${ruleN(p.enc.rule)} · <b>${statusText(p.status)}</b>${p.verdict ? '<br>' + tb(esc(p.verdict.it), esc(p.verdict.en)) : ''}</div>`).join('');
  }
  const incs = R ? R.incidents.filter(i => i.rule !== 'r442') : [];
  if (incs.length){
    h += `<h2 style="margin-top:14px">${tx('Cosa è successo in acqua','What happened on the water')}</h2>` + incs.slice(-12).map(i => `<div class="rulecard"><b>${esc(i.name)}</b> · ${ruleN(i.rule)} – ${RULE_TXT[i.rule] ? ruleT(i.rule) : i.rule} ${i.x ? '· ' + esc(extraText(i.x)) : ''}</div>`).join('');
  }
  $('resBody').innerHTML = h;
  const host = isHost();
  $('resAgain').textContent = host ? tx('Nuova regata','New race') : tx('Torna nella stanza','Back to the room');
  $('resAgain').onclick = () => {
    if (!App.online){ App.race = null; openSetup(false); return; }
    if (App.net.isHost){ App.race = null; App.net.broadcast({ t:'back', roster: App.roster }); openLobby(App.net.code); }
    else { App.race = null; openLobby(App.net.code); }
  };
  $('resMenu').onclick = () => leaveGame();
  show('results');
}

function startQuiz(){
  const idx = QUIZ.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 10);
  let i = 0, score = 0;
  const box = $('quiz');
  const render = () => {
    if (i >= idx.length){ Progress.onQuizEnd(score, idx.length); box.innerHTML = `<h2>${tx(`Hai risposto bene a ${score} domande su ${idx.length}!`, `You got ${score} out of ${idx.length} right!`)}</h2><p>${score >= 8 ? tx('Sei pronto per la regata!','You are ready to race!') : tx('Ripassa le schede e riprova.','Review the cards and try again.')}</p><button class="btn acc" id="qAgain">${tx('Rifai il quiz','Try again')}</button>`; $('qAgain').onclick = startQuiz; return; }
    const q = QUIZ[idx[i]], e = QUIZ_EN[idx[i]] || q;
    box.innerHTML = `<div class="hint">${tx('Domanda','Question')} ${i+1} / ${idx.length}</div><h2>${tb(esc(q.q), esc(e.q))}</h2>` + q.a.map((a,k) => `<button data-k="${k}">${tb(esc(a), esc(e.a[k]))}</button>`).join('') + '<div id="qWhy"></div>';
    box.querySelectorAll('button[data-k]').forEach(btn => btn.onclick = () => {
      if (box.dataset.done === '1') return; box.dataset.done = '1';
      const k = +btn.dataset.k;
      box.querySelectorAll('button[data-k]').forEach(x => { if (+x.dataset.k === q.ok) x.classList.add('ok'); else if (x === btn) x.classList.add('no'); });
      if (k === q.ok) score++;
      Progress.onQuiz(k === q.ok);
      $('qWhy').innerHTML = `<p class="hint" style="font-size:14px"><b>${k === q.ok ? tx('Giusto!','Right!') : tx('Non proprio.','Not quite.')}</b> ${tb(esc(q.why), esc(e.why))}</p><button class="btn" id="qNext">${tx('Avanti','Next')}</button>`;
      $('qNext').onclick = () => { i++; box.dataset.done = '0'; render(); };
    });
  };
  box.dataset.done = '0'; render();
}

    const it2en = Math.random() < 0.5 || LANG.cur !== 'en';
    const pick = GLOSSARY[Math.floor(Math.random()*GLOSSARY.length)];
    const opts = [pick]; while (opts.length < 3){ const g = GLOSSARY[Math.floor(Math.random()*GLOSSARY.length)]; if (!opts.includes(g)) opts.push(g); }
    opts.sort(() => Math.random() - 0.5);
    const q = it2en ? tx(`Come si dice <b>“${pick[0]}”</b> in inglese?`, `What is the English for <b>“${pick[0]}”</b>?`) : tx(`Che cosa vuol dire <b>“${pick[1]}”</b>?`, `What does <b>“${pick[1]}”</b> mean in Italian?`);
    box.innerHTML = `<div class="hint">${n+1} / 8</div><h2>${q}</h2>` + opts.map((o,k) => `<button data-k="${k}">${esc(it2en ? o[1] : o[0])}</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (box.dataset.done === '1') return; box.dataset.done = '1';
      const ok = opts[+b.dataset.k] === pick; if (ok) score++;
      Progress.onVocab(ok);
      box.querySelectorAll('button').forEach(x => { if (opts[+x.dataset.k] === pick) x.classList.add('ok'); else if (x === b) x.classList.add('no'); });
      setTimeout(() => { n++; box.dataset.done = '0'; ask(); }, 900);
    });
  };
  ask();
}

  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
